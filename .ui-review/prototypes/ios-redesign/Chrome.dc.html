<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;pointer-events:none;color:var(--tx);font-family:var(--sans)">
<sc-if value="{{ bar }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;box-sizing:border-box">
<div style="width:58px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.3px">{{ time }}</div>
<div style="display:flex;align-items:center;gap:6px">
<div style="display:flex;align-items:flex-end;gap:1.5px;height:12px"><div style="width:3px;height:4px;border-radius:1px;background:currentColor"></div><div style="width:3px;height:6px;border-radius:1px;background:currentColor"></div><div style="width:3px;height:8.5px;border-radius:1px;background:currentColor"></div><div style="width:3px;height:11px;border-radius:1px;background:currentColor"></div></div>
<svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
<div style="display:flex;align-items:center;gap:1px"><div style="width:25px;height:12px;border-radius:4px;border:1px solid var(--t3);box-sizing:border-box;padding:1.5px;display:flex"><div style="width:80%;border-radius:2px;background:currentColor"></div></div><div style="width:1.5px;height:4px;border-radius:0 1px 1px 0;background:var(--t3)"></div></div>
</div>
</div>
</sc-if>
<sc-if value="{{ island }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;top:11px;left:50%;margin-left:-63px;width:126px;height:37px;border-radius:19px;background:#000"></div></sc-if>
<sc-if value="{{ home }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--tx)"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:41&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;noIsland&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;noHome&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;noBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { time: p.time ?? '9:41', bar: !p.noBar, island: !p.noIsland, home: !p.noHome };
  }
}
</script>
</body>
</html>
