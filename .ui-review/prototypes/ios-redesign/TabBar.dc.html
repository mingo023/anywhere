<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:100px;font-family:var(--sans)">
<div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent,var(--bg) 62%);pointer-events:none"></div>
<div style="position:absolute;left:21px;right:21px;bottom:29px;height:62px;border-radius:31px;background:var(--glass);border:.5px solid var(--gb);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 8px 30px rgba(0,0,0,.22);display:flex;align-items:center;padding:0 4px;box-sizing:border-box">

<div style="flex:1;height:54px;border-radius:27px;background:{{ tIn.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:{{ tIn.color }}"><div style="position:relative;display:flex"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><sc-if value="{{ tIn.badge }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-5px;left:14px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:var(--on);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">{{ tIn.badge }}</div></sc-if><sc-if value="{{ tIn.dot }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-2px;left:18px;width:9px;height:9px;border-radius:5px;background:var(--ink);box-shadow:0 0 0 2px var(--sf)"></div></sc-if></div><div style="font-size:10px;font-weight:600;letter-spacing:.1px">Inbox</div></div>
<div style="flex:1;height:54px;border-radius:27px;background:{{ tSe.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:{{ tSe.color }}"><div style="position:relative;display:flex"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg><sc-if value="{{ tSe.badge }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-5px;left:14px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:var(--on);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">{{ tSe.badge }}</div></sc-if><sc-if value="{{ tSe.dot }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-2px;left:18px;width:9px;height:9px;border-radius:5px;background:var(--ink);box-shadow:0 0 0 2px var(--sf)"></div></sc-if></div><div style="font-size:10px;font-weight:600;letter-spacing:.1px">Sessions</div></div>
<div style="flex:1;height:54px;border-radius:27px;background:{{ tPr.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:{{ tPr.color }}"><div style="position:relative;display:flex"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/></svg><sc-if value="{{ tPr.badge }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-5px;left:14px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:var(--on);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">{{ tPr.badge }}</div></sc-if><sc-if value="{{ tPr.dot }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-2px;left:18px;width:9px;height:9px;border-radius:5px;background:var(--ink);box-shadow:0 0 0 2px var(--sf)"></div></sc-if></div><div style="font-size:10px;font-weight:600;letter-spacing:.1px">PRs</div></div>
<div style="flex:1;height:54px;border-radius:27px;background:{{ tMa.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:{{ tMa.color }}"><div style="position:relative;display:flex"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z"/><path d="M20.054 15.987H3.946"/></svg><sc-if value="{{ tMa.badge }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-5px;left:14px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:var(--on);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">{{ tMa.badge }}</div></sc-if><sc-if value="{{ tMa.dot }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-2px;left:18px;width:9px;height:9px;border-radius:5px;background:var(--ink);box-shadow:0 0 0 2px var(--sf)"></div></sc-if></div><div style="font-size:10px;font-weight:600;letter-spacing:.1px">Machines</div></div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inbox&quot;,&quot;sessions&quot;,&quot;prs&quot;,&quot;machines&quot;],&quot;default&quot;:&quot;inbox&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;inbox&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;prs&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, a = p.active || 'inbox';
    const t = (k, b) => ({ badge: b || '', color: k === a ? 'var(--tint)' : 'var(--t2)', bg: k === a ? 'var(--fill)' : 'transparent', dot: k === 'machines' && !!p.dot });
    return { tIn: t('inbox', p.inbox), tSe: t('sessions'), tPr: t('prs', p.prs), tMa: t('machines') };
  }
}
</script>
</body>
</html>
