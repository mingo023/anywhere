<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spaces · machines in Anywhere — design prototype</title>
<style>
:root{
  /* Solarized Light (packages/desktop/themes/solarized-light.json) */
  --text:#073642;--text-body:#365b61;--text-2:#566c73;--text-3:#657b83;--text-4:#93a1a1;--text-5:#b0bab0;--text-6:#d1d3c6;--on-text:#fdf6e3;
  --window:#eee8d5;--surface:#fdf6e3;--page:#f9f2df;--side:#f6efdcb3;--popover:#fdf6e3;--highlight:#fffffff2;--shadow:#00000024;
  --fill-1:#07364208;--fill-2:#0736420b;--fill-3:#0736420e;--fill-4:#07364211;--separator:#07364217;--separator-strong:#0736421f;--accent-bg:#0736421c;
  --waiting:#947000;--waiting-text:#826300;--waiting-dot:#b58900;--success:#7a8d00;--success-text:#606e00;--failed:#dc322f;--failed-text:#c42c2a;--failed-bg:#dc322f1c;--working:#cb4b16;--claude:#d97757;
}
:root[data-theme=graphite]{
  --text:#111113;--text-body:#3f3f46;--text-2:#6f6f78;--text-3:#8b8b94;--text-4:#a1a1aa;--text-5:#b4b4bc;--text-6:#d4d4d8;--on-text:#fff;
  --window:#f4f4f5;--surface:#fff;--page:#f7f7f7;--side:#fafafbb3;--popover:#fff;
  --fill-1:#11111308;--fill-2:#1111130b;--fill-3:#1111130e;--fill-4:#11111311;--separator:#11111317;--separator-strong:#1111131f;--accent-bg:#1111131c;
  --waiting:#ad5700;--waiting-text:#ad5700;--waiting-dot:#ffb224;--success:#2b9a66;--success-text:#18794e;--failed:#cd2b31;--failed-text:#cd2b31;--failed-bg:#e5484d1c;--working:#cc4e00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);background:var(--window);font-size:13px;height:100vh;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;text-align:left}
svg.i{flex:none;display:block}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
.app{display:flex;height:100vh}
.grow{flex:1;min-width:0}

/* ---------- sidebar (ui::side, sidebar_row 28px) ---------- */
.side{width:272px;flex:none;background:var(--side);border-right:.5px solid var(--separator);display:flex;flex-direction:column;padding:0 10px;position:relative}
.top{height:40px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--text-3)}
.search{height:32px;flex:none;margin:2px 0 8px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:9px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong);color:var(--text-3);font-size:13.5px}
.search kbd{margin-left:auto;font:inherit;font-size:11.5px;color:var(--text-4)}
.row{height:28px;flex:none;padding:0 6px;display:flex;align-items:center;gap:8px;border-radius:8px;font-size:13.5px;white-space:nowrap;position:relative;cursor:default}
.row:hover{background:var(--fill-2)}
.row.on{background:var(--fill-4)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.nav{color:var(--text-2)}
.row .acts{display:none;gap:6px;color:var(--text-3)}
.row:hover .acts{display:flex}
.row:hover .meta{display:none}
.child{padding-left:32px}
.child .lead{position:absolute;left:12px;top:7px;width:14px;display:flex;justify-content:center}
.child.dim{color:var(--text-3)}
.stat{font-size:12px}.stat .a{color:var(--success-text)}.stat .d{color:var(--failed-text);margin-left:6px}
.sh{height:28px;flex:none;margin:6px 0 2px;padding:0 6px;display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
.sh>span:first-child{flex:1}
.sh .b{display:flex;cursor:pointer}
.sh .b:hover{color:var(--text)}
.list{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -4px;padding:0 4px 8px}
.grp{margin-bottom:8px}
.tile{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px;font-weight:600;color:var(--text-2);background:var(--surface);box-shadow:inset 0 0 0 .5px var(--separator-strong)}
.tile.e{font-size:12px}
.dot{width:6px;height:6px;border-radius:3px;flex:none;background:var(--success)}
.dot.off{background:var(--text-5)}
.dot.wait{background:var(--waiting-dot)}
.dot.bad{background:var(--failed)}
.sdot{width:7px;height:7px;border-radius:4px;background:var(--waiting-dot)}
.spin{width:9px;height:9px;border-radius:5px;border:1.5px solid var(--working);border-right-color:transparent;animation:sp .8s linear infinite}
.spin.big{width:13px;height:13px;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{0%{background:var(--accent-bg)}100%{background:transparent}}

/* space header + switcher */
.space{height:34px;flex:none;margin:8px 0 0;padding:0 6px;display:flex;align-items:center;gap:8px;border-radius:8px;cursor:pointer;position:relative}
.space:hover{background:var(--fill-2)}
.space .sw-ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff}
.space b{font-size:14px;font-weight:600}
.space .h{font-size:12px;color:var(--text-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.space .car{color:var(--text-4)}
.switcher{flex:none;display:flex;align-items:center;gap:2px;padding:6px 0 10px;border-top:.5px solid var(--separator);margin:0 -10px;padding-left:8px;padding-right:8px}
.sw{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-3);position:relative}
.sw:hover{background:var(--fill-2)}
.sw.on{background:var(--fill-4);color:var(--text)}
.sw .pip{position:absolute;left:50%;bottom:1px;width:12px;height:2.5px;border-radius:2px;transform:translateX(-50%)}
.sw .dot{position:absolute;right:5px;bottom:6px;box-shadow:0 0 0 1.5px var(--window)}
.sw .badge{position:absolute;right:1px;top:1px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--waiting-dot);color:#171717;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sw.fresh{animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.pane{animation:slide .22s cubic-bezier(.22,1,.36,1)}
.pane.l{animation-name:slidel}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes slidel{from{opacity:0;transform:translateX(-24px)}}
.offline{margin:4px 0 10px;padding:10px 12px;border-radius:10px;background:var(--fill-2);font-size:12px;color:var(--text-3);display:flex;flex-direction:column;gap:8px}
.offline b{color:var(--text);font-weight:500;font-size:12.5px;display:flex;align-items:center;gap:6px}
.empty{margin:20px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--text-3);font-size:12.5px}
.empty b{color:var(--text);font-weight:500}

/* ---------- menus (ui::pop) ---------- */
.pop{background:var(--popover);border-radius:12px;box-shadow:0 0 0 .5px var(--separator),inset 0 1px 0 var(--highlight),0 18px 50px var(--shadow),0 2px 6px #0000000f}
.menu{position:absolute;z-index:20;padding:5px;display:flex;flex-direction:column;gap:1px;animation:menuin .15s cubic-bezier(.22,1,.36,1)}
.menu.up{animation-name:menuup}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}}
@keyframes menuup{from{opacity:0;transform:translateY(4px)}}
.ml{padding:6px 10px 2px;font-size:11.5px;font-weight:500;color:var(--text-3)}
.md{height:.5px;margin:4px 8px;background:var(--separator);flex:none}
.mp{height:32px;padding:0 10px;display:flex;align-items:center;gap:10px;border-radius:8px;font-size:13.5px;white-space:nowrap;cursor:pointer;color:var(--text)}
.mp:hover{background:var(--fill-2)}
.mp .lead{width:14px;display:flex;justify-content:center;flex:none;color:var(--text-2)}
.mp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mp .h{font-size:11.5px;color:var(--text-4)}
.mp.off{color:var(--text-4);cursor:default}.mp.off:hover{background:none}
.mp.danger{color:var(--failed)}.mp.danger .lead{color:var(--failed)}.mp.danger:hover{background:var(--failed-bg)}
.ar{padding:7px 8px;display:flex;align-items:center;gap:9px;border-radius:6px;cursor:pointer}
.ar:hover,.ar.on{background:var(--fill-2)}
.ar .g{align-self:flex-start;padding-top:1px;color:var(--text-2)}
.ar .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ar .l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.ar .h{font-size:11.5px;color:var(--text-3)}
.ar .ck{width:16px;display:flex;justify-content:flex-end;flex:none}
.ar.off{cursor:default}.ar.off:hover{background:none}.ar.off .l,.ar.off .g{color:var(--text-4)}
.swatches{display:flex;gap:6px;padding:4px 10px 6px}
.swatch{width:16px;height:16px;border-radius:8px;cursor:pointer;box-shadow:inset 0 0 0 .5px #00000026}
.swatch.on{box-shadow:0 0 0 2px var(--popover),0 0 0 3.5px var(--text-3)}

/* ---------- page ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page)}
.bar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--text-3);border-bottom:.5px solid transparent}
.bar b{color:var(--text);font-weight:600}
.bar .crumb{display:flex;align-items:center;gap:5px}
.body{flex:1;position:relative;display:flex;justify-content:center;background-image:radial-gradient(var(--text-6) .9px,transparent 1px);background-size:14px 14px;background-position:7px 7px;overflow:auto}
.content{width:600px;margin-top:20vh;display:flex;flex-direction:column;align-items:center}
h1{font-size:21px;line-height:25px;font-weight:600}
.frame{width:100%;margin-top:20px;background:var(--surface);border-radius:16px;box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a,0 8px 24px #0000000d}
.ptext{padding:11px 9px 0}
.ptext textarea{width:100%;border:0;outline:0;resize:none;background:none;font:inherit;font-size:14.5px;line-height:22px;color:var(--text);padding:0 7px;height:66px}
.ptext textarea::placeholder{color:var(--text-4)}
.pbar{display:flex;align-items:center;gap:4px;padding:4px 11px 11px}
.pill{height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 7px;border-radius:9px;font-size:12.5px;color:var(--text-2)}
.pill:hover{background:var(--fill-2)}
.pill b{font-weight:500;color:var(--text)}
.ib{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.ib:hover{background:var(--fill-2)}
.send{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--on-text)}
.send.off{background:var(--fill-4);color:var(--text-4);cursor:default}
.foot-row{width:100%;margin-top:10px;display:flex;align-items:center;gap:2px;font-size:13px}
.pw{position:relative}
.chip{height:30px;padding:0 8px 0 10px;display:flex;align-items:center;gap:7px;border-radius:8px;background:var(--fill-2);white-space:nowrap;font-weight:500}
.chip:hover,.chip[data-open]{background:var(--fill-3)}
.chip.dim{opacity:.5;cursor:default}
.sepdot{color:var(--text-4);padding:0 4px}
.notice{width:100%;margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--waiting-text)}
.notice a{color:var(--text);font-weight:500;text-decoration:underline;cursor:pointer}

/* session view */
.chat{width:680px;margin-top:28px;display:flex;flex-direction:column;gap:14px}
.where{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--fill-2);font-size:12px;color:var(--text-2)}
.bubble{align-self:flex-end;max-width:520px;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong);font-size:14px;line-height:21px}
.reply{display:flex;gap:10px;align-items:center;color:var(--text-2);font-size:13.5px}

/* buttons (ui::button, pills) */
.btn{height:28px;padding:0 13px;border-radius:14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.sm{height:26px;padding:0 11px;font-size:12.5px}
.btn.lg{height:36px;padding:0 18px;border-radius:18px;font-size:14px}
.btn.primary{background:var(--text);color:var(--on-text)}
.btn.secondary{background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a}
.btn.ghost{background:var(--fill-2)}
.btn.ghost:hover{background:var(--fill-3)}
.btn.danger{background:var(--failed);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- settings › hosts ---------- */
.snav{width:272px;flex:none;background:var(--side);border-right:.5px solid var(--separator);padding:0 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.snav .row{color:var(--text)}
.snav .grpl{padding:14px 8px 4px;font-size:12px;color:var(--text-3)}
.sbody{flex:1;overflow:auto}
.scontent{width:640px;margin:28px auto 60px}
.shead{display:flex;gap:14px;align-items:center;margin-bottom:26px}
.shead .ic{width:40px;height:40px;border-radius:10px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a;display:flex;align-items:center;justify-content:center;color:var(--text)}
.shead b{display:block;font-size:22px;font-weight:600;line-height:28px}
.shead span{font-size:13px;color:var(--text-3)}
.slabel{font-size:13px;font-weight:500;color:var(--text-2);margin:0 2px 8px}
.card{background:var(--surface);border-radius:12px;box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a;overflow:hidden}
.hrow{padding:9px 14px;display:flex;align-items:center;gap:12px}
.hrow+.hrow,.card>*+*{border-top:.5px solid var(--separator)}
.htile{width:28px;height:28px;border-radius:7px;background:var(--fill-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none;position:relative}
.htile .c{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:5px;box-shadow:0 0 0 1.5px var(--surface)}
.htx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.htx .n{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.htx .l{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:16px;color:var(--text-3)}
.htx .l .dot{width:7px;height:7px;border-radius:4px;margin-top:4.5px}
.here{font-size:13px;color:var(--text-3)}
.hacts{display:flex;gap:8px;align-items:center}
.steps{padding:4px 14px 12px 54px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-2)}
.steps .st{display:flex;align-items:center;gap:8px}
.steps .st.todo{color:var(--text-4)}
.steps .st .ok{color:var(--success)}
.steps .done{display:flex;align-items:center;gap:8px;margin-top:4px}
.form{padding:14px;display:flex;flex-direction:column;gap:12px}
.form .t{font-size:13px;font-weight:500}
.sugg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.sugg button{height:24px;padding:0 10px;border-radius:12px;background:var(--fill-2);font-size:12.5px;color:var(--text)}
.sugg button:hover{background:var(--fill-3)}
.fields{display:flex;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;flex:1}
.field label{font-size:12px;color:var(--text-2)}
.field input{height:26px;padding:0 9px;border-radius:7px;background:var(--fill-2);font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px}
.field input::placeholder{color:var(--text-4)}
.hint{font-size:12px;color:var(--text-3)}
.hint a{color:var(--text);text-decoration:underline;cursor:pointer}
.err{font-size:12px;color:var(--failed-text)}
.ffoot{display:flex;align-items:center;gap:8px}
.ffoot .hint{flex:1}
.pwrow{padding:2px 14px 12px 54px;display:flex;gap:8px;align-items:center}
.pwrow input{flex:1;height:26px;padding:0 9px;border-radius:7px;background:var(--fill-2);font-size:12.5px}

/* ---------- modals ---------- */
.backdrop{position:fixed;inset:0;background:#0000002e;display:flex;align-items:center;justify-content:center;z-index:30;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{width:480px;padding:24px 24px 22px;border-radius:16px;display:flex;flex-direction:column;animation:modalin .2s cubic-bezier(.22,1,.36,1)}
@keyframes modalin{from{opacity:0;transform:scale(.97)}}
.modal h2{font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal .lab{font-size:12.5px;font-weight:500;color:var(--text-2);margin:0 0 7px}
.fbox{height:38px;padding:0 6px 0 12px;display:flex;align-items:center;gap:10px;border-radius:10px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong);color:var(--text-3)}
.fbox input{flex:1;min-width:0;font-family:"Geist Mono",ui-monospace,monospace;font-size:13px;color:var(--text)}
.fbox .in{flex:1;font-family:"Geist Mono",ui-monospace,monospace;font-size:13px;color:var(--text)}
.fbox .choose{height:28px;padding:0 12px;border-radius:8px;background:var(--fill-2);font-size:13px;color:var(--text)}
.fbox .on{height:26px;padding:0 8px;border-radius:7px;background:var(--fill-3);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);font-weight:500;cursor:pointer}
.repo-line{display:flex;align-items:center;gap:7px;margin:9px 2px 18px;font-size:12.5px;color:var(--text-3)}
.repo-line b{color:var(--text);font-weight:600}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.progress{margin-top:4px;display:flex;flex-direction:column;gap:8px}
.progress .bar2{height:6px;border-radius:3px;background:var(--fill-3);overflow:hidden}
.progress .bar2 i{display:block;height:100%;background:var(--text);border-radius:3px;transition:width .25s}
.progress .ln{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3)}
.confirm p{font-size:13.5px;line-height:20px;color:var(--text-2)}

/* host finder (modals/host_finder.rs) */
.finder{width:860px;height:520px;display:flex;flex-direction:column;overflow:hidden;animation:modalin .2s cubic-bezier(.22,1,.36,1)}
.fh{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 20px;border-bottom:.5px solid var(--separator)}
.fh .t{font-size:14px;font-weight:600;color:var(--text-2)}
.crumbs{font-size:13.5px;color:var(--text-3);display:flex;gap:6px}
.crumbs b{font-weight:500;color:var(--text-2)}
.hostchip{margin-left:auto;height:30px;padding:0 10px;display:flex;align-items:center;gap:7px;border-radius:8px;background:var(--fill-2);font-weight:500;font-size:13px}
.fbody{flex:1;display:flex;min-height:0}
.places{width:170px;flex:none;padding:14px 8px;border-right:.5px solid var(--separator)}
.places .ml{padding:6px 10px 4px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.col{width:210px;flex:none;padding:5px;border-right:.5px solid var(--separator);overflow:auto}
.fr{height:26px;padding:0 8px;display:flex;align-items:center;gap:8px;border-radius:6px;font-size:13px;white-space:nowrap;cursor:pointer}
.fr:hover{background:var(--fill-2)}
.fr.anc{background:var(--fill-4)}
.fr.cur{background:var(--accent-bg)}
.fr .nm{flex:1}
.fr .chev{color:var(--text-4)}
.fr .tag{font-size:11px;color:var(--text-4)}
.detail{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.dh{display:flex;align-items:center;gap:12px}
.dh .ic{width:34px;height:34px;border-radius:9px;background:var(--fill-3);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.dh b{display:block;font-size:14px;font-weight:600}
.dh span{font-size:12px;color:var(--text-3)}
.facts{display:grid;grid-template-columns:64px 1fr;row-gap:6px;font-size:12.5px}
.facts dt{color:var(--text-3)}
.facts dd{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 0 20px;border-top:.5px solid var(--separator)}
.ff .p{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.ff .p .mono{font-size:12.5px}
.ff .p span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3)}
.ff .p span.ok{color:var(--success-text)}
.ff .p span.warn{color:var(--waiting-text)}

.toast{position:fixed;right:20px;bottom:64px;z-index:40;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;animation:menuin .2s}
.tip{position:fixed;z-index:50;padding:5px 8px;border-radius:7px;background:var(--text);color:var(--on-text);font-size:11.5px;pointer-events:none;white-space:nowrap}
.kbd{font-size:11px;padding:1px 5px;border-radius:4px;background:var(--fill-3);color:var(--text-2)}

/* prototype controls, not part of the design */
.proto{position:fixed;right:14px;bottom:14px;display:flex;gap:2px;padding:4px;font-size:12px;color:var(--text-3);z-index:45}
.proto button{padding:4px 9px;border-radius:7px}
.proto button:hover{background:var(--fill-2)}
.proto .sep{width:.5px;background:var(--separator);margin:2px 4px}
.guide{position:fixed;right:14px;bottom:56px;width:300px;padding:14px 16px;font-size:12.5px;line-height:1.55;color:var(--text-2);z-index:25}
.guide b{color:var(--text)}
.guide ol{margin:6px 0 0 18px}
.guide li{margin:2px 0;cursor:pointer}
.guide li:hover{color:var(--text)}

  const t=document.getElementById('prompt');
  if(t){t.oninput=()=>{s.prompt=t.value;const b=document.querySelector('.send');const h=H(s.space);const ok=!(s.repo&&!hasRepo(s.space,s.repo))&&(h.local||h.link==='online')&&s.prompt.trim();b.classList.toggle('off',!ok);ok?b.setAttribute('data-act','send'):b.removeAttribute('data-act')};if(focusPrompt){t.focus();t.selectionStart=t.selectionEnd=t.value.length}}
  const u=document.getElementById('url');if(u)u.oninput=()=>{s.clone.url=u.value;parseUrl();const keep=u.selectionStart;render();const u2=document.getElementById('url');u2.focus();u2.selectionStart=u2.selectionEnd=keep};
  const a=document.getElementById('addr');if(a)a.oninput=()=>{s.add.addr=a.value};
  s.dir='';
}
function parseUrl(){const c=s.clone,m=c.url.match(/github\.com[/:]([^/]+)\/([^/.\s]+)/);c.name=m?m[2]:'';c.from=m?'github.com/'+m[1]:'';c.into=c.name?`~/code/${c.name}`:'~/code'}
function toast(msg){s.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{s.toast=null;render()},2400)}
function flash(k){s.flash=k;setTimeout(()=>{if(s.flash===k){s.flash=null;render()}},1900)}
function go(id){if(id===s.space){s.view=s.view==='settings'?'new':s.view;return render()}const a=s.hosts.findIndex(h=>h.id===s.space),b=s.hosts.findIndex(h=>h.id===id);s.dir=b<a?'l':'';s.space=id;if(s.view==='settings'||s.view==='session')s.view='new';if(!hasRepo(id,s.repo))s.repo=projs()[0]?.repo??nullrender()}
function later(ms,f){setTimeout(()=>{f();render()},ms)}
function install(id){const h=H(id);h.link='installing';s.install[id]={step:0};const tick=()=>{const i=s.install[id];if(!i)return;i.step++;if(i.step>=4){i.done=true;h.link='online';h.version='0.1.49';h.up='1m';flash('sw/'+id);render();return}render();setTimeout(tick,700)};setTimeout(tick,700)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(s.menu){s.menu=null;render()}return}
  const v=el.dataset.v,act=el.dataset.act;
  if(act==='fclose'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  if(s.menu&&act!=='menu'&&!['color','clonehost'].includes(act))s.menu=null;
  switch(act){
    case 'menu':e.stopPropagation();s.menu=s.menu===v?null:v;break;
    case 'space':s.menu=null;return go(v);
    case 'settings':s.view='settings';break;
    case 'back':s.view='new';break;
    case 'newin':s.repo=v;s.view='new';s.sel=null;break;
    case 'sel':s.sel=v;s.view='session';break;
    case 'repo':s.repo=v||null;break;
    case 'checkout':s.checkout=v;break;
    case 'toast':return toast(v);
    case 'color':H(s.space).color=v;break;
    case 'reconnect':{const h=H(v);h.link='connecting';later(1400,()=>{h.link='online';h.up='1m'});break;}
    case 'remove':s.confirm=v;s.modal='confirm';break;
    case 'ccancel':s.modal=null;break;
    case 'doremove':{const i=s.hosts.findIndex(h=>h.id===v);s.hosts.splice(i,1);delete s.projects[v];s.modal=null;if(s.space===v)s.space='mac';delete s.install[v];toast(`Removed ${v}`);return;}
    case 'update':{const h=H(v);s.install[v]={step:1};h.link='installing';const tick=()=>{const i=s.install[v];i.step++;if(i.step>=4){i.done=true;h.link='online';h.version='0.1.49';render();return}render();setTimeout(tick,600)};setTimeout(tick,600);break;}
    case 'dismiss':delete s.install[v];break;
    case 'addhost':s.view='settings';s.add={addr:'',user:''};s.menu=null;break;
    case 'addcancel':s.add=null;break;
    case 'suggest':s.add={addr:v,user:v==='nas'?'admin':'ubuntu'};break;
    case 'connect':{
      const addr=(document.getElementById('addr')?.value||'').trim();
      if(!addr){s.add.err="Enter the host's address or name";break;}
      const id=addr.replace(/[^a-z0-9-]/gi,'-');
      s.hosts.push({id,name:addr,addr:`${s.add.user||'dev'}@${addr}`,icon:'server',link:'connecting',version:'0.1.49',color:COLORS[s.hosts.length%COLORS.length],home:'/home/'+(s.add.user||'dev')});
      s.projects[id]=[];s.add=null;flash('sw/'+id);
      later(1200,()=>{const h=H(id);if(!h)return;if(addr==='nas'){h.link='refused'}else install(id)});
      break;}
    case 'usepw':s.pw=v;break;
    case 'pwcancel':s.pw=null;break;
    case 'signin':s.pw=null;H(v).link='connecting';later(900,()=>install(v));break;
    case 'send':{
      const h=H(s.space),p=projs().find(p=>p.repo===s.repo);if(!p)return;
      const nm=s.checkout==='local'?'Local':NAMES[s.n++%NAMES.length];
      if(s.checkout==='local'){const t=p.trees.find(t=>t[0]==='local');if(t)t[2]='working';else p.trees.unshift(['local','Local','working'])}else p.trees.push(['worktree',nm,'working']);
      const k=`${s.space}/${p.repo}/${nm}`;s.last={k,text:s.prompt};s.prompt='';s.sel=k;s.view='session';flash(k);break;}
    case 'finder':{const host=s.modal==='clone'?s.clone.host:s.space;const h=H(host);if(!h.local&&h.link!=='online')return toast(`${h.name} is offline`);if(h.local&&v==='open')return toast('Opens the macOS folder picker');s.finder={host,dir:v==='pick'?'~/code':'~/code',mode:v};s.prevModal=s.modal;s.modal='finder';break;}
    case 'fgo':s.finder.dir=v;break;
    case 'fclose':s.modal=s.finder.mode==='pick'?'clone':null;break;
    case 'fuse':{
      const f=s.finder;
      if(f.mode==='pick'){s.clone.into=`${f.dir}/${s.clone.name||''}`.replace(/\/$/,'');s.modal='clone';break;}
      const name=f.dir.split('/').pop();
      if(!s.projects[f.host])s.projects[f.host]=[];
      s.projects[f.host].push({repo:name,path:f.dir,trees:[['local','Local','idle']]});
      s.modal=null;s.repo=name;s.view='new';if(f.host!==s.space)s.space=f.host;flash(f.host+'/'+name);toast(`Added ${name} on ${H(f.host).name}`);return;}
    case 'clone':{const h=H(s.space);s.clone={url:'',name:'',from:'',into:'~/code',host:h.local||h.link==='online'?s.space:'mac',progress:null};s.modal='clone';break;}
    case 'clonehost':s.clone.host=v;s.menu=null;break;
    case 'cclose':s.modal=null;break;
    case 'docl':{const c=s.clone;c.progress=0;const tick=()=>{c.progress=Math.min(100,c.progress+Math.ceil(9+Math.random()*14));render();if(c.progress<100)return setTimeout(tick,180);setTimeout(()=>{if(!s.projects[c.host])s.projects[c.host]=[];s.projects[c.host].push({repo:c.name,path:c.into,trees:[['local','Local','idle']]});s.modal=null;s.space=c.host;s.repo=c.name;s.view='new';flash(c.host+'/'+c.name);toast(`Cloned ${c.name} onto ${H(c.host).name}`)},450)};setTimeout(tick,200);break;}
    case 'guide':s.guide=!s.guide;break;
    case 'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='graphite'?'':'graphite';break;
    case 'reset':{const g=s.guide;s=fresh();s.guide=g;break;}
    case 'walk':return walk(v);
  }
  render();
});
function walk(k){
  const g=s.guide;s=fresh();s.guide=g;
  ({
    'space-mini':()=>{s.space='mini'},
    'space-menu':()=>{s.space='mini';s.menu='space'},
    'space-devbox':()=>{s.space='devbox'},
    'settings':()=>{s.view='settings'},
    'add':()=>{s.view='settings';s.add={addr:'gpu-box',user:'ubuntu'}},
    'start':()=>{s.space='mini';s.repo='employer-backend';s.prompt='Fix the flaky login test, then run the suite.'},
    'open':()=>{s.space='mini';s.finder={host:'mini',dir:'~/code/rail-changer-backend',mode:'open'};s.modal='finder'},
    'clone':()=>{s.space='mini';s.clone={url:'https://github.com/zed-industries/zed',host:'mini',into:'',progress:null};parseUrl();s.modal='clone'},
  })[k]();
  render();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(s.menu)s.menu=null;else if(s.modal==='finder')s.modal=s.finder.mode==='pick'?'clone':null;else if(s.modal)s.modal=null;else if(s.view==='settings')s.view='new';render();return}
  if(e.ctrlKey&&/^[1-9]$/.test(e.key)){const h=s.hosts[+e.key-1];if(h)go(h.id)}
});
let wheel=0;document.addEventListener('wheel',e=>{if(!e.target.closest('.side')||Math.abs(e.deltaX)<Math.abs(e.deltaY))return;wheel+=e.deltaX;if(Math.abs(wheel)>80){const i=s.hosts.findIndex(h=>h.id===s.space)+(wheel>0?1:-1);wheel=0;if(s.hosts[i])go(s.hosts[i].id)}},{passive:true});
let tipEl=null;document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');tipEl?.remove();tipEl=null;if(!t)return;const r=t.getBoundingClientRect();tipEl=document.createElement('div');tipEl.className='tip';tipEl.textContent=t.dataset.tip;document.body.append(tipEl);tipEl.style.left=Math.max(8,Math.min(r.left+r.width/2-tipEl.offsetWidth/2,innerWidth-tipEl.offsetWidth-8))+'px';tipEl.style.top=(r.top-30)+'px'});
const start=location.hash.slice(1);if(start)walk(start);else render();
</script>
