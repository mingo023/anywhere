<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer · Run on — prototype</title>
<style>
:root{
  /* Solarized Light, packages/desktop/themes/solarized-light.json */
  --text:#073642;--text-body:#365b61;--text-2:#566c73;--text-3:#657b83;--text-4:#93a1a1;--text-5:#b0bab0;--text-6:#d1d3c6;--on-text:#fdf6e3;
  --window:#eee8d5;--surface:#fdf6e3;--surface-sunken:#f6efdc;--page:#f9f2df;--side:#f6efdcb3;--popover:#fdf6e3;--highlight:#fffffff2;--shadow:#00000024;
  --fill-1:#07364208;--fill-2:#0736420b;--fill-3:#0736420e;--fill-4:#07364211;--hairline:#07364212;--separator:#07364217;--separator-strong:#0736421f;
  --accent-bg:#0736421c;--waiting:#947000;--waiting-text:#826300;--waiting-dot:#b58900;--waiting-bg:#b589002e;--success:#7a8d00;--success-text:#606e00;--failed:#dc322f;--claude:#d97757;
}
:root[data-theme=graphite]{
  /* Graphite Light, crates/theme/src/theme.rs */
  --text:#111113;--text-body:#3f3f46;--text-2:#6f6f78;--text-3:#8b8b94;--text-4:#a1a1aa;--text-5:#b4b4bc;--text-6:#d4d4d8;--on-text:#ffffff;
  --window:#f4f4f5;--surface:#ffffff;--surface-sunken:#fafafa;--page:#f7f7f7;--side:#fafafbb3;--popover:#ffffff;--highlight:#fffffff2;--shadow:#00000024;
  --fill-1:#11111308;--fill-2:#1111130b;--fill-3:#1111130e;--fill-4:#11111311;--hairline:#11111312;--separator:#11111317;--separator-strong:#1111131f;
  --accent-bg:#1111131c;--waiting:#ad5700;--waiting-text:#ad5700;--waiting-dot:#ffb224;--waiting-bg:#ffb2242e;--success:#2b9a66;--success-text:#18794e;--failed:#cd2b31;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);background:var(--window);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
svg.i{flex:none;display:block}

.app{display:flex;height:100vh}
/* sidebar: ui::side, sidebar_row 28px */
.side{width:262px;flex:none;background:var(--side);border-right:.5px solid var(--separator);display:flex;flex-direction:column;padding:0 10px 10px}
.top{height:40px;display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--text-3)}
.search{height:32px;margin:4px 0 8px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:9px;background:var(--fill-2);color:var(--text-3);font-size:13.5px}
.search kbd{margin-left:auto;font:inherit;font-size:11.5px;color:var(--text-4)}
.row{height:28px;padding:0 6px;display:flex;align-items:center;gap:7px;border-radius:8px;font-size:13px;color:var(--text-2);white-space:nowrap}
.row:hover{background:var(--fill-2)}
.row.on{background:var(--fill-4);color:var(--text)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sh{margin:14px 6px 4px;display:flex;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
.sh span{flex:1}
.tile{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px;font-weight:600;color:var(--text-2);background:var(--surface);box-shadow:inset 0 0 0 .5px var(--separator-strong)}
.tile.emoji{font-size:12px}
.prow{color:var(--text);font-weight:500}
.crow{padding-left:33px}
.host{display:flex;align-items:center;gap:5px;color:var(--text-3)}
.dot{width:6px;height:6px;border-radius:3px;flex:none;background:var(--success)}
.dot.off{background:var(--text-5)}
.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:var(--accent-bg)}100%{background:transparent}}
.side .foot{margin-top:auto}

/* page */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page)}
.bar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:13px;color:var(--text-3)}
.bar b{color:var(--text);font-weight:600}
.body{flex:1;position:relative;display:flex;justify-content:center;background-image:radial-gradient(var(--text-6) .9px,transparent 1px);background-size:14px 14px;background-position:7px 7px}
.content{width:600px;margin-top:22vh;display:flex;flex-direction:column;align-items:center}
h1{font-size:21px;line-height:25px;font-weight:600}
/* composer frame */
.frame{width:100%;margin-top:20px;background:var(--surface);border-radius:16px;box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a,0 8px 24px #0000000d}
.ptext{padding:11px 9px 0}
.ptext textarea{width:100%;border:0;outline:0;resize:none;background:none;font:inherit;font-size:14.5px;line-height:22px;color:var(--text);padding:0 7px;height:66px}
.ptext textarea::placeholder{color:var(--text-4)}
.pbar{display:flex;align-items:center;gap:4px;padding:4px 11px 11px}
.pill{height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 7px;border-radius:9px;font-size:12.5px;color:var(--text-2)}
.pill:hover{background:var(--fill-2)}
.pill b{font-weight:500;color:var(--text)}
.ib{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.ib:hover{background:var(--fill-2)}
.send{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--on-text)}
.send.off{background:var(--fill-4);color:var(--text-4);cursor:default}

/* footer chips: ui::menu_chip */
.foot-row{width:100%;margin-top:10px;display:flex;align-items:center;gap:2px;font-size:13px}
.pw{position:relative}
.chip{height:30px;padding:0 8px 0 10px;display:flex;align-items:center;gap:7px;border-radius:8px;background:var(--fill-2);white-space:nowrap;font-weight:500}
.chip:hover,.chip[data-open]{background:var(--fill-3)}
.chip .warn{color:var(--waiting)}
.chip.dim{opacity:.5;cursor:default}
.sep{color:var(--text-4);padding:0 4px}
.notice{width:100%;margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--waiting-text)}
.notice a{color:var(--text);font-weight:500;text-decoration:underline;cursor:pointer}

/* menus: ui::pop, R_POPOVER 12 */
.pop{background:var(--popover);border-radius:12px;box-shadow:0 0 0 .5px var(--separator),inset 0 1px 0 var(--highlight),0 18px 50px var(--shadow),0 2px 6px #0000000f}
.menu{position:absolute;top:36px;left:0;z-index:10;padding:5px;display:flex;flex-direction:column;gap:2px;animation:menuin .15s cubic-bezier(.22,1,.36,1)}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}}
.ml{padding:6px 10px 2px;font-size:11.5px;font-weight:500;color:var(--text-3)}
.md{height:.5px;margin:4px 8px;background:var(--separator);flex:none}
/* ui::menu_pick */
.mp{height:32px;padding:0 10px;display:flex;align-items:center;gap:10px;border-radius:8px;font-size:13.5px;white-space:nowrap}
.mp:hover{background:var(--fill-2)}
.mp .lead{width:14px;display:flex;justify-content:center;flex:none;color:var(--text-2)}
.mp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mp .sub{font-size:12px;color:var(--text-4)}
.mp.off{color:var(--text-4);cursor:default}
.mp.off:hover{background:none}
/* access_row: label over hint */
.ar{padding:7px 8px;display:flex;align-items:center;gap:9px;border-radius:6px}
.ar:hover,.ar.on{background:var(--fill-2)}
.ar .g{align-self:flex-start;padding-top:1px;color:var(--text-2)}
.ar .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ar .l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.ar .h{font-size:11.5px;color:var(--text-3)}
.ar .ck{width:16px;display:flex;justify-content:flex-end;flex:none}
.ar.off{cursor:default}
.ar.off:hover{background:none}
.ar.off .l,.ar.off .g{color:var(--text-4)}
.tag{font-size:11.5px;color:var(--text-4);font-weight:400}
.tag.ok{color:var(--success-text)}

/* finder (modals/host_finder.rs) */
.backdrop{position:fixed;inset:0;background:#0000002e;display:flex;align-items:center;justify-content:center;z-index:30;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.finder{width:860px;height:520px;display:flex;flex-direction:column;overflow:hidden}
.fh{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 20px;border-bottom:.5px solid var(--separator)}
.fh .t{font-size:14px;font-weight:600;color:var(--text-2)}
.crumb{font-size:13.5px;color:var(--text-3)}
.crumb b{font-weight:500;color:var(--text-2)}
.hostchip{margin-left:auto;height:30px;padding:0 10px;display:flex;align-items:center;gap:7px;border-radius:8px;background:var(--fill-2);font-weight:500;font-size:13px}
.fbody{flex:1;display:flex;min-height:0}
.places{width:170px;flex:none;padding:14px 8px;border-right:.5px solid var(--separator)}
.places .ml{padding:6px 10px 4px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.col{width:210px;flex:none;padding:5px;border-right:.5px solid var(--separator);overflow:auto}
.fr{height:26px;padding:0 8px;display:flex;align-items:center;gap:8px;border-radius:6px;font-size:13px;white-space:nowrap}
.fr:hover{background:var(--fill-2)}
.fr.anc{background:var(--fill-4)}
.fr.cur{background:var(--accent-bg)}
.fr .nm{flex:1}
.fr .chev{color:var(--text-4)}
.fr.ign{opacity:.5}
.detail{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.dh{display:flex;align-items:center;gap:12px}
.dh .ic{width:34px;height:34px;border-radius:9px;background:var(--fill-3);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.dh b{display:block;font-size:14px;font-weight:600}
.dh span{font-size:12px;color:var(--text-3)}
.facts{display:grid;grid-template-columns:64px 1fr;row-gap:6px;font-size:12.5px}
.facts dt{color:var(--text-3)}
.facts dd{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 0 20px;border-top:.5px solid var(--separator)}
.ff .p{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.ff .p .mono{font-size:12.5px}
.ff .p span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--success-text)}
.btn{height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center}
.btn.ghost:hover{background:var(--fill-2)}
.btn.primary{background:var(--text);color:var(--on-text)}

.toast{position:fixed;right:20px;bottom:20px;z-index:40;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;animation:menuin .2s}
.toast .ic{color:var(--success)}

.proto{position:fixed;left:272px;bottom:12px;display:flex;gap:4px;padding:4px;font-size:11.5px;color:var(--text-3);z-index:5}
.proto button{padding:3px 8px;border-radius:6px}
.proto button[data-on]{background:var(--fill-4);color:var(--text)}
</style>
</head>

const ic=(n,s=14,c='currentColor')=>{const d=ICONS[n];return d.fill?`<svg class="i" width="${s}" height="${s}" viewBox="${d.vb}" fill="${c==='currentColor'?'var(--claude)':c}">${d.body}</svg>`:`<svg class="i" width="${s}" height="${s}" viewBox="${d.vb}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d.body}</svg>`};

const MACHINES={
  mac:{name:'This Mac',hint:'ming-macbook · macOS',local:true,online:true},
  devbox:{name:'devbox',hint:'dev@devbox.lan · Linux',online:true},
  buildbox:{name:'buildbox',hint:'ci@10.0.4.12',online:false,seen:'2h ago'},
};
const ORDER=['mac','devbox','buildbox'];
const MARK={'employer-backend':'🍀','glow-me':'🧠'};
const fresh=()=>({
  projects:{
    mac:{'employer-backend':'~/Developer/work/hodfords/employer-backend','glow-me':'~/Developer/self/glow-me','anywhere':'~/Developer/self/coding-pocket','dragon':'~/Developer/work/railchanger/rail-changer-backend'},
    devbox:{'anywhere':'~/code/anywhere','dragon':'~/code/rail-changer-backend'},
    buildbox:{},
  },
  machine:'mac',repo:'employer-backend',checkout:'worktree',menu:null,finder:null,toast:null,flash:null,prompt:'',
});
let s=fresh();

const tile=(r,size=20)=>MARK[r]?`<span class="tile emoji" style="width:${size}px;height:${size}px">${MARK[r]}</span>`:`<span class="tile" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.5)}px">${r[0].toUpperCase()}</span>`;
const mIcon=(id,n=14)=>ic(MACHINES[id].local?'laptop':'server',n);
const mDot=id=>MACHINES[id].local?'':`<span class="dot${MACHINES[id].online?'':' off'}"></span>`;
const has=(id,r)=>!!s.projects[id][r];
const missing=()=>s.repo&&!has(s.machine,s.repo);
const chev=ic('chevron-down',12,'var(--text-4)');

function side(){
  let rows='';
  for(const id of ORDER)for(const r of Object.keys(s.projects[id])){
    const on=s.machine===id&&s.repo===r;
    const host=MACHINES[id].local?'':`<span class="host">${ic('globe',13)}${mDot(id)}</span>`;
    rows+=`<div class="row prow${on?' on':''}${s.flash===id+'/'+r?' fresh':''}" data-act="openproj" data-m="${id}" data-r="${r}">${tile(r)}<span class="nm">${r}</span>${host}</div>`;
  }
  return `<div class="top">${ic('bell',16)}${ic('sidebar-collapse',16)}</div>
  <div class="search">${ic('search',14)}<span>Search</span><kbd>⌘K</kbd></div>
  <div class="row">${ic('activity',15)}<span class="nm">Activity</span></div>
  <div class="row">${ic('blocks',15)}<span class="nm">Board</span></div>
  <div class="row">${ic('bolt',15)}<span class="nm">Automations</span></div>
  <div class="sh"><span>PROJECTS</span>${ic('search',13)}</div>${rows}
  <div class="foot"><div class="row">${ic('settings',15)}<span class="nm">Settings</span></div></div>`;
}

function machineChip(){
  const open=s.menu==='machine';
  const row=id=>{
    const m=MACHINES[id];
    const tag=!m.online?`<span class="tag">Offline · ${m.seen}</span>`:!s.repo||m.local?'':has(id,s.repo)?`<span class="tag ok">has ${s.repo}</span>`:`<span class="tag">no ${s.repo}</span>`;
    return `<div class="ar${s.machine===id?' on':''}${m.online?'':' off'}" ${m.online?`data-act="machine" data-v="${id}"`:''}><span class="g">${mIcon(id)}</span><span class="tx"><span class="l">${m.name}${mDot(id)}</span><span class="h">${m.hint}</span></span>${tag}<span class="ck">${s.machine===id?ic('check',14):''}</span></div>`;
  };
  const menu=open?`<div class="menu pop" style="width:330px"><div class="ml">Run on</div>${row('mac')}<div class="md"></div><div class="ml">SSH hosts</div>${row('devbox')}${row('buildbox')}<div class="md"></div><div class="mp" data-act="addhost"><span class="lead">${ic('plus',14)}</span><span class="nm">Add SSH host…</span></div></div>`:'';
  return `<div class="pw"><button class="chip"${open?' data-open':''} data-act="menu" data-v="machine">${mIcon(s.machine)}<span>${MACHINES[s.machine].name}</span>${mDot(s.machine)}${chev}</button>${menu}</div>`;
}

function projectChip(){
  const open=s.menu==='project', m=MACHINES[s.machine];
  const here=Object.keys(s.projects[s.machine]);
  let items=`<div class="mp" data-act="repo" data-v=""><span class="lead">${ic('folder',14,'var(--text-3)')}</span><span class="nm">No project</span>${s.repo===null?ic('check',13,'var(--text-2)'):''}</div>`;
  if(!m.local)items+=`<div class="ml">On ${m.name}</div>`;
  items+=here.map(r=>`<div class="mp" data-act="repo" data-v="${r}"><span class="lead">${tile(r,14)}</span><span class="nm">${r}</span>${s.repo===r?ic('check',13,'var(--text-2)'):''}</div>`).join('');
  if(!m.local&&!here.length)items+=`<div class="mp off"><span class="lead"></span><span class="nm">No projects on ${m.name} yet</span></div>`;
  if(!m.local)items+=`<div class="md"></div><div class="mp" data-act="finder"><span class="lead">${ic('folder-plus',14)}</span><span class="nm">Choose folder on ${m.name}…</span></div>`;
  const label=s.repo??'No project';
  const lead=s.repo?tile(s.repo,16):ic('folder',14,'var(--text-3)');
  return `<div class="pw"><button class="chip"${open?' data-open':''} data-act="menu" data-v="project">${lead}<span>${label}</span>${missing()?`<span class="warn">${ic('warning',13)}</span>`:''}${chev}</button>${open?`<div class="menu pop" style="width:260px">${items}</div>`:''}</div>`;
}

function checkoutChip(){
  const open=s.menu==='checkout', dim=missing();
  const local=MACHINES[s.machine].local;
  const opt=(v,glyph,l,h)=>`<div class="ar${s.checkout===v?' on':''}" data-act="checkout" data-v="${v}"><span class="g">${ic(glyph,14)}</span><span class="tx"><span class="l">${l}</span><span class="h">${h}</span></span><span class="ck">${s.checkout===v?ic('check',14):''}</span></div>`;
  const menu=open?`<div class="menu pop" style="width:300px">${opt('worktree','worktree','Worktree','Its own branch and copy of the files')}${opt('local',local?'laptop':'globe','Local','Work in the checkout as it is')}</div>`:'';
  const glyph=s.checkout==='worktree'?'worktree':(local?'laptop':'globe');
  return `<div class="pw"><button class="chip${dim?' dim':''}"${open?' data-open':''} ${dim?'':'data-act="menu" data-v="checkout"'}>${ic(glyph,14,'var(--text-3)')}<span>${s.checkout==='worktree'?'Worktree':'Local'}</span>${chev}</button>${menu}</div>`;
}

function branchChip(){
  if(s.checkout!=='worktree'||!s.repo)return '';
  return `<button class="chip${missing()?' dim':''}">${ic('branch',14,'var(--text-3)')}<span class="mono" style="font-size:12.5px">${s.repo==='employer-backend'?'develop':'main'}</span>${chev}</button>`;
}

function page(){
  const ready=!missing()&&s.prompt.trim();
  const notice=missing()?`<div class="notice">${ic('warning',13)}<span><b style="font-weight:500">${s.repo}</b> isn't on ${MACHINES[s.machine].name} yet.</span><a data-act="finder">Choose its folder…</a></div>`:'';
  return `<div class="bar"><span>${s.repo??'No project'}</span><span>/</span><b>New session</b></div>
  <div class="body"><div class="content">
    <h1>What should we build next?</h1>
    <div class="frame">
      <div class="ptext"><textarea id="prompt" placeholder="Ask, build, / for commands, @ for files">${s.prompt}</textarea></div>
      <div class="pbar">
        <button class="pill">${ic('claude',15)}<b>Opus 5.5</b><span>High</span>${chev}</button>
        <button class="pill">${ic('shield',14,'var(--text-3)')}<span style="color:var(--waiting)">Full</span>${chev}</button>
        <span style="flex:1"></span>
        <button class="ib">${ic('pull-request',15)}</button>
        <button class="ib">${ic('plus',16)}</button>
        <button class="send${ready?'':' off'}" ${ready?'data-act="send"':''}>${ic('arrow-up',15)}</button>
      </div>
    </div>
    <div class="foot-row">${machineChip()}<span class="sep">·</span>${projectChip()}<span class="sep">·</span>${checkoutChip()}${branchChip()}</div>
    ${notice}
  </div></div>`;
}

/* finder: a few folders on the host */
const TREE={
  '~':['code/','Downloads/','notes.md'],
  '~/code':['anywhere/','employer-backend/','rail-changer-backend/','scratch/'],
};
const REPOS={'~/code/employer-backend':{branch:'develop',remote:'git@github.com:hodfords/employer-backend.git'},'~/code/anywhere':{branch:'main',remote:'git@github.com:mingo023/anywhere.git'},'~/code/rail-changer-backend':{branch:'main',remote:'git@github.com:railchanger/backend.git'}};
function finder(){
  const f=s.finder, m=MACHINES[s.machine];
  const col=(dir,picked)=>`<div class="col">${(TREE[dir]||[]).map(n=>{const d=n.endsWith('/'),nm=n.replace('/','');const path=dir+'/'+nm;const sel=picked===nm;const cls=sel?(path===f.dir?' cur':' anc'):'';return `<div class="fr${cls}" ${d?`data-act="fgo" data-v="${path}"`:''}>${ic(d?'folder':'file',14,'var(--text-3)')}<span class="nm">${nm}</span>${d?`<span class="chev">${ic('chevron-right',12)}</span>`:''}</div>`}).join('')}</div>`;
  const parts=f.dir.split('/');
  const cols=parts.length>=3?col('~','code')+col('~/code',parts[2]):col('~',parts[1]||null)+(parts[1]==='code'?col('~/code',null):'');
  const repo=REPOS[f.dir], name=parts[parts.length-1];
  const detail=repo?`<div class="dh"><span class="ic">${ic('branch',16)}</span><div><b>${name}</b><span>Git repository</span></div></div><dl class="facts"><dt>Branch</dt><dd>${repo.branch}</dd><dt>Remote</dt><dd>${repo.remote}</dd><dt>Path</dt><dd>${f.dir}</dd></dl>`:`<div class="dh"><span class="ic">${ic('folder',16)}</span><div><b>${name}</b><span>${(TREE[f.dir]||[]).length} items</span></div></div>`;
  const crumbs=parts.map((p,i)=>`<span class="crumb">${i===parts.length-1?`<b>${p}</b>`:p}</span>`).join('<span class="crumb">/</span>');
  const already=has(s.machine,name)&&s.projects[s.machine][name]===f.dir;
  return `<div class="backdrop" data-act="fclose"><div class="finder pop" data-stop>
    <div class="fh"><span class="t">Choose a folder</span>${crumbs}<span class="hostchip">${ic('server',14)}${m.name}${mDot(s.machine)}${chev}</span><button class="ib" data-act="fclose">${ic('x',15)}</button></div>
    <div class="fbody"><div class="places"><div class="ml">${m.name}</div><div class="fr" data-act="fgo" data-v="~">${ic('laptop',14,'var(--text-3)')}<span class="nm">Home</span></div><div class="fr">${ic('server',14,'var(--text-3)')}<span class="nm">Root</span></div></div>${cols}<div class="detail">${detail}</div></div>
    <div class="ff"><div class="p"><span class="mono" style="color:var(--text)">${f.dir}</span>${repo?`<span>${ic('check',11)}Git repository</span>`:`<span style="color:var(--text-3)">${ic('folder',11)}Folder, without git</span>`}</div>
      <button class="btn ghost" data-act="fclose">Cancel</button><button class="btn primary" data-act="fuse" ${already?'style="opacity:.5;cursor:default"':''}>Use this folder</button></div>
  </div></div>`;
}

function render(){
  const focused=document.activeElement?.id==='prompt';
  document.getElementById('root').innerHTML=`<div class="app"><aside class="side">${side()}</aside><main class="main">${page()}</main></div>
  ${s.finder?finder():''}
  ${s.toast?`<div class="toast pop"><span class="ic">${ic('check',14)}</span>${s.toast}</div>`:''}
  <div class="proto pop"><span style="padding:3px 6px">Theme</span><button data-act="theme" data-v="solarized"${document.documentElement.dataset.theme!=='graphite'?' data-on':''}>Solarized Light</button><button data-act="theme" data-v="graphite"${document.documentElement.dataset.theme==='graphite'?' data-on':''}>Graphite Light</button><button data-act="reset">Reset</button></div>`;
  const t=document.getElementById('prompt');
  t.oninput=()=>{s.prompt=t.value;const b=document.querySelector('.send');const ok=!missing()&&s.prompt.trim();b.classList.toggle('off',!ok);ok?b.setAttribute('data-act','send'):b.removeAttribute('data-act')};
  if(focused){t.focus();t.selectionStart=t.selectionEnd=t.value.length}
}

function toast(msg){s.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{s.toast=null;render()},2600)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(s.menu){s.menu=null;render()}return}
  if(el.dataset.act==='fclose'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="fclose"],.btn[data-act="fclose"]'))return;
  const v=el.dataset.v;
  switch(el.dataset.act){
    case 'menu':s.menu=s.menu===v?null:v;break;
    case 'machine':{
      s.machine=v;s.menu=null;
      if(s.repo&&!has(v,s.repo)){}
      break;}
    case 'repo':s.repo=v||null;s.menu=null;break;
    case 'checkout':s.checkout=v;s.menu=null;break;
    case 'addhost':s.menu=null;toast('Opens Settings › Hosts');return;
    case 'openproj':s.machine=el.dataset.m;s.repo=el.dataset.r;s.menu=null;break;
    case 'finder':s.menu=null;s.finder={dir:s.repo&&REPOS['~/code/'+s.repo]?'~/code/'+s.repo:'~/code'};break;
    case 'fgo':s.finder.dir=v;break;
    case 'fclose':s.finder=null;break;
    case 'fuse':{
      const dir=s.finder.dir,name=dir.split('/').pop();
      if(has(s.machine,name)&&s.projects[s.machine][name]===dir)return;
      s.projects[s.machine][name]=dir;s.repo=name;s.finder=null;s.flash=s.machine+'/'+name;
      render();setTimeout(()=>{s.flash=null},1700);toast(`Added ${name} on ${MACHINES[s.machine].name}`);return;}
    case 'send':toast(`Session starts on ${MACHINES[s.machine].name} in ${s.projects[s.machine][s.repo]}`);s.prompt='';return;
    case 'theme':document.documentElement.dataset.theme=v==='graphite'?'graphite':'';break;
    case 'reset':s=fresh();break;
  }
  render();
});
/* #machine, #devbox, #project, #finder open the prototype on that state */
({machine:()=>{s.menu='machine'},devbox:()=>{s.machine='devbox'},project:()=>{s.machine='devbox';s.menu='project'},finder:()=>{s.machine='devbox';s.finder={dir:'~/code/employer-backend'}}})[location.hash.slice(1)]?.();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.finder)s.finder=null;else s.menu=null;render()}});
render();
</script>
</body>
</html>
