<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anywhere · Settings revamp prototype</title>
<style>
:root{
  --text:#111113;--text-body:#3f3f46;--text-2:#6f6f78;--text-3:#74747d;--text-4:#a1a1aa;
  --page:#f7f7f7;--side:#f1f1f3;--surface:#fff;--popover:#fff;--well:#f4f4f5;
  --fill-1:rgba(17,17,19,.031);--fill-2:rgba(17,17,19,.043);--fill-3:rgba(17,17,19,.055);--fill-4:rgba(17,17,19,.067);
  --sep:rgba(17,17,19,.09);--sep-strong:rgba(17,17,19,.122);
  --ink:#111113;--on-ink:#fff;--focus:rgba(17,17,19,.5);
  --on:#2b9a66;--failed:#cd2b31;--failed-bg:rgba(229,72,77,.1);--failed-text:#cd2b31;
  --waiting:#ad5700;--waiting-bg:rgba(255,178,36,.16);--ok:#18794e;--flash:rgba(255,178,36,.28);
  --row-shadow:0 1px 2px rgba(17,17,19,.06),0 0 0 .5px rgba(17,17,19,.07);
  --pop-shadow:0 0 0 .5px rgba(17,17,19,.12),0 12px 32px rgba(17,17,19,.14),0 2px 6px rgba(17,17,19,.06);
  --cap-shadow:0 0 0 .5px rgba(17,17,19,.14),0 1px 0 rgba(0,0,0,.09);
  --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --out:cubic-bezier(.23,1,.32,1);
}
[data-theme=dark]{
  --text:#ebebeb;--text-body:#c4c4c4;--text-2:#acacac;--text-3:#929292;--text-4:#7a7a7a;
  --page:#2b2b2c;--side:#232324;--surface:rgba(235,235,235,.07);--popover:#2f2f30;--well:rgba(235,235,235,.05);
  --fill-1:rgba(235,235,235,.05);--fill-2:rgba(235,235,235,.08);--fill-3:rgba(235,235,235,.1);--fill-4:rgba(235,235,235,.12);
  --sep:rgba(235,235,235,.08);--sep-strong:rgba(235,235,235,.14);
  --ink:#ebebeb;--on-ink:#171717;--focus:rgba(235,235,235,.6);
  --on:#30a46c;--failed:#e5484d;--failed-bg:rgba(229,72,77,.14);--failed-text:#ff9592;
  --waiting:#ffca16;--waiting-bg:rgba(255,178,36,.14);--ok:#3dd68c;--flash:rgba(255,178,36,.2);
  --row-shadow:0 0 0 .5px rgba(235,235,235,.1);
  --pop-shadow:0 0 0 .5px rgba(235,235,235,.14),0 16px 40px rgba(0,0,0,.5);
  --cap-shadow:0 0 0 .5px rgba(235,235,235,.18),0 1px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;color:var(--text);
  background:radial-gradient(1100px 700px at 12% 0%,#d9dfe9 0%,transparent 60%),radial-gradient(900px 600px at 92% 100%,#e0d9e6 0%,transparent 60%),#c8cdd7}
[data-theme=dark] body{background:radial-gradient(1100px 700px at 12% 0%,#2b3140 0%,transparent 60%),radial-gradient(900px 600px at 92% 100%,#33293b 0%,transparent 60%),#16181d}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:default;text-align:inherit}
button:disabled{opacity:.45}
svg{display:block;flex:none}
:focus{outline:none}
:focus-visible{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--focus)!important;border-radius:7px}
mark{background:var(--waiting-bg);color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}

#win{position:absolute;inset:24px 24px 64px;display:flex;border-radius:11px;overflow:hidden;background:var(--page);
  box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 24px 70px rgba(0,0,0,.24),0 6px 18px rgba(0,0,0,.1);user-select:none;-webkit-user-select:none}
.lights{position:absolute;left:14px;top:15px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* nav */
#nav{width:248px;flex:none;background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0}
.navtop{padding:44px 10px 8px;flex:none;display:flex;flex-direction:column;gap:8px}
.back{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:7px;color:var(--text-body)}
.back:hover{background:var(--fill-2)}
.search{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border-radius:8px;background:var(--fill-3);color:var(--text-3)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:13px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search:focus-within{box-shadow:0 0 0 2px var(--side),0 0 0 4px var(--focus)}
kbd{font:11.5px var(--sans);color:var(--text-4)}
.navscroll{flex:1;min-height:0;overflow:auto;padding:4px 10px 16px;
  -webkit-mask-image:linear-gradient(transparent 0,#000 10px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(transparent 0,#000 10px,#000 calc(100% - 18px),transparent)}
.ngroup{margin-top:12px}
.ncap{padding:0 8px 4px;font-size:11px;font-weight:600;color:var(--text-4)}
.ni{width:100%;display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;color:var(--text-body);font-weight:450}
.ni:hover{background:var(--fill-2)}
.ni.sel{background:var(--fill-4);color:var(--text);font-weight:600}
.ni.dim{opacity:.45}
.ni .cnt{margin-left:auto;min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--fill-3);font-size:11px;font-weight:500;color:var(--text-2);display:flex;align-items:center;justify-content:center}
.ni .cdot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--text-2)}

/* page */
#page{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:.5px solid var(--sep)}
.crumbs{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.crumbs .up{color:var(--text-3);font-weight:500;padding:2px 4px;border-radius:5px}
.crumbs .up:hover{background:var(--fill-2);color:var(--text)}
.crumbs .sepr{color:var(--text-4)}
.subt{font-size:12px;color:var(--text-3);margin-top:1px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{min-width:0;flex:1}
.advsw{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);flex:none}
.scroll{flex:1;min-height:0;overflow:auto}
#stage{max-width:700px;margin:0 auto;padding:22px 24px 140px;display:flex;flex-direction:column;gap:22px}
.gcap{font-size:13px;font-weight:600;color:var(--text-2);margin:0 2px 7px;display:flex;align-items:center;gap:8px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--row-shadow)}
.card>*+*{border-top:.5px solid var(--sep)}
.related{display:flex;align-items:center;gap:6px;margin:8px 4px 0;font-size:12px;color:var(--text-3)}
.link{color:var(--text);text-decoration:underline;text-decoration-color:var(--sep-strong);text-underline-offset:2px;font-weight:500}
.link:hover{text-decoration-color:var(--text)}

.set{display:flex;align-items:center;gap:16px;padding:10px 14px 10px 18px;min-height:52px;position:relative}
.set .lbl{flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px}
.set .t{font-size:13px;font-weight:500;line-height:18px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.set .s{font-size:12px;color:var(--text-3);line-height:16px;margin-top:1px}
.set .s.err{color:var(--failed-text)}
.set .ctl{flex:none;max-width:62%;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.set.child .lbl{padding-left:0}
.sub{color:var(--text-4);width:14px;line-height:18px;flex:none}
.dot{position:absolute;left:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--ink)}
.set.flash,.sc.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--flash)}100%{background:transparent}}
.tag{font-size:10.5px;font-weight:500;color:var(--text-3);background:var(--fill-3);padding:1px 6px;border-radius:5px}
.tag.where{font-size:11px;color:var(--text-2);background:none;box-shadow:inset 0 0 0 .5px var(--sep-strong);border-radius:6px;padding:1px 7px}
.saved{font-size:11.5px;color:var(--ok);font-weight:500;animation:fadeout 1.6s ease-out forwards}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0}}
.new{display:none;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#6e56cf;padding:1px 5px;border-radius:4px;vertical-align:middle}
body.notes .new{display:inline-block}
.val{font-size:12.5px;color:var(--text-2)}
.val.ok{color:var(--ok)}
.val.warn{color:var(--waiting)}
.reset{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);opacity:0;transition:opacity 120ms}
.set:hover .reset,.set:focus-within .reset,.sc:hover .reset,.sc:focus-within .reset{opacity:1}
.reset:hover{background:var(--fill-3);color:var(--text)}

/* controls */
.sw{width:34px;height:20px;border-radius:10px;background:var(--fill-4);box-shadow:inset 0 0 0 .5px var(--sep-strong);position:relative;flex:none;transition:background 180ms ease-out}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06);transition:transform 220ms var(--out)}
.sw[aria-checked=true]{background:var(--on);box-shadow:none}
.sw[aria-checked=true]::after{transform:translateX(14px)}
.sw:active::after{width:19px}.sw[aria-checked=true]:active::after{transform:translateX(11px)}
.sw.sm{width:28px;height:16px}.sw.sm::after{width:12px;height:12px}.sw.sm[aria-checked=true]::after{transform:translateX(12px)}
.tg{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px 0 9px;border-radius:13px;font-size:12px;font-weight:500;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--sep-strong);transition:background 120ms,color 120ms}
.tg:hover:not(:disabled){background:var(--fill-2)}.tg[aria-checked=true]{background:var(--ink);color:var(--on-ink);box-shadow:none}.tg[aria-checked=true]:hover{background:var(--ink)}.tg:disabled{opacity:.4}
.gsub{padding:10px 14px 4px;font-size:12px;font-weight:600;color:var(--text-2);border-top:.5px solid var(--sep)}
.ck{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--sep-strong);display:flex;align-items:center;justify-content:center;color:var(--on-ink);transition:background 120ms}
.ck[aria-checked=true]{background:var(--ink);box-shadow:none}
.seg{display:flex;padding:2px;border-radius:8px;background:var(--fill-3);gap:1px}
.seg button{height:24px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-checked=true]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
[data-theme=dark] .seg button[aria-checked=true]{background:rgba(235,235,235,.16)}
.btn{height:28px;padding:0 11px;border-radius:7px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep-strong),0 1px 1px rgba(0,0,0,.05);font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform 100ms ease-out}
[data-theme=dark] .btn{background:var(--fill-3)}
.btn:active,.sbtn:active,.dd-t:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--on-ink);box-shadow:none;font-weight:500}
.btn.ghost{background:none;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--fill-2);color:var(--text)}
.btn.sm{height:24px;padding:0 9px;font-size:12px}
.dd{position:relative}
.dd-t{height:28px;padding:0 8px 0 11px;border-radius:7px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep-strong),0 1px 1px rgba(0,0,0,.05);display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap;transition:transform 100ms ease-out}
[data-theme=dark] .dd-t{background:var(--fill-3)}
.dd-t[aria-expanded=true]{background:var(--fill-3)}
.menu{position:absolute;right:0;top:calc(100% + 5px);min-width:100%;z-index:30;background:var(--popover);border-radius:10px;box-shadow:var(--pop-shadow);padding:5px;display:flex;flex-direction:column;transform-origin:top right;animation:pop 140ms var(--out)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-3px)}}
.menu .mi{height:28px;padding:0 10px 0 26px;border-radius:6px;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;position:relative}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--fill-3);box-shadow:none!important}
.menu .mi[aria-checked=true]::before{content:"✓";position:absolute;left:9px;font-size:12px}
.menu .mi:disabled{opacity:.4}
.menu .mi .mh{margin-left:auto;padding-left:16px;color:var(--text-3);font-size:11.5px}
.menu .msep{height:.5px;background:var(--sep);margin:4px 6px}
.menu .mf{margin:2px 2px 5px;height:28px;border-radius:6px;background:var(--fill-3);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--text-3)}
.menu .mf input{border:0;background:none;flex:1;min-width:0}
.menu .mlist{max-height:240px;overflow:auto;display:flex;flex-direction:column}
.menu .mempty{padding:8px 10px;color:var(--text-3);font-size:12px}
.step{display:flex;align-items:center;height:28px;border-radius:7px;background:var(--fill-3)}
.step button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--text-2);border-radius:7px}
.step button:hover{color:var(--text);background:var(--fill-2)}
.step input{width:44px;border:0;background:none;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;padding:0}
.step .u{font-size:12.5px;color:var(--text-2);padding:0 2px 0 3px;min-width:14px}
.field{height:28px;width:240px;border:0;border-radius:7px;background:var(--fill-3);padding:0 9px;font-size:12.5px}
.field.mono{font-family:var(--mono);font-size:12px}
.field.bad{box-shadow:inset 0 0 0 1px var(--failed)}
.field::placeholder{color:var(--text-4)}
.pathf{height:28px;max-width:240px;border-radius:7px;background:var(--fill-2);display:flex;align-items:center;padding:0 9px;font:12px var(--mono);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:180px;accent-color:var(--ink)}
.swatches{display:flex;gap:7px}
.swatches button{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.swatches button[aria-checked=true]{box-shadow:0 0 0 2px var(--page),0 0 0 3.5px var(--text-2)}
.ansi{display:grid;grid-template-columns:repeat(8,18px);gap:5px}
.ansi button{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.play{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fill-3)}
.preview{margin:0 14px 12px;border-radius:8px;background:var(--well);font:12px/1.7 var(--mono);padding:8px 12px;color:var(--text-body)}
.preview .del{background:rgba(229,72,77,.12);display:block;margin:0 -12px;padding:0 12px}
.preview .add{background:rgba(48,164,108,.14);display:block;margin:0 -12px;padding:0 12px}
.blockrow{display:block}
.filter{display:flex;align-items:center;gap:7px;height:30px;margin:10px 12px;padding:0 9px;border-radius:8px;background:var(--fill-2);color:var(--text-3)}
.filter input{flex:1;border:0;background:none;min-width:0}
.ent{display:flex;align-items:center;gap:12px;padding:9px 14px;min-height:50px;width:100%}
button.ent:hover{background:var(--fill-1)}
.tile{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.tile.soft{background:var(--fill-3);color:var(--text-2)}
.ent .t{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.ent .s{font-size:12px;color:var(--text-3)}
.ent .grow{flex:1;min-width:0}
.ent .chev{color:var(--text-4)}
.pill{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--fill-3);color:var(--text-2)}
.pill.bad{background:var(--failed-bg);color:var(--failed-text)}
.pill.ok{background:rgba(48,164,108,.14);color:var(--ok)}
.fold{display:flex;align-items:center;gap:6px;padding:10px 14px;color:var(--text-2);font-size:12.5px;width:100%}
.fold:hover{background:var(--fill-1)}
.days{display:flex;gap:3px}
.days button{width:24px;height:24px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--text-3);background:var(--fill-2)}
.days button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.ierr{font-size:11.5px;color:var(--failed-text)}

/* notifications matrix */
.mx{display:grid;grid-template-columns:1fr 84px 84px;align-items:center;padding:9px 14px 9px 18px;min-height:50px;position:relative}
.mx.head{min-height:40px;background:var(--fill-1);border-radius:12px 12px 0 0;font-size:12px;font-weight:600;color:var(--text-2)}
.mx .c{display:flex;justify-content:center;align-items:center;gap:7px;position:relative}
.mx .c .dot{left:auto;right:12px;top:-2px;margin:0}
.mx .t{font-size:13px;font-weight:500}
.hhead{border-top:.5px solid var(--sep)}.hfold{display:flex;align-items:center;gap:7px;color:var(--text);font-weight:600;font-size:12.5px}.hfold .n{color:var(--text-3);font-weight:400}.hfold .pill{font-weight:500}
.ent.off{opacity:.55}
.mx .s{font-size:12px;color:var(--text-3)}

/* keyboard */
.ktool{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ksearch{flex:1 1 100%;min-width:220px;height:30px;display:flex;align-items:center;gap:7px;padding:0 4px 0 9px;border-radius:8px;background:var(--fill-3);color:var(--text-3)}
.ksearch input{flex:1;min-width:0;border:0;background:none}
.ksearch:focus-within{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--focus)}
.kfind{height:24px;padding:0 7px;border-radius:6px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.kfind:hover,.kfind[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--cap-shadow)}
.chips{display:flex;gap:4px}
.chips button{height:26px;padding:0 10px;border-radius:13px;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.chips button:hover{background:var(--fill-2)}
.chips button[aria-checked=true]{background:var(--ink);color:var(--on-ink);font-weight:500}
.chips .n{opacity:.7;font-variant-numeric:tabular-nums}
.findbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--fill-2);font-size:12.5px;color:var(--text-2)}
.sc{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 18px;min-height:42px;position:relative}
.sc .lab{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px}
.sc .keys{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.caps{display:inline-flex;gap:3px}
.cap{min-width:20px;height:20px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:var(--surface);box-shadow:var(--cap-shadow);font-size:11.5px;font-weight:500;color:var(--text-2);font-family:var(--sans)}
[data-theme=dark] .cap{background:rgba(235,235,235,.12);color:var(--text-body)}
.chip{display:inline-flex;align-items:center;border-radius:7px;position:relative}
.chip .kb{padding:3px 5px;border-radius:7px;display:flex;align-items:center;gap:3px;background:var(--fill-1);box-shadow:inset 0 0 0 .5px var(--sep-strong)}
.chip .kb:hover{background:var(--fill-3)}
.chip .kb .ind{color:var(--text-3);margin-left:1px}
.chip .x{width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;position:absolute;right:-6px;top:-6px;background:var(--text-3);color:var(--page);z-index:2}
.chip:hover .x,.chip:focus-within .x{display:flex}

@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}
.toasts{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:40;pointer-events:none}

function stepper(r,v,dis){return`<div class="step"><button aria-label="Decrease ${esc(r.label)}" data-act="step" data-id="${r.id}" data-d="-1"${dis||v<=r.min?' disabled':''}>${'–'}</button><input inputmode="numeric" aria-label="${esc(r.label)}" value="${v}" data-commit="${r.id}" data-fid="c:${r.id}"${dis?' disabled':''}><span class="u">${esc((r.unit||'').trim())}</span><button aria-label="Increase ${esc(r.label)}" data-act="step" data-id="${r.id}" data-d="1"${dis||v>=r.max?' disabled':''}>+</button></div>`}
function slider(r,v,dis){return`<input type="range" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" aria-label="${esc(r.label)}" data-range="${r.id}" data-fid="c:${r.id}"${dis?' disabled':''}><span class="val" style="width:38px;text-align:right">${v}${esc(r.unit)}</span>`}
const SWC={Ink:'#3f3f46',Blue:'#3e8ef7',Purple:'#8e4ec6',Pink:'#c2298a',Red:'#e5484d',Orange:'#f76b15',Yellow:'#ffb224',Green:'#30a46c'};
function control(r){const v=get(r.id),dis=!!offReason(r)||(S.q&&!allowed(r));
  switch(r.kind){
    case'switch':return swHTML(r.id,v,r.label,dis);

      return(segLook(r)?seg(r,v,dis):dropdown(r,v,dis))+(r.play?`<button class="play" aria-label="Play ${esc(v)}" data-act="toast" data-msg="▶ ${esc(v)}">${ic('play',12)}</button>`:'');
    case'stepper':return r.look==='slider'?slider(r,v,dis):stepper(r,v,dis);
    case'text':{const bad=S.errors['v:'+r.id];return`<input class="field${r.mono?' mono':''}${bad?' bad':''}" aria-label="${esc(r.label)}" value="${esc(S.vals['draft:'+r.id]??v)}" placeholder="${esc(r.ph)}" data-commit="${r.id}" data-fid="c:${r.id}"${dis?' disabled':''}>`}

    case'custom':return(DRAW[r.draw||r.id]||(()=>''))(r)}}
function rowHTML(r,{search=false}={}){
  if(r.block&&!search)return`<div class="blockrow" data-row="${r.id}">${DRAW[r.id](r)}</div>`;
  const changed=isChanged(r),err=S.errors[r.id],verr=S.errors['v:'+r.id],off=offReason(r),blocked=!allowed(r),child=!!r.when&&!search&&ROW[r.when.id].group===r.group;
  const saved=S.saved[r.id]&&Date.now()-S.saved[r.id]<1700;
  let hint=r.hint?hl(r.hint):'';
  if(off)hint=esc(off)+(r.id==='glass'?` <button class="link" data-act="go-dark" data-fid="go-dark">Use ${esc(get('night'))}</button>`:'');
  if(verr)hint=`<span class="ierr">${esc(verr)}</span>`;

  const reset=changed?`<button class="reset" title="Reset to default (${esc(fmt(r,r.def))})" aria-label="Reset ${esc(r.label)} to ${esc(fmt(r,r.def))}" data-act="reset-row" data-id="${r.id}" data-fid="r:${r.id}">${ic('reset',13)}</button>`:'';
  const ctl=blocked&&(search||S.reveal===r.id)?`<button class="btn sm" data-act="satisfy" data-id="${r.id}" data-fid="sat:${r.id}">${esc(turnOnLabel(r))}</button>`:control(r);
  const where=search?`<span class="tag where">${esc(r.group)}</span>`:'';
  return`<div class="set${child?' child':''}${S.flash===r.id?' flash':''}" data-row="${r.id}">${changed?'<i class="dot" title="Changed from default"></i>':''}
    <div class="lbl">${child?'<span class="sub">↳</span>':''}<div><div class="t">${hl(r.label)}${where}${r.adv?'<span class="tag">Advanced</span>':''}${saved?`<span class="saved">${ic('check',11,2)}Saved</span>`:''}</div>${hint?`<div class="s${err?' err':''}">${hint}</div>`:''}</div></div>
    <div class="ctl">${reset}${ctl}${search?`<button class="go" title="Show in ${esc(SEC[r.sec].label)}" aria-label="Show in ${esc(SEC[r.sec].label)}" data-act="goto" data-sec="${r.sec}" data-id="${r.id}">${ic('arrow',13)}</button>`:''}</div></div>`}

function signinHTML(prov){const t=S.signin,sc=SIGNIN[prov];
  if(t.state==='done')return`<div class="signin" aria-live="polite"><div class="st ok">${ic('check',13,2.2)} Signed in as ${esc(sc.who[0])}</div></div>`;
  const st=`<div class="st" aria-live="polite"><i class="spin"></i><span>${sc.code?`Enter this code in your browser to sign in to ${esc(prov)}…`:`Finish signing in to ${esc(prov)} in your browser…`}</span><span class="host">this Mac</span></div>`;
  const dev=sc.code?`<div class="devcode">${sc.code}<button class="btn sm" data-act="toast" data-msg="Copied ${sc.code}">Copy code</button></div>`:'';
  const field=sc.pastes?`<label class="codef"><input data-code placeholder="Code from the page, if any" aria-label="Code from the sign-in page" data-fid="code-in" value="${esc(t.input)}" spellcheck="false" autocomplete="off">${t.input.trim()?`<button class="enter" data-act="code-send" data-fid="code-send" title="Send the code (↩)">↩ Enter</button>`:''}</label>`:'';
  const out=t.output?`<div class="out">${sc.lines.map(esc).join('\n')}</div>`:'';
  return`<div class="signin">${st}${dev}<div class="acts"><button class="btn sm" data-act="signin-open" data-fid="signin-open">Open again</button><button class="btn sm" data-act="toast" data-msg="Copied the sign-in link">Copy link</button>${field}<span style="flex:1"></span><button class="btn sm" data-act="signin-cancel" data-fid="signin-cancel">Cancel</button></div>
  <div><button class="out-t" data-act="signin-output" aria-expanded="${!!t.output}" data-fid="signin-output">${ic(t.output?'down':'chev',11)} Terminal output</button></div>${out}</div>`}
function signinFinish(){const t=S.signin;if(!t||t.state!=='run')return;const [mail,plan]=SIGNIN[t.prov].who;t.state='done';
  ACCOUNTS.push([mail,plan,t.prov,0,0,false,false,0]);render();setTimeout(()=>{if(S.signin===t){S.signin=null;S.newAcct=ACCOUNTS.length-1;toast(`Added ${mail} to ${t.prov}`);render();setTimeout(()=>{S.newAcct=null},1800)}},1200)}
function signinSend(){if(S.signin?.input.trim())signinFinish()}

function gotoRow(sec,id){const r=ROW[id];S.q='';document.getElementById('q').value='';S.section=sec;if(r?.adv)S.adv[sec]=true;const blocked=r&&!allowed(r);S.reveal=blocked?id:null;
  S.flash=r?.inBlock&&/^(sound|banner)-/.test(id)?'banner-'+id.replace(/^(sound|banner)-/,''):id;S.focusNext=r?(blocked?'sat:'+id:(r.kind==='choice'&&segLook(r)?`c:${id}:${r.options.indexOf(get(id))}`:'c:'+id)):null;render()}
function closeLayer(){if(S.menu){const id=S.menu;S.menu=null;S.mfilter='';S.focusNext=id.startsWith('grp:')?id:'c:'+id;render();return true}
  if(S.sheet){S.sheet=null;S.focusNext=S.sheetFrom;S.focusAlt='nav:'+S.section;render();return true}
  if(S.rec){if(S.rec.pending){S.rec.pending=null;render();return true}const id=S.rec.id,slot=S.rec.slot;S.rec=null;S.focusNext=`k:${id}:${slot}`;render();return true}
  if(S.pendingReset){S.pendingReset=null;render();return true}
  if(S.find){S.find=null;S.focusNext='find';render();return true}
  if(S.q){S.q='';document.getElementById('q').value='';render();return true}
  if(SEC[S.section].parent){nav(SEC[S.section].parent);return true}
  toast('Esc here closes Settings and returns to your sessions');return true}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  switch(a){
    case'nav':nav(t.dataset.sec);break;
    case'proj-fold':S.projFold[v]=!S.projFold[v];S.focusNext='pf:'+v;render();break;
    case'close':toast('Back closes Settings and returns to your sessions');break;
    case'toggle':S.menu=null;if(id.startsWith('adv:')){const s=id.slice(4);S.adv[s]=!S.adv[s];render();break}write(id,!get(id));break;
    case'pick':if(id){const r=ROW[id];if(v==='Custom audio…'){S.menu=null;toast('Opens a file picker for .mp3, .wav or .ogg');render();break}S.menu=null;S.mfilter='';S.focusNext='c:'+id;write(id,v);}break;
    case'menu':S.menu=S.menu===id?null:id;S.mfilter='';render();break;
    case'step':{const r=ROW[id];write(id,Math.min(r.max,Math.max(r.min,get(id)+r.step*+t.dataset.d)));break}
    case'reset-row':{const r=ROW[id];delete S.vals[id];delete S.errors[id];delete S.errors['v:'+id];delete S.vals['draft:'+id];S.focusNext='c:'+id;toast(`${r.label} reset to ${fmt(r,r.def)}`);render();break}
    case'reset-section':S.sheet=S.q?null:S.section;S.sheetFrom=t.dataset.fid;render();break;
    case'sheet-cancel':S.sheet=null;S.focusNext=S.sheetFrom;S.focusAlt='nav:'+S.section;render();break;
    case'sheet-ok':{const c=changedIn(S.sheet);c.forEach(x=>x.reset());const n=c.length;S.sheet=null;S.focusNext=S.sheetFrom;S.focusAlt='nav:'+S.section;
      toast(`Reset ${n} setting${n>1?'s':''}`,{undo:true,restore:()=>{const why=c.map(x=>x.undo()).filter(Boolean);if(why.length)setTimeout(()=>toast(`Kept some defaults: ${why[0]}`,{bad:true}))}});render();break}
    case'undo':{const tt=S.toasts.find(x=>x.id==+v);const why=tt?.restore?.();S.toasts=S.toasts.filter(x=>x!==tt);if(typeof why==='string')toast(`Can’t undo: ${why}`,{bad:true});render();break}
    case'retry':delete S.errors[id];S.toasts=S.toasts.filter(x=>x.retry!==id);write(id,!get(id));break;
    case'satisfy':{const r=ROW[id];const l=turnOnLabel(r);satisfy(r);S.reveal=null;S.flash=r.inBlock?'banner-'+id.replace(/^(sound|banner)-/,''):id;S.focusNext='c:'+id;toast(`${l}: done`);render();break}
    case'goto':gotoRow(t.dataset.sec,id);break;
    case'go-dark':write('theme',get('night'));break;
    case'toast':toast(t.dataset.msg);break;
    case'path':toast('Opens a folder picker');break;
    case'del-theme':S.themes=S.themes.filter(x=>x!==v);toast(`Moved ${v} to the Trash`,{undo:true,restore:()=>S.themes.push(v)});render();break;
    case'acct-add':S.signin={prov:t.dataset.p,input:'',state:'run',output:false};S.focusNext=SIGNIN[t.dataset.p].pastes?'code-in':'signin-cancel';render();break;
    case'signin-cancel':{const p=S.signin?.prov;S.signin=null;S.focusNext='acct-add:'+p;render();break}
    case'signin-output':S.signin.output=!S.signin.output;render();break;
    case'signin-open':toast('Opens the sign-in page in your browser again');if(!SIGNIN[S.signin.prov].pastes)setTimeout(signinFinish,1200);break;
    case'code-send':signinSend();break;
    case'acct-default':S.acctDef[t.dataset.p]=+v;S.menu=null;S.focusNext='acct:'+v;toast(`New ${t.dataset.p} agents start on ${ACCOUNTS[+v][0]}`);render();break;
    case'prov-fold':S.provFold=!S.provFold;render();break;
    case'day':{const[t0,d0]=get('automation-schedule').split('|');let days=d0?d0.split(','):[];days=days.includes(v)?days.filter(x=>x!==v):[...days,v];if(!days.length){toast('Pick at least one day');break}const order=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];S.focusNext='day:'+v;write('automation-schedule',`${t0}|${order.filter(x=>days.includes(x)).join(',')}`);break}
    case'int-unit':S.intUnit=v;render();break;
    case'rec':startRec(id,t.dataset.slot==='new'?'new':+t.dataset.slot);break;
    case'rmkey':{const k=eff(id)[+t.dataset.slot],sp=spotKey(id)===k;setKeys(id,eff(id).filter((_,i)=>i!=+t.dataset.slot));toast(`Removed ${glyph(k)} from ${labelOf(id)}`,{undo:true,restore:()=>undoRemove(id,k,sp)});render();break}
    case'resolve':resolve(v);break;
    case'kreset':tryReset(id);break;
    case'kreset-cancel':S.pendingReset=null;render();break;
    case'kreset-take':{const{id:rid,others}=S.pendingReset;for(const o of others)removeCombo(o.id,o.combo);resetKeysOf(rid);S.pendingReset=null;toast(`${labelOf(rid)} has its default keys back`);render();break}
    case'grp-pick':S.groups[id]=v===SCI[id].group.mods?undefined:v;if(!S.groups[id])delete S.groups[id];S.menu=null;S.focusNext='grp:'+id;render();break;
    case'kfilter':S.kfilter=v;render();break;
    case'find':S.find=S.find?null:{combo:null};S.rec=null;render();break;
    case'find-clear':S.find=null;render();break;
    case'fixed':S.fixedOpen=!S.fixedOpen;render();break;
  }});
// Close in place: re-rendering here would replace the pressed control before its click lands.
document.addEventListener('pointerdown',e=>{if(!S.menu)return;if(e.target.closest('.menu')||e.target.closest(`[data-act=menu][data-id="${CSS.escape(S.menu)}"]`))return;
  S.menu=null;S.mfilter='';document.querySelectorAll('.menu').forEach(m=>m.remove());document.querySelectorAll('[data-act=menu][aria-expanded=true]').forEach(b=>b.setAttribute('aria-expanded','false'))},true);
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.code!==undefined){const had=!!S.signin.input.trim();S.signin.input=t.value;if(had!==!!t.value.trim())render();return}
  if(t.id==='q'){S.q=t.value;S.menu=null;render();return}
  if(t.id==='kq'){S.kq=t.value;render();return}
  if(t.dataset.mfilter!==undefined){S.mfilter=t.value;render();return}
  if(t.dataset.projq!==undefined){S.projQ=t.value;render();return}
  if(t.dataset.range){S.vals[t.dataset.range]=+t.value;if(+t.value===ROW[t.dataset.range].def)delete S.vals[t.dataset.range];t.nextElementSibling.textContent=t.value+ROW[t.dataset.range].unit;return}
  if(t.dataset.commit){S.vals['draft:'+t.dataset.commit]=t.value}});
document.addEventListener('change',e=>{if(e.target.dataset.range)render()});
function commitField(t,silent){const W=silent?(id,v)=>{set(id,v);S.saved[id]=Date.now()}:write,R=silent?()=>{}:render;const id=t.dataset.commit;if(id){const r=ROW[id];delete S.vals['draft:'+id];
    if(r.kind==='stepper'){let n=parseInt(t.value,10);if(isNaN(n))n=get(id);n=Math.min(r.max,Math.max(r.min,Math.round(n/r.step)*r.step));if(n!==get(id))W(id,n);else R();return}
    const ok=r.valid?r.valid(t.value):true;if(ok!==true){S.errors['v:'+id]=ok;S.vals['draft:'+id]=t.value;render();return}delete S.errors['v:'+id];if(t.value!==get(id))W(id,t.value);else R();return}
  if(t.dataset.sched!==undefined){const v=t.value.trim();if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){S.errors['v:automation-schedule']='Use 24-hour time, like 09:00';S.vals['draft:automation-schedule']=v;render();return}
    delete S.errors['v:automation-schedule'];delete S.vals['draft:automation-schedule'];const d=get('automation-schedule').split('|')[1];if(v!==get('automation-schedule').split('|')[0])W('automation-schedule',`${v}|${d}`);else R();return}
  if(t.dataset.int!==undefined){const div=S.intUnit==='days'?1440:S.intUnit==='h'?60:1;const n=parseFloat(t.value)*div;if(isNaN(n)||n<5||n>10080){S.errors['v:automation-every']='Between 5 minutes and 7 days';render();return}delete S.errors['v:automation-every'];const m=Math.round(n/5)*5;if(m===60)delete S.vals['automation-every'];else S.vals['automation-every']=m;S.saved['automation-every']=Date.now();R()}}
document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset?.commit||t.dataset?.int!==undefined||t.dataset?.sched!==undefined)commitField(t,!!e.relatedTarget?.closest?.('button'))});

/* ---------- keyboard ---------- */
window.addEventListener('keydown',e=>{
  if(e.target.dataset?.code!==undefined&&e.key==='Enter'){e.preventDefault();signinSend();return}
  if(S.sheet&&e.key==='Tab'){e.preventDefault();const b=[...document.querySelectorAll('.sheet button')];const i=b.indexOf(document.activeElement);b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus();return}
  if(S.rec&&!S.rec.pending){e.preventDefault();e.stopPropagation();const r=S.rec;
    if(['Shift','Control','Alt','Meta'].includes(e.key)){r.live=evMods(e);r.msg=null;const f=document.querySelector('[data-fid=recf]');if(f)f.innerHTML=r.live.length?capsHTML(MOD.filter(([m])=>r.live.includes(m)).map(x=>x[1])):'Press keys…';return}
    const key=evKey(e),mods=evMods(e);if(!key)return;
    if(key==='escape'&&!mods.length){closeLayer();return}
    if(key==='backspace'&&!mods.length){if(r.slot!=='new'){const k=eff(r.id)[r.slot];setKeys(r.id,eff(r.id).filter((_,i)=>i!==r.slot));toast(`Removed ${glyph(k)} from ${labelOf(r.id)}`)}S.rec=null;render();return}
    if(!/^f\d+$/.test(key)&&!mods.some(m=>m!=='shift')){r.msg=`${keyName(key)} alone types text. Add ⌘, ⌃ or ⌥.`;render();return}
    tryAssign(norm(mods,key));return}
  if(S.find&&!S.find.combo){const key=evKey(e),mods=evMods(e);if(!key)return;e.preventDefault();if(key==='escape'&&!mods.length){closeLayer();return}S.find.combo=norm(mods,key);render();return}
  const inField=e.target.matches('input,textarea');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();const q=document.getElementById('q');q.focus();q.select();return}
  if(e.metaKey&&e.key==='['){const p=SEC[S.section].parent;if(p){e.preventDefault();nav(p);S.focusNext='nav:'+p}return}
  if(e.key==='Escape'){e.preventDefault();if(e.target.id==='q'&&S.q){S.q='';e.target.value='';render();return}closeLayer();return}
  if(e.target.id==='q'&&e.key==='Enter'){e.preventDefault();const res=results();if(!res.length)return;const f=res[0];if(f.rows[0])gotoRow(f.s.id,f.rows[0].id);else{const x=f.ext[0];if(x.type==='key')gotoRow('keyboard',x.r.id);else nav(x.type==='sec'?x.s.id:f.s.id)}return}
  if(e.target.id==='q'&&e.key==='ArrowDown'){e.preventDefault();document.querySelector('#stage [data-fid],#stage button')?.focus();return}
  if(e.target.closest('.menu')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const items=[...document.querySelectorAll('.menu .mi:not(:disabled)')];const i=items.indexOf(document.activeElement);items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();return}
  if(e.target.matches('[data-mfilter]')&&e.key==='ArrowDown'){e.preventDefault();document.querySelector('.menu .mi')?.focus();return}
  if(e.target.matches('[data-mfilter]')&&e.key==='Enter'){document.querySelector('.menu .mi')?.click();return}
  if(e.target.closest('#navlist')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const items=[...document.querySelectorAll('#navlist .ni')];const i=items.indexOf(document.activeElement);const n=items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length];n.focus();return}
  if(e.target.closest('[role=radiogroup]')&&['ArrowLeft','ArrowRight'].includes(e.key)&&!inField){e.preventDefault();const g=e.target.closest('[role=radiogroup]');const items=[...g.querySelectorAll('[role=radio]:not(:disabled)')];const i=items.indexOf(e.target);const n=items[(i+(e.key==='ArrowRight'?1:-1)+items.length)%items.length];n.click();setTimeout(()=>document.querySelector(`[data-fid="${CSS.escape(n.dataset.fid||'')}"]`)?.focus());return}
  if(inField&&e.key==='Enter'){e.target.blur();return}
  if(!inField&&!e.metaKey&&!e.ctrlKey){if(e.key==='d'||e.key==='D'){toggleDark();return}if(e.key==='?'){toggleHelp();return}if(e.key==='/'){e.preventDefault();document.getElementById('q').focus();return}}
},true);
window.addEventListener('keyup',e=>{if(S.rec&&!S.rec.pending&&['Shift','Control','Alt','Meta'].includes(e.key)){S.rec.live=evMods(e);const f=document.querySelector('[data-fid=recf]');if(f)f.innerHTML=S.rec.live.length?capsHTML(MOD.filter(([m])=>S.rec.live.includes(m)).map(x=>x[1])):'Press keys…'}});

  'Keyboard · unassigned':()=>{S.section='keyboard';S.kfilter='unassigned'},
};
const sel=document.getElementById('pState');sel.innerHTML=Object.keys(STATES).map(k=>`<option>${esc(k)}</option>`).join('');
function applyState(name){S=S0();STATES[name]?.();S.scrollTo=S.scrollTo||S.rec?.id||S.pendingReset?.id||null;document.getElementById('q').value=S.q;render()}
sel.onchange=()=>applyState(sel.value);
const qs=new URLSearchParams(location.search);if(qs.get('dark'))osDark=true;if(qs.get('notes')==='0'){document.body.classList.remove('notes');document.getElementById('pNotes').setAttribute('aria-pressed','false')}
const st0=qs.get('s');if(st0){const k=Object.keys(STATES).find(k=>k.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')===st0);if(k){sel.value=k;applyState(k)}else render()}else render();
</script>
