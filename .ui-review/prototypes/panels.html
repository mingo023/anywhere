<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket · Panels prototype</title>
<style>
:root{
  --text:#111113;--text-body:#3f3f46;--text-2:#6f6f78;--text-3:#8b8b94;--text-4:#a1a1aa;--text-5:#b4b4bc;--text-6:#d4d4d8;
  --window:#f4f4f5;--surface:#fff;--sunken:#fafafa;--page:#f7f7f7;--side:#f8f8f9;
  --glass:rgba(255,255,255,.62);--highlight:rgba(255,255,255,.95);--shadow:rgba(0,0,0,.14);
  --fill-1:rgba(17,17,19,.031);--fill-2:rgba(17,17,19,.043);--fill-3:rgba(17,17,19,.055);--fill-4:rgba(17,17,19,.067);
  --hairline:rgba(17,17,19,.071);--sep:rgba(17,17,19,.09);--sep-strong:rgba(17,17,19,.122);
  --cursor:rgba(48,48,53,.55);
  --accent:#5b5bd6;--accent-bg:rgba(91,91,214,.11);--accent-ring:rgba(91,91,214,.2);
  --waiting:#ad5700;--waiting-bg:rgba(255,178,36,.18);
  --failed:#cd2b31;--failed-bg:rgba(229,72,77,.11);
  --success:#2b9a66;--success-text:#18794e;
  --claude:#d97757;--teal:#0e7c86;
  --add-bg:rgba(48,164,108,.11);--del-bg:rgba(229,72,77,.09);
  --syn-kw:#8e4ec6;--syn-fn:#3e63dd;--syn-str:#18794e;--syn-com:#a1a1aa;
  --row-shadow:0 1px 2px rgba(17,17,19,.06),0 0 0 .5px rgba(17,17,19,.06);
  --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--text);
  background:radial-gradient(1100px 700px at 12% 0%,#d9dfe9 0%,transparent 60%),radial-gradient(900px 600px at 92% 100%,#e0d9e6 0%,transparent 60%),#c8cdd7}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default}
svg{display:block;flex:none}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot6,.dot7{display:inline-block;border-radius:50%;flex:none}
.dot6{width:6px;height:6px}.dot7{width:7px;height:7px;background:var(--waiting)}
.md{display:inline-flex;font-family:var(--mono);font-weight:500;white-space:nowrap}
.md .ma{color:var(--success-text)}.md .mr{color:var(--failed)}
.glass{background:var(--glass);box-shadow:0 0 0 .5px var(--hairline),inset 0 1px 0 var(--highlight),0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}

/* window */
#win{position:absolute;display:flex;border-radius:10px;overflow:hidden;background:var(--window);
  box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 24px 70px rgba(0,0,0,.24),0 6px 18px rgba(0,0,0,.1);user-select:none;-webkit-user-select:none}
.lights{position:absolute;left:14px;top:15px;display:flex;gap:8px;z-index:60;pointer-events:none}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.col{position:relative;flex:none;display:flex;flex-direction:column;min-height:0}
#win[data-layout=compact] #projects,#win[data-layout=compact] #sessions,
#win[data-layout=focus] #projects,#win[data-layout=focus] #sessions,#win[data-layout=focus] #rail,
#win[data-layout=sidebars] #rail{display:none}
.seam{position:absolute;top:0;bottom:0;right:-10px;width:20px;z-index:70;cursor:col-resize}
.seam::after{content:"";position:absolute;left:9.5px;top:0;bottom:0;width:1px;background:var(--sep-strong);opacity:0;transition:opacity .12s}
.seam:hover::after,.seam.active::after{opacity:1;transition-delay:.08s}

/* projects column */
#projects{width:var(--pw,272px);background:var(--window);padding:0 8px 10px}
.ptop{height:42px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding-right:2px}
.b28{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;position:relative}
.b22{width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.b28:hover,.b22:hover{background:var(--fill-3)}
.count{position:absolute;top:0;right:-1px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--waiting);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--window)}
.search{height:32px;flex:none;border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);box-shadow:0 0 0 .5px var(--hairline);font-size:13.5px;color:var(--text-3)}
.search kbd{margin-left:auto;font:11.5px var(--sans);color:var(--text-3)}
.phead{height:22px;display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px;padding:0 4px 0 9px;font-size:12px;font-weight:600;color:var(--text-3)}
.plist{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.repo,.wt{height:32px;flex:none;border-radius:9px;display:flex;align-items:center;padding-right:10px;white-space:nowrap}
.repo{padding-left:4px;font-size:14.5px;font-weight:600}
.repo .chev{width:16px;display:grid;place-items:center;margin-right:4px}
.mark{width:22px;height:22px;flex:none;border-radius:6px;background:#fff;box-shadow:0 0 0 .5px var(--sep-strong);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text-2)}
.repo .mark{margin-right:8px}
.wt{padding-left:24px;font-size:13.5px;font-weight:450;color:var(--text-body)}
.wt .wi{width:22px;display:grid;place-items:center;margin-right:8px}
.wt.sel{background:var(--fill-4);font-weight:600;color:var(--text)}
.repo:hover,.wt:not(.sel):hover{background:var(--fill-2)}
.rn,.wn{flex:1;overflow:hidden;text-overflow:ellipsis}
.pgap{height:12px;flex:none}
.pfoot{flex:none;display:flex;flex-direction:column;gap:2px}
.usage{height:34px;border-radius:10px;background:rgba(255,255,255,.5);box-shadow:0 0 0 .5px var(--hairline);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12.5px;color:var(--text-2);margin-bottom:6px}
.usage span+svg{margin-left:8px}.usage .ul{margin-left:auto;color:var(--text-2)}
.fl{font-size:12.5px;color:var(--text-2);padding:5px 8px}
.fbtns{display:flex;gap:8px;margin-top:6px}
.addp{flex:1;height:36px;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600}
.setb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-top:1px}

/* sessions column */
#sessions{width:var(--sw,334px);background:var(--side);border-left:.5px solid var(--sep);border-right:.5px solid var(--sep)}
#sessions .colin,#projects .colin{display:flex;flex-direction:column;flex:1;min-height:0}
.shead{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.segs{flex:none;display:flex;gap:4px;padding:8px;border-bottom:.5px solid var(--sep)}
.seg{flex:1;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg:hover{background:var(--fill-2)}
.seg.sel{background:var(--fill-4);color:var(--text);font-weight:600}
.sbadge{display:inline-flex;align-items:center;height:17px;padding:0 5px;border-radius:8px;background:var(--hairline);font-weight:600}
.sbody{flex:1;min-height:0;overflow:hidden}
.ssearch{height:44px;display:flex;align-items:center;gap:9px;padding:0 18px;font-size:13.5px;color:var(--text-3);border-bottom:.5px solid var(--sep)}
.card{margin:8px 8px 0;padding:10px 12px 10px 14px;border-radius:10px;display:flex;flex-direction:column;gap:5px}
.card.needs{background:#ecdfc8}
.card:not(.needs):hover{background:var(--fill-2)}
.card .r1,.card .r3{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);white-space:nowrap}
.card .r3{color:var(--text-3)}
.card .r2{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{margin-left:auto;color:var(--text-3)}
.card .st{margin-left:auto;display:flex;align-items:center;gap:5px}
.chg-h{display:flex;align-items:center;gap:6px;padding:14px 14px 10px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chg-h .mono{font-size:12.5px;font-weight:400;color:var(--text-3)}
.msg{margin:0 8px;height:34px;border-radius:10px;background:#fff;box-shadow:0 0 0 .5px var(--sep-strong);display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--text-3)}
.commit{margin:8px 8px 0;height:30px;border-radius:9px;background:#111113;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600}
.chg-g{display:flex;align-items:center;gap:6px;margin:14px 8px 4px;padding:0 4px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.chg-g .n{margin-left:auto;font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--fill-4);display:grid;place-items:center}
.frow{height:28px;margin:0 8px;padding:0 8px;border-radius:7px;display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.frow:hover{background:var(--fill-2)}
.frow .dir{color:var(--text-3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.frow .m{margin-left:auto;font:600 11px var(--mono);color:var(--waiting)}
.trow{height:28px;margin:0 8px;padding-right:8px;border-radius:7px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-body);white-space:nowrap}
.trow:hover{background:var(--fill-2)}

/* compact rail */
#rail{width:56px;background:var(--window);border-right:.5px solid var(--sep);align-items:center;gap:6px;padding:37px 0 12px}
.raildrag{position:absolute;left:0;right:0;top:0;height:37px}
.rtog{width:36px;height:32px;border-radius:8px;display:grid;place-items:center;position:relative}
.rtog:hover,.toggle:hover{background:var(--fill-3)}
.rule{width:28px;height:.5px;background:var(--sep-strong);margin:2px 0;flex:none}
.m24{width:24px;height:24px}
.rs{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;position:relative;flex:none}
.rs:hover{background:var(--fill-2)}
.rs.sel{background:var(--surface);box-shadow:var(--row-shadow)}
.rs .bd{position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--window)}
.rs.sel .bd{box-shadow:0 0 0 2px var(--surface)}
.rfill{flex:1}
.compose{width:36px;height:36px;border-radius:50%;background:#111113;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.bars{display:flex;flex-direction:column;gap:3px;margin:4px 0}
.bars i{display:block;width:24px;height:3px;border-radius:2px;background:linear-gradient(to right,var(--c) var(--v),var(--fill-4) var(--v))}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--fill-4);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text-2)}
.tdot{display:none;position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1.5px var(--sunken)}
#win[data-variant=B][data-changes] .tdot{display:block}
.rtog .tdot{top:4px;right:6px;box-shadow:0 0 0 1.5px var(--window)}

/* main + panels */
#main{flex:1;min-width:0;position:relative;background:var(--sunken)}
#panels{position:absolute;inset:0;overflow:hidden}
.panel{position:absolute;container-type:inline-size;display:flex;flex-direction:column;background:var(--sunken);overflow:hidden;z-index:1;transition:opacity .18s}
.panel.enter{opacity:0}
.panel.closing{z-index:0;opacity:0;pointer-events:none}
.panel.sl::before,.panel.st::after{content:"";position:absolute;left:0;top:0;z-index:6;pointer-events:none}
.panel.sl::before{bottom:0;border-left:.5px solid var(--sep)}
.panel.st::after{right:0;border-top:.5px solid var(--sep)}
.strip{height:42px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 24px;border-bottom:.5px solid var(--sep);min-width:0}
.panel.top .strip{cursor:grab}
.strip>*{cursor:default}
.lead{display:flex;flex:none}
.toggle{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;position:relative}
.tabbar{display:flex;align-items:center;gap:2px;min-width:0;flex:0 1 auto}
.tabs-wrap{display:flex;min-width:34px;margin:-3px;padding:3px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs-wrap.fade-r{-webkit-mask-image:linear-gradient(to left,transparent,#000 24px);mask-image:linear-gradient(to left,transparent,#000 24px)}
.tabs-wrap.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 24px);mask-image:linear-gradient(to right,transparent,#000 24px)}
.tabs-wrap.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.tabs{display:flex;gap:2px;flex:none}
.tab{height:28px;flex:none;border-radius:7px;display:flex;align-items:center;padding-left:10px;font-size:12.5px;font-weight:500;color:var(--text-2);white-space:nowrap;position:relative}
.tab:hover{background:var(--fill-2)}
.tab.sel{background:var(--surface);box-shadow:var(--row-shadow);font-weight:600;color:var(--text)}
.panel:not(.focused) .tab.sel{background:var(--fill-3);box-shadow:none}
.tab .tl{display:flex;align-items:center;gap:7px}
.tab .lb{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tab .lb.it{font-style:italic}
.tab .x{width:20px;height:20px;margin:0 4px 0 6px;border-radius:5px;display:grid;place-items:center;opacity:0}
.tab:hover .x{opacity:1}
.tab .x:hover{background:var(--fill-3)}
.tab.held{visibility:hidden}
.tab.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--row-shadow);transition:box-shadow .2s;will-change:transform}
.tab.ghost.lifted{box-shadow:0 10px 28px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.08),0 0 0 .5px rgba(17,17,19,.08)}
.tab.ghost.landing{box-shadow:var(--row-shadow)}
.tab.ghost .x{opacity:0}
.plus{width:28px;height:28px;flex:none;margin-left:2px;border-radius:7px;display:grid;place-items:center}
.plus:hover,.plus.open{background:var(--fill-3)}
.status{margin-left:auto;padding-left:8px;display:flex;align-items:center;min-width:0;flex:0 1000 auto;overflow:hidden}
.status:has(.err:not(:empty)){min-width:104px}
@container (max-width:440px){.status:has(.err:not(:empty)){min-width:0}.strip .err{display:none}}
@container (max-width:340px){.strip .diff{display:none}}
.err{font-size:12.5px;color:var(--failed);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.err:not(:empty){margin-right:6px}
.ringslot{display:flex;flex:none}
.diff{flex:none;margin-right:4px;height:24px;padding:0 4px;border-radius:6px;display:flex;align-items:center}
.diff:hover{background:var(--fill-2)}
.groups{flex:none;display:flex;gap:8px}
.group{height:32px;padding:0 1px;border-radius:16px;display:flex;align-items:center}
.gb{width:34px;height:30px;border-radius:15px;display:grid;place-items:center;color:var(--text)}
.gb:hover,.gb.open{background:var(--fill-3)}
.gb:active,.plus:active,.toggle:active,.rtog:active{transform:scale(.96)}
.body{flex:1;min-height:0;position:relative;overflow:hidden}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--text-2)}
.empty span+span{color:var(--text-3);font-size:12.5px}
#preview{position:absolute;left:0;top:0;border-radius:8px;background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent-ring);pointer-events:none;z-index:40;opacity:0;transition:opacity .12s}
#preview.on{opacity:1}
#divs{position:absolute;inset:0;pointer-events:none;z-index:30}
.divider{position:absolute;pointer-events:auto}
.divider.h{width:8px;margin-left:-4px;cursor:col-resize}
.divider.v{height:8px;margin-top:-4px;cursor:row-resize}
.divider::after{content:"";position:absolute;background:var(--sep-strong);opacity:0;transition:opacity .12s}
.divider.h::after{left:3.5px;top:0;bottom:0;width:1px}
.divider.v::after{top:3.5px;left:0;right:0;height:1px}
.divider:hover::after,.divider.active::after{opacity:1;transition-delay:.08s}
.divider.active::after{transition-delay:0s}
html.grabbing,html.grabbing *{cursor:grabbing!important}
html.resizing-h,html.resizing-h *{cursor:col-resize!important}
html.resizing-v,html.resizing-v *{cursor:row-resize!important}
html.dragging #win{pointer-events:none}

/* terminals */
.term{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px 14px;font:13px/17px var(--mono);color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;user-select:text;-webkit-user-select:text;cursor:text}
.term b{font-weight:600}
.c-g{color:var(--success)}.c-r{color:var(--failed)}.c-o{color:var(--waiting)}.c-d{color:var(--text-3)}.c-t{color:var(--teal)}.c-a{color:var(--claude)}.c-p{color:var(--syn-kw)}
.cur{display:inline-block;width:.6em;height:16px;vertical-align:-3px;background:var(--cursor)}
.panel:not(.focused) .cur{background:none;box-shadow:inset 0 0 0 1px var(--cursor)}
.cx-box{margin:2px 0 2px 2ch;border:1.5px solid var(--waiting);border-radius:3px;padding:6px 1ch;max-width:54ch}
.cx-new{border:1px solid var(--text-5);border-radius:4px;padding:6px 1ch;max-width:56ch}
.pick{background:var(--waiting-bg);font-weight:600}
.umsg{background:var(--fill-3);padding:2px 0}
.dd{display:block;width:fit-content;min-width:50ch;padding-right:1ch}
.dd.add{background:var(--add-bg)}.dd.del{background:var(--del-bg)}
.cl-box{border:1px solid var(--text-5);border-radius:6px;padding:4px 1ch;margin-top:2px}
.cl-new{border:1px solid var(--claude);border-radius:6px;padding:6px 1ch;max-width:58ch}

/* docs */
.doc{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--sunken)}
.docbar{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;border-bottom:.5px solid var(--sep);font-size:13.5px;white-space:nowrap;overflow:hidden}
.crumbs{display:flex;align-items:center;white-space:nowrap;color:var(--text-2);min-width:0;overflow:hidden}
.crumbs span,.crumbs b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumbs span{flex-shrink:1000}
.crumbs i{font-style:normal;color:var(--text-5);margin:0 7px}
.crumbs b{color:var(--text);font-weight:600}
.mod{display:flex;align-items:center;gap:6px;margin-left:8px}
.docbar .dsep{font-style:normal;color:var(--text-5)}
.docbar .sp{flex:1}
.segc{display:flex;padding:2px;border-radius:9px;background:var(--fill-3);flex:none}
.segc button{height:24px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--text-2);font-weight:500}
.segc button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.05)}
.viewed{height:32px;border-radius:16px;padding:0 12px 0 10px;display:flex;align-items:center;gap:8px;font-size:13px;flex:none}
@container (max-width:560px){.docbar .viewed{display:none}}
.cb{width:14px;height:14px;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 1px var(--sep-strong)}
.gmore{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.code{flex:1;min-height:0;overflow:hidden;background:var(--page);font:13px/22px var(--mono);user-select:text;-webkit-user-select:text;padding-bottom:12px}
.dl{display:flex;white-space:pre}
.dl .g{width:44px;flex:none;text-align:right;color:var(--text-4);padding-right:4px}
.dl .s{width:24px;flex:none;text-align:center}
.dl.add{background:var(--add-bg)}.dl.add .s{color:var(--success-text)}
.dl.del{background:var(--del-bg)}.dl.del .s{color:var(--failed)}

.wp-tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;background:#e9f9ee;color:#18794e}

.menu{padding:6px;opacity:0;transform:scale(.96);transition:opacity .15s,transform .15s cubic-bezier(.2,.9,.3,1)}

    for (const k in pv.sp) if (!pv.sp[k].done) { pv.sp[k].step(dt); moving = true; }
    if (moving) { paintPreview(); busy = true; }
  }
  let winMoving = false;
  for (const k in winS) if (!winS[k].done) { winS[k].step(dt); winMoving = true; }
  if (winMoving) { applyWin(); busy = true; }
  if (busy && !raf) raf = requestAnimationFrame(frame);
}

/* ---------- drop preview ---------- */
const pv = {shown: false, sp: {l: new Spring(0, .26), t: new Spring(0, .26), r: new Spring(0, .26), b: new Spring(0, .26)}};
function paintPreview() {
  const {l, t, r, b} = pv.sp;
  Object.assign(previewEl.style, {left: l.x + 'px', top: t.x + 'px', width: (r.x - l.x) + 'px', height: (b.x - t.x) + 'px'});
}
function zoneRect(pid, side) {
  const r = rects.get(pid);
  let x = r.x, y = r.y + STRIP_H, w = r.w, hh = r.h - STRIP_H;
  if (side === 'left') w /= 2;
  else if (side === 'right') { x += w / 2; w /= 2; }
  else if (side === 'top') hh /= 2;
  else if (side === 'bottom') { y += hh / 2; hh /= 2; }
  return {x: x + 4, y: y + 4, w: w - 8, h: hh - 8};
}
function showPreview(hit) {
  if (!hit || hit.kind !== 'zone') { hidePreview(); return; }
  const z = zoneRect(hit.panel, hit.side);
  const snap = !pv.shown;
  pv.sp.l.set(z.x, snap); pv.sp.t.set(z.y, snap); pv.sp.r.set(z.x + z.w, snap); pv.sp.b.set(z.y + z.h, snap);
  if (snap) paintPreview();
  pv.shown = true;
  previewEl.classList.add('on');
}
function hidePreview() { pv.shown = false; previewEl.classList.remove('on'); }
const previewNow = () => ({x: pv.sp.l.x, y: pv.sp.t.x, w: pv.sp.r.x - pv.sp.l.x, h: pv.sp.b.x - pv.sp.t.x});

/* ---------- tab drag ---------- */
function recordTabs() {
  const m = new Map();
  for (const [id, el] of tabEls) {
    const strip = el.parentElement;
    if (!el.isConnected || !strip) continue;
    m.set(id, {panel: strip.closest('.panel').dataset.panel, x: el.getBoundingClientRect().left - strip.getBoundingClientRect().left});
  }
  return m;
}
function flip(before) {
  const moved = [];
  for (const [id, b] of before) {
    const el = tabEls.get(id);
    if (!el || !el.isConnected) continue;
    el.style.transform = '';
    tabOff.delete(id);
    if (el.parentElement.closest('.panel').dataset.panel === b.panel) moved.push([id, el, b.x]);
  }
  if (REDUCED) return;
  for (const [id, el, x] of moved) {
    const dx = x - (el.getBoundingClientRect().left - el.parentElement.getBoundingClientRect().left);
    if (Math.abs(dx) > .5) { tabOff.set(id, {x: dx, to: 0}); el.style.transform = `translateX(${dx}px)`; }
  }
  kick();
}
function measureStrips() {
  const m = new Map();
  for (const id of rects.keys()) {
    const v = views.get(id), p = panelOf(id);
    const slots = p.tabs.map(t => {
      const r = tabEls.get(t).getBoundingClientRect(), left = r.left - (tabOff.get(t)?.x || 0);
      return {id: t, left, w: r.width, mid: left + r.width / 2};
    });
    const wr = v.tabsWrap.getBoundingClientRect();
    const start = slots.length ? slots[0].left : wr.left + 3;
    const end = slots.length ? slots[slots.length - 1].left + slots[slots.length - 1].w : start;
    const top = slots.length ? tabEls.get(p.tabs[0]).getBoundingClientRect().top : wr.top + 3;
    m.set(id, {slots, start, end, top});
  }
  return m;
}
function onTabDown(e, tabId, pid) {
  finishSettle(); closeMenu(); hideTip(); hideCard();
  const p = panelOf(pid);
  p.active = tabId; focused = pid;
  render();
  drag = {tabId, src: pid, el: tabEls.get(tabId), sx: e.clientX, sy: e.clientY, started: false, hist: [[e.clientX, e.clientY, e.timeStamp]]};
  e.preventDefault();
}
function startDrag() {
  const d = drag;
  d.started = true;
  d.origin = panelsEl.getBoundingClientRect();
  const r = d.el.getBoundingClientRect();
  d.w = r.width; d.gx = d.sx - r.left; d.gy = d.sy - r.top;
  d.tx = r.left; d.ty = r.top; d.key = 'strip:' + d.src;
  d.cx = new Spring(0, .16); d.cy = new Spring(0, .16);
  d.strips = measureStrips();
  d.srcIndex = panelOf(d.src).tabs.indexOf(d.tabId);
  const g = d.el.cloneNode(true);
  g.classList.add('ghost', 'sel');
  g.style.width = r.width + 'px';
  g.style.transform = `translate(${r.left}px,${r.top}px)`;
  document.body.appendChild(g);
  d.ghost = g;
  requestAnimationFrame(() => g.classList.add('lifted'));
  d.el.classList.add('held');
  win.classList.add('dragging');
  document.documentElement.classList.add('grabbing', 'dragging');
  kick();
}
function zoneFor(pid, px, py) {
  const r = rects.get(pid);
  const fx = (px - r.x) / r.w, fy = (py - r.y - STRIP_H) / (r.h - STRIP_H);
  let side = 'center', best = 1 / 3;
  for (const [k, d] of [['left', fx], ['right', 1 - fx], ['top', fy], ['bottom', 1 - fy]]) if (d < best) { best = d; side = k; }
  if (side !== 'center' && ((side === 'left' || side === 'right') ? r.w < 2 * MIN_W : r.h < 2 * MIN_H)) side = 'center';
  if (pid === drag.src && (side === 'center' || panelOf(pid).tabs.length < 2)) return null;
  return side;
}
function hitTest(cx, cy) {
  const px = cx - drag.origin.left, py = cy - drag.origin.top;
  for (const [id, r] of rects) {
    if (px < r.x || px >= r.x + r.w || py < r.y || py >= r.y + r.h) continue;
    if (py - r.y < STRIP_H) return {kind: 'strip', panel: id};
    const side = zoneFor(id, px, py);
    return side ? {kind: 'zone', panel: id, side} : null;
  }
  return null;
}
function stripIndex(pid, gx) {
  const d = drag, s = d.strips.get(pid);
  if (pid !== d.src) return s.slots.filter(sl => sl.mid < gx + d.w / 2).length;
  const i = d.srcIndex;
  let k = i;
  while (k + 1 < s.slots.length && s.slots[k + 1].mid < gx + d.w) k++;
  if (k === i) while (k - 1 >= 0 && s.slots[k - 1].mid > gx) k--;
  return k;
}
function moveDrag(e) {
  const d = drag;
  let tx = e.clientX - d.gx, ty = e.clientY - d.gy, key = 'free';
  const hit = hitTest(e.clientX, e.clientY);
  if (hit && hit.kind === 'strip') {
    const s = d.strips.get(hit.panel), own = hit.panel === d.src;
    tx = clamp(tx, s.start, Math.max(s.start, own ? s.end - d.w : s.end + GAP));
    ty = s.top;
    key = 'strip:' + hit.panel;
    hit.index = stripIndex(hit.panel, tx);
  }
  if (key !== d.key) { d.cx.x += d.tx - tx; d.cy.x += d.ty - ty; d.key = key; }
  d.tx = tx; d.ty = ty; d.hit = hit;
  const W = d.w + GAP;
  for (const [pid, s] of d.strips) {
    const onThis = hit && hit.kind === 'strip' && hit.panel === pid;
    s.slots.forEach((sl, j) => {
      let to = 0;
      if (pid === d.src) {
        const i = d.srcIndex;
        if (j === i) return;
        if (onThis) to = j > i && j <= hit.index ? -W : j < i && j >= hit.index ? W : 0;
        else if (j > i) to = -W;
      } else if (onThis && j >= hit.index) to = W;
      const o = tabOff.get(sl.id);
      if (o) o.to = to; else if (to) tabOff.set(sl.id, {x: 0, to});
    });
    const ex = pid === d.src ? (onThis ? 0 : -W) : (onThis ? W : 0);
    const o = extra.get(pid);
    if (o) o.to = ex; else if (ex) extra.set(pid, {x: 0, to: ex});
  }
  showPreview(hit);
  kick();
}
function velocity(hist) {
  const lastS = hist[hist.length - 1];
  if (performance.now() - lastS[2] > 60) return {x: 0, y: 0};
  let first = lastS;
  for (let i = hist.length - 1; i >= 0 && lastS[2] - hist[i][2] <= 100; i--) first = hist[i];
  const dt = (lastS[2] - first[2]) / 1000;
  if (dt < .008) return {x: 0, y: 0};
  return {x: clamp((lastS[0] - first[0]) / dt, -4000, 4000), y: clamp((lastS[1] - first[1]) / dt, -4000, 4000)};
}
function moveTab(tabId, from, to, index) {
  const fp = panelOf(from), tp = panelOf(to);
  const i = fp.tabs.indexOf(tabId);
  fp.tabs.splice(i, 1);
  tp.tabs.splice(index, 0, tabId);
  if (from !== to && fp.active === tabId) fp.active = fp.tabs[Math.min(i, fp.tabs.length - 1)] ?? null;
  tp.active = tabId; focused = to;
  if (!fp.tabs.length && from !== to) removePanel(from);
}
function splitWith(tabId, from, target, side) {
  const fp = panelOf(from);
  const i = fp.tabs.indexOf(tabId);
  fp.tabs.splice(i, 1);
  if (fp.active === tabId) fp.active = fp.tabs[Math.min(i, fp.tabs.length - 1)] ?? null;
  const np = {t: 'panel', id: uid('p'), tabs: [tabId], active: tabId};
  insertSplit(target, side, np);
  if (!fp.tabs.length) removePanel(from);
  focused = np.id;
  const z = previewNow();
  return {id: np.id, rect: {x: z.x, y: z.y - STRIP_H, w: z.w, h: z.h + STRIP_H}};
}
function endDrag() {
  const d = drag;
  drag = null;
  if (!d.started) return;
  win.classList.remove('dragging');
  document.documentElement.classList.remove('grabbing', 'dragging');
  const vel = velocity(d.hist), hit = d.hit;
  const before = recordTabs();
  before.delete(d.tabId);
  const drawn = {x: d.tx + d.cx.x, y: d.ty + d.cy.x};
  let grow = null;
  if (hit && hit.kind === 'strip') moveTab(d.tabId, d.src, hit.panel, hit.index);
  else if (hit && hit.kind === 'zone') {
    if (hit.side === 'center') moveTab(d.tabId, d.src, hit.panel, panelOf(hit.panel).tabs.length);
    else grow = splitWith(d.tabId, d.src, hit.panel, hit.side);
  }
  for (const [pid, o] of extra) { o.x = o.to = 0; const v = views.get(pid); if (v) v.tabsEl.style.marginRight = ''; }
  extra.clear();
  hidePreview();
  render({grow});
  const dest = views.get(focused);
  if (dest) scrollToTab(dest, d.tabId);
  flip(before);
  d.ghost.classList.remove('lifted');
  d.ghost.classList.add('landing');
  settle = {ghost: d.ghost, tabId: d.tabId, sx: new Spring(drawn.x, .3), sy: new Spring(drawn.y, .3)};
  settle.sx.v = vel.x; settle.sy.v = vel.y;
  if (REDUCED) finishSettle(); else kick();
}
function finishSettle() {
  if (!settle) return;
  settle.ghost.remove();
  tabEls.get(settle.tabId)?.classList.remove('held');
  settle = null;
  for (const v of views.values()) if (!v.closing) updateFade(v);
}

/* ---------- input ---------- */
panelsEl.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const pe = e.target.closest('.panel');
  if (!pe || pe.classList.contains('closing')) return;
  const id = pe.dataset.panel;
  if (e.target.closest('.x')) return;
  const t = e.target.closest('.tab');
  if (t) { onTabDown(e, t.dataset.tab, id); return; }
  if (focused !== id) { focused = id; render(); }
  if (isDragArea(e.target)) startWinMove(e);
});
panelsEl.addEventListener('click', e => {
  const pe = e.target.closest('.panel');
  if (!pe) return;
  const id = pe.dataset.panel;
  const x = e.target.closest('.x');
  if (x) { closeTab(x.closest('.tab').dataset.tab); return; }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.classList.contains('plus')) openMenu(b, plusItems(id), {header: '<div class="mhead">New tab in <span class="mono">fix/restore-handoff</span></div>'});
  else if (b.classList.contains('more')) openMenu(b, moreItems(id), {width: 200, align: 'right'});
  else if (b.classList.contains('split-r')) splitWithShell(id, 'right');
  else if (b.classList.contains('split-d')) splitWithShell(id, 'bottom');
  else if (b.classList.contains('diff')) openChanges();
  else if (b.classList.contains('toggle')) setLayout('sidebars');
});
panelsEl.addEventListener('pointerover', e => { const r = e.target.closest('.ring'); if (r && !drag) showCard(r); });
panelsEl.addEventListener('pointerout', e => { const r = e.target.closest('.ring'); if (r && !r.contains(e.relatedTarget)) hideCard(); });
divLayer.addEventListener('pointerdown', e => {
  const t = e.target.closest('.divider');
  if (!t || e.button !== 0) return;
  e.preventDefault();
  const d = dividers[+t.dataset.i];
  op = {kind: 'resize', node: d.node, i: d.i, dir: d.dir, s0: d.dir === 'h' ? e.clientX : e.clientY, a0: d.node.sizes[d.i], b0: d.node.sizes[d.i + 1], total: d.total};
  t.classList.add('active');
  document.documentElement.classList.add(d.dir === 'h' ? 'resizing-h' : 'resizing-v');
});
divLayer.addEventListener('dblclick', e => {
  const t = e.target.closest('.divider');
  if (!t) return;
  const n = dividers[+t.dataset.i].node;
  n.sizes = n.sizes.map(() => 1 / n.sizes.length);
  render();
});
document.querySelectorAll('.seam').forEach(s => {
  s.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    op = {kind: 'col', k: s.dataset.col, x0: e.clientX, w0: S[s.dataset.col], el: s};
    s.classList.add('active');
    document.documentElement.classList.add('resizing-h');
  });
  s.addEventListener('dblclick', () => { S[s.dataset.col] = COLS[s.dataset.col][2]; applyCols(); render({snap: true}); });
});
function startWinMove(e) { op = {kind: 'win', x0: e.clientX, y0: e.clientY, wx: winS.x.x, wy: winS.y.x}; hideTip(); }
win.addEventListener('pointerdown', e => {
  if (e.button === 0 && !e.target.closest('#panels') && isDragArea(e.target)) startWinMove(e);
});
document.addEventListener('dblclick', e => {
  if (!isDragArea(e.target)) return;
  S.zoom = !S.zoom;
  setWin(false);
});
document.addEventListener('pointerdown', e => {
  hideTip();
  if (menu && !menu.el.contains(e.target) && !menu.anchor.contains(e.target)) closeMenu();
}, true);
addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
addEventListener('pointermove', e => {
  if (drag) {
    drag.hist.push([e.clientX, e.clientY, e.timeStamp]);
    if (drag.hist.length > 10) drag.hist.shift();
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      startDrag();
    }
    moveDrag(e);
    return;
  }
  if (op) {
    if (op.kind === 'resize') {
      const kids = op.node.kids, horiz = op.dir === 'h';
      const delta = (horiz ? e.clientX : e.clientY) - op.s0;
      const pair = (op.a0 + op.b0) * op.total;
      const minA = minSize(kids[op.i], horiz), minB = minSize(kids[op.i + 1], horiz);
      const a = clamp(op.a0 * op.total + delta, minA, Math.max(minA, pair - minB));
      op.node.sizes[op.i] = a / op.total;
      op.node.sizes[op.i + 1] = (pair - a) / op.total;
      render({snap: true});
    } else if (op.kind === 'col') {
      const [lo, hi] = COLS[op.k];
      S[op.k] = clamp(op.w0 + e.clientX - op.x0, lo, hi);
      applyCols();
      render({snap: true});
    } else if (op.kind === 'win') {
      const dx = e.clientX - op.x0, dy = e.clientY - op.y0;
      if (!op.moved && Math.hypot(dx, dy) < 3) return;
      op.moved = true;
      document.documentElement.classList.add('grabbing');
      winS.x.set(op.wx + dx, true); winS.y.set(op.wy + dy, true);
      applyWin();
    }
    return;
  }
  tipMove(e);
});
function endOp() {
  if (drag) { endDrag(); return; }
  if (!op) return;
  if (op.el) op.el.classList.remove('active');
  const wasResize = op.kind === 'resize';
  op = null;
  document.documentElement.classList.remove('grabbing', 'resizing-h', 'resizing-v');
  if (wasResize) render({snap: true});
}
addEventListener('pointerup', endOp);
addEventListener('pointercancel', endOp);
addEventListener('blur', endOp);
addEventListener('resize', () => setWin(true));

$('#sessions').addEventListener('click', e => {
  const s = e.target.closest('.seg');
  if (s) { S.seg = s.dataset.seg; updateChrome(); return; }
  const f = e.target.closest('.frow');
  if (f) { openFile(f.dataset.file); return; }
  const c = e.target.closest('.card');
  if (c) { const id = Object.keys(tabs).find(k => tabs[k].provider === c.dataset.agent && !tabs[k].fresh); if (id) reveal(id); }
});
$('#rail').addEventListener('click', e => { if (e.target.closest('.rtog')) setLayout('focus'); });
$('#hud').addEventListener('click', e => {
  const b = e.target.closest('.hseg button');
  if (!b) return;
  const k = b.parentElement.dataset.k, v = b.dataset.v;
  if (k === 'preset') applyPreset(+v);
  else if (k === 'layout') setLayout(v);
  else { S.variant = v; S.toastDismissed = false; render(); }
  syncHud();
});
$('#err').addEventListener('change', e => { S.error = e.target.checked; S.toastDismissed = false; render(); });

if (!REDUCED) {
  const SPIN = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
  let si = 0;
  setInterval(() => { si = (si + 1) % SPIN.length; document.querySelectorAll('.cl-spin').forEach(e => { e.textContent = SPIN[si]; }); }, 120);
}
let secs = 34;
setInterval(() => { secs++; document.querySelectorAll('.cl-sec').forEach(e => { e.textContent = secs; }); }, 1000);

renderProjects();
renderRail();
applyCols();
updateChrome();
setWin(true);
applyPreset(1);
</script>
</body>
