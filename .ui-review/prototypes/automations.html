<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket · Automations prototype</title>
<style>
:root{
  --text:#111113;--text-body:#3f3f46;--text-2:#6f6f78;--text-3:#8b8b94;--text-4:#a1a1aa;--text-5:#b4b4bc;--text-6:#d4d4d8;
  --window:#f4f4f5;--surface:#fff;--sunken:#fafafa;--page:#f7f7f7;--side:#f8f8f9;--pane:#fff;
  --glass:rgba(255,255,255,.72);--highlight:rgba(255,255,255,.95);
  --fill-1:rgba(17,17,19,.031);--fill-2:rgba(17,17,19,.043);--fill-3:rgba(17,17,19,.055);--fill-4:rgba(17,17,19,.067);
  --hairline:rgba(17,17,19,.071);--sep:rgba(17,17,19,.09);--sep-strong:rgba(17,17,19,.122);
  --accent:#5b5bd6;--accent-text:#5b5bd6;--accent-bg:rgba(91,91,214,.11);--accent-ring:rgba(91,91,214,.2);--on-accent:#fff;
  --waiting:#ad5700;--waiting-text:#ad5700;--waiting-bg:rgba(255,178,36,.16);--on-waiting:#fff;
  --failed:#cd2b31;--failed-text:#cd2b31;--failed-bg:rgba(229,72,77,.09);
  --success:#2b9a66;--success-text:#18794e;
  --claude:#d97757;--codex:#0f9d8a;
  --row-shadow:0 1px 2px rgba(17,17,19,.06),0 0 0 .5px rgba(17,17,19,.06);
  --pop-shadow:0 0 0 .5px rgba(17,17,19,.12),0 12px 32px rgba(17,17,19,.14),0 2px 6px rgba(17,17,19,.06);
  --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --desk:radial-gradient(1100px 700px at 12% 0%,#d9dfe9 0%,transparent 60%),radial-gradient(900px 600px at 92% 100%,#e0d9e6 0%,transparent 60%),#c8cdd7;
  --win-bg:var(--window);--win-blur:none;
}
[data-theme=dark]{
  --text:#ebebeb;--text-body:#bcbcbc;--text-2:#a1a1a1;--text-3:#818181;--text-4:#6c6c6c;--text-5:#616161;--text-6:#414141;
  --window:rgba(23,23,23,.85);--surface:rgba(235,235,235,.10);--sunken:transparent;--page:transparent;--side:transparent;--pane:rgba(235,235,235,.045);
  --glass:rgba(42,42,42,.8);--highlight:rgba(255,255,255,.06);
  --fill-1:rgba(235,235,235,.05);--fill-2:rgba(235,235,235,.08);--fill-3:rgba(235,235,235,.10);--fill-4:rgba(235,235,235,.12);
  --hairline:rgba(235,235,235,.07);--sep:rgba(235,235,235,.08);--sep-strong:rgba(235,235,235,.14);
  --accent-text:#a5a5f5;--accent-bg:rgba(91,91,214,.22);--accent-ring:rgba(91,91,214,.4);
  --waiting:#ffb224;--waiting-text:#ffca16;--waiting-bg:rgba(255,178,36,.14);--on-waiting:#171717;
  --failed:#e5484d;--failed-text:#ff9592;--failed-bg:rgba(229,72,77,.14);
  --success:#30a46c;--success-text:#3dd68c;
  --row-shadow:0 0 0 .5px rgba(235,235,235,.14);
  --pop-shadow:0 0 0 .5px rgba(235,235,235,.14),0 12px 32px rgba(0,0,0,.5);
  --desk:radial-gradient(1000px 700px at 15% 0%,#2b3350 0%,transparent 60%),radial-gradient(900px 600px at 90% 100%,#3a2b4d 0%,transparent 60%),#12141c;
  --win-bg:var(--window);--win-blur:blur(40px) saturate(1.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--text);background:var(--desk)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default}
svg{display:block;flex:none}
b{font-weight:600}
code{font:12px var(--mono);background:var(--fill-3);padding:1px 5px;border-radius:5px}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#win{position:absolute;inset:28px 28px 84px;display:flex;border-radius:10px;overflow:hidden;background:var(--win-bg);
  -webkit-backdrop-filter:var(--win-blur);backdrop-filter:var(--win-blur);
  box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 24px 70px rgba(0,0,0,.24),0 6px 18px rgba(0,0,0,.1);user-select:none;-webkit-user-select:none}
.lights{position:absolute;left:14px;top:15px;display:flex;gap:8px;z-index:60}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* sidebar */
#side{width:240px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:.5px solid var(--sep);padding-top:44px}
.nav{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text-body)}
.nav a svg{color:var(--text-3)}
.nav a:hover{background:var(--fill-2)}
.nav a.sel{background:var(--fill-4);color:var(--text);font-weight:600}
.nav a.sel svg{color:var(--text)}
.nav kbd{margin-left:auto;font:500 11px var(--sans);color:var(--text-4)}
.badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--waiting);color:var(--on-waiting);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge:empty{display:none}
.sgroup{margin:18px 18px 6px;font-size:12px;font-weight:600;color:var(--text-3);display:flex;align-items:center}
.sgroup svg{margin-left:auto}
.proj{display:flex;align-items:center;gap:9px;height:28px;margin:0 10px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text-body)}
.proj i{width:9px;height:9px;border-radius:3px;flex:none}
.proj .n{margin-left:auto;font-size:11px;color:var(--text-3);display:flex;gap:4px;align-items:center}
.sfoot{margin-top:auto;padding:12px 20px;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text-2)}

/* main */
#stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--sunken)}
.mhead{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 24px 0;border-bottom:.5px solid var(--sep);gap:16px}
.mhead h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.mhead .sub{margin:2px 0 0;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mhead .sub b{color:var(--text-2)}
.live{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(48,164,108,.2)}
.mright{display:flex;align-items:center;gap:10px}
.btn{height:28px;padding:0 11px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:transform 100ms ease-out,background 120ms ease-out}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 1px 2px rgba(17,17,19,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--fill-2);color:var(--text)}
.btn.ghost:hover{background:var(--fill-4)}
.btn.sm{height:24px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.warn{background:var(--waiting);color:var(--on-waiting)}
.seg{display:flex;padding:2px;border-radius:8px;background:var(--fill-3)}
.seg button{height:24px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--row-shadow);font-weight:600}
.sw{width:30px;height:18px;border-radius:9px;background:var(--fill-4);position:relative;flex:none;transition:background 150ms ease-out}
.sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform 180ms cubic-bezier(.23,1,.32,1)}
.sw[aria-checked=true]{background:var(--success)}
.sw[aria-checked=true] i{transform:translateX(12px)}
.scroll{flex:1;min-height:0;overflow:auto}

/* status */
.stt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.stt.waiting{color:var(--waiting-text)}.stt.running{color:var(--accent-text)}.stt.succeeded{color:var(--success-text)}
.stt.failed{color:var(--failed-text)}.stt.skipped,.stt.cancelled{color:var(--text-3)}
.when{font-size:12px;color:var(--text-3);font-weight:400}
.dots{display:inline-flex;gap:3px;align-items:center}
.enter{animation:rise 240ms cubic-bezier(.23,1,.32,1) both;animation-delay:calc(var(--i,0)*22ms)}
.noanim .enter{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.drawer-in{animation:drawer 220ms cubic-bezier(.23,1,.32,1) both}
@keyframes drawer{from{opacity:0;transform:translateX(14px)}}

/* shared: composer, stats, tabs, needs-you */
.composer{margin:16px 24px 0;border-radius:12px;background:var(--pane);box-shadow:var(--row-shadow);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;transition:box-shadow 120ms ease-out}
.composer:focus-within{box-shadow:0 0 0 2px var(--accent-ring),var(--row-shadow)}
.composer svg{color:var(--text-3)}
.composer input{flex:1;min-width:0;height:34px;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--text);user-select:text;-webkit-user-select:text}
.composer input::placeholder{color:var(--text-4)}
.composer .go{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;transition:transform 100ms ease-out}
.composer .go svg{color:inherit}
.composer .go:active{transform:scale(.94)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 24px 0}
.stat{padding:10px 13px;border-radius:10px;background:var(--pane);box-shadow:var(--row-shadow);text-align:left;width:100%}
button.stat{transition:background 120ms ease-out,transform 100ms ease-out}
button.stat:hover{background:var(--fill-2)}
button.stat:active{transform:scale(.98)}
.stat .k{font-size:12px;color:var(--text-3)}
.stat .v{margin-top:2px;font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.stat .v small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--text-3)}
.stat.warn .v{color:var(--waiting-text)}.stat.bad .v{color:var(--failed-text)}
.lbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 8px}
.lbar .t{font-size:12px;font-weight:600;color:var(--text-3)}
.need{margin:14px 24px 0;max-width:640px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:12px;background:var(--pane);box-shadow:var(--row-shadow)}
.need .ic{flex:none;width:32px;height:32px;border-radius:9px;background:var(--waiting-bg);display:flex;align-items:center;justify-content:center}
.need .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.need b{font-size:13px;font-weight:650}
.need .sp{font-size:12.5px;line-height:1.4;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{flex:none;display:flex;gap:20px;padding:0 24px;border-bottom:.5px solid var(--sep)}
.tabs button{position:relative;height:38px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--text-3)}
.tabs button:hover{color:var(--text-2)}
.tabs button.on{color:var(--text);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-.5px;height:2px;border-radius:2px;background:var(--text)}
.tabs .badge{margin-left:0}

/* v1 ledger */
.split{flex:1;min-height:0;display:flex}
.lpane{flex:1;min-width:0;display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 190px 100px 50px;align-items:center;column-gap:12px}
.thead{height:32px;flex:none;padding:0 24px;font-size:11.5px;font-weight:600;color:var(--text-3);border-bottom:.5px solid var(--sep)}
.lrow{min-height:62px;padding:8px 24px;border-bottom:.5px solid var(--hairline)}
.lrow:hover{background:var(--fill-1)}
.lrow.sel{background:var(--fill-3)}
.lrow.off .lname,.lrow.off .llast{opacity:.55}
.lname .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname .m{margin-top:3px;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.lname .m svg{color:var(--text-4)}
.llast{display:flex;flex-direction:column;gap:2px}
.lnext{font-size:12.5px;color:var(--text-2)}
.paused{font-size:11.5px;font-weight:600;color:var(--text-3);background:var(--fill-3);padding:2px 7px;border-radius:6px}
.lsw{display:flex;justify-content:flex-end}
.drawer{width:372px;flex:none;border-left:.5px solid var(--sep);background:var(--pane);display:flex;flex-direction:column;min-height:0}
.dhead{padding:18px 20px 14px;border-bottom:.5px solid var(--sep)}
.dhead .t{display:flex;align-items:flex-start;gap:8px}
.dhead h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25;flex:1}
.x{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.x:hover{background:var(--fill-3);color:var(--text)}
.sent{margin:0;font-size:13.5px;line-height:1.75;color:var(--text-body)}
.dhead .sent{margin-top:8px}
.tok{padding:1px 6px;margin:0 1px;border-radius:6px;background:var(--fill-3);font-weight:550;color:var(--text);white-space:nowrap}
.dact{display:flex;gap:8px;margin-top:14px}
.dl{padding:12px 20px;border-bottom:.5px solid var(--sep);display:grid;grid-template-columns:92px 1fr;row-gap:8px;font-size:12.5px}
.dl dt{color:var(--text-3)}.dl dd{margin:0;color:var(--text)}
.hhead{padding:14px 20px 6px;font-size:12px;font-weight:600;color:var(--text-3);display:flex;align-items:center;gap:10px}
.hitem{padding:9px 20px;display:grid;grid-template-columns:18px 1fr auto;column-gap:10px;align-items:start}
.hitem:hover{background:var(--fill-1)}
.hitem .r{font-size:13px;font-weight:500}
.hitem .s{grid-column:2/4;font-size:12px;color:var(--text-2);line-height:1.45;margin-top:2px}
.hitem .w{font-size:12px;color:var(--text-3);white-space:nowrap}

/* v2 timeline */
.chips{flex:none;display:flex;gap:6px;padding:12px 24px;overflow:auto;border-bottom:.5px solid var(--sep)}
.chip{height:28px;padding:0 11px;border-radius:14px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-2);background:var(--fill-2);white-space:nowrap}
.chip:hover{background:var(--fill-4)}
.chip.on{background:var(--text);color:var(--surface)}
[data-theme=dark] .chip.on{background:var(--text);color:#171717}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--success)}
.chip.off i{background:var(--text-5)}
.chip.off{color:var(--text-3)}
.upnext{padding:16px 24px 6px}
.sechead{display:flex;align-items:center;gap:8px;padding:16px 24px 6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.sechead .c{font-weight:500;letter-spacing:0;color:var(--text-4)}
.sechead.warn{color:var(--waiting-text)}
.ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ucard{padding:11px 13px;border-radius:10px;background:var(--pane);box-shadow:var(--row-shadow);display:flex;flex-direction:column;gap:4px}
.ucard .n{font-size:13px;font-weight:600}
.ucard .m{font-size:12px;color:var(--text-3);display:flex;gap:6px;align-items:center}
.trow{display:grid;grid-template-columns:20px minmax(0,1fr) 130px 170px 92px;column-gap:12px;align-items:start;padding:11px 24px;border-bottom:.5px solid var(--hairline)}
.trow:hover{background:var(--fill-1)}
.tg{padding-top:2px}
.t1{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.t1 b{font-weight:650}
.t1 .why{color:var(--text-3);font-size:12.5px}
.t2{margin-top:3px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.tmeta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);padding-top:2px}
.twhen{font-size:12px;color:var(--text-3);padding-top:3px;text-align:right}
.tact{display:flex;justify-content:flex-end}
.tact .btn{opacity:0;transition:opacity 120ms ease-out}
.trow:hover .tact .btn,.trow.waiting .tact .btn{opacity:1}

/* v3 sentences */
.tpl{padding:16px 24px 4px}
.tpl .lbl{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px}
.tplrow{display:flex;gap:8px;flex-wrap:wrap}
.tplchip{height:30px;padding:0 12px 0 10px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;background:var(--pane);box-shadow:var(--row-shadow);color:var(--text-body);transition:transform 100ms ease-out}
.tplchip svg{color:var(--text-3)}
.tplchip:hover{background:var(--fill-2)}
.tplchip:active{transform:scale(.97)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px 24px 28px}
.card{border-radius:14px;background:var(--pane);box-shadow:var(--row-shadow);padding:16px 18px 12px;display:flex;flex-direction:column;gap:12px}
.card.off .sent,.card.off .ch .pj,.card.off .ch .ag{opacity:.5}
.ch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.pj,.ag{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.pj i{width:8px;height:8px;border-radius:3px}
.card .sent{font-size:14.5px;line-height:1.85;color:var(--text-body);min-height:78px}
.cf{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:.5px solid var(--hairline)}
.cf .l{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.cf .last{font-size:12px;color:var(--text-3);display:flex;gap:6px;align-items:center;white-space:nowrap}
.chist{margin:0 -6px;border-top:.5px solid var(--hairline);padding-top:4px}
.chist .hitem{padding:7px 6px}

/* new automation page (monocode layout) */
.nhead{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:30px 24px 14px;border-bottom:.5px solid var(--sep)}
.nhead .l{min-width:0;flex:1;display:flex;flex-direction:column;gap:12px}
.ntitle{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--text);padding:0;user-select:text;-webkit-user-select:text}
.ntitle::placeholder{color:var(--text-4)}
.nmeta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-2)}
.nmeta .bar{width:.5px;height:14px;background:var(--sep-strong)}
.sw.acc[aria-checked=true]{background:var(--accent)}
.cta{display:flex;align-items:center;gap:10px;flex:none}
.cta .hint{font-size:12px;color:var(--text-3);white-space:nowrap;margin-right:4px}
.btn.line{background:transparent;color:var(--text);box-shadow:0 0 0 .5px var(--sep-strong)}
.btn.line:hover{background:var(--fill-2)}
.btn.lg{height:32px;padding:0 14px;font-size:13px;border-radius:9px}
.btn[disabled]{pointer-events:none}
.btn.primary[disabled]{background:var(--fill-4);color:var(--text-3);box-shadow:none}
.nbody{padding:8px 24px 40px;display:flex;flex-direction:column}
.nsec{margin-top:26px}
.nsec>.sl{font-size:13px;font-weight:600;color:var(--text-3);margin:0 0 10px 6px}
.ncard{position:relative;border-radius:12px;background:var(--pane);box-shadow:0 0 0 .5px var(--sep-strong),var(--row-shadow)}
.nhelp{margin:10px 0 0 6px;font-size:12.5px;color:var(--text-3)}
.addt{width:100%;height:48px;padding:0 16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--text-2);border-radius:12px;text-align:left}
.addt:hover{background:var(--fill-1);color:var(--text)}
.trg{padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px}
.trg .th{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.trg .th svg{color:var(--text-3)}

.dw{position:relative;display:inline-flex}

.ddb:hover{background:var(--fill-4)}
.ddb:active{transform:scale(.97)}
.ddb .dim{font-weight:450;color:var(--text-3)}
.ddb>svg:last-child{color:var(--text-3)}
.ddb.ghost{background:transparent;padding:0 6px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.ddb.ghost:hover{background:var(--fill-3)}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:210px;padding:5px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--pop-shadow);transform-origin:top left;animation:pop 140ms cubic-bezier(.23,1,.32,1) both}
.menu.r{left:auto;right:0;transform-origin:top right}
.menu.up{top:auto;bottom:calc(100% + 6px);transform-origin:bottom left}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.mi{width:100%;height:30px;padding:0 9px;border-radius:7px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:var(--text);text-align:left;white-space:nowrap}
.mi:hover{background:var(--fill-3)}
.mi .ck{margin-left:auto;color:var(--text)}
.mi .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-3)}
.mi.dis{color:var(--text-4);pointer-events:none}
.mi svg{color:var(--text-3)}
.mh{padding:7px 9px 3px;font-size:11.5px;font-weight:600;color:var(--text-3)}
.msep{height:.5px;margin:5px 4px;background:var(--sep)}
.srow{padding:14px 18px;display:flex;align-items:center;gap:16px}
.srow+.srow,.srow+.advb{border-top:.5px solid var(--hairline)}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;font-size:14px;font-weight:550}
.srow .tx span{display:block;margin-top:2px;font-size:12.5px;color:var(--text-3)}
.advh{width:100%;padding:14px 18px;display:flex;align-items:center;gap:16px;text-align:left}
.advh .tx{flex:1}.advh .tx b{display:block;font-size:14px;font-weight:600}.advh .tx span{display:block;margin-top:2px;font-size:12.5px;color:var(--text-3)}

.advb{border-top:.5px solid var(--hairline)}
.days{display:flex;gap:6px}
.day{width:34px;height:34px;border-radius:50%;font-size:12.5px;font-weight:600;background:var(--fill-2);color:var(--text-2);transition:transform 100ms ease-out,background 120ms ease-out}

.day:active{transform:scale(.94)}
.day[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.frow{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.lbl2{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px}
.fld{border-radius:10px;background:var(--fill-2);transition:box-shadow 120ms ease-out,background 120ms ease-out;width:112px}

.mini:hover{background:var(--fill-4)}
.mini[aria-pressed=true]{background:var(--text);color:var(--surface)}
[data-theme=dark] .mini[aria-pressed=true]{color:#171717}
.ferr{font-size:12px;color:var(--failed-text)}
.ferr:empty{display:none}

/* toast + hud */
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(8px);z-index:80;padding:9px 14px;border-radius:10px;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--pop-shadow);font-size:13px;font-weight:500;

#toast.on{opacity:1;transform:translateX(-50%)}
#hud{position:fixed;top:3px;right:30px;height:22px;display:flex;align-items:center;gap:8px;font:500 11px var(--sans);color:rgba(128,128,128,.9)}

const sameDays = (a, b) => a.length === b.length && b.every(d => a.includes(d));

function daysLabel(ds) {

  if (ds.length === 1) return DNAME[ds[0]] + 's';

function everyLabel(m) {

  if (m % 60 === 0) return m === 60 ? 'Every hour' : `Every ${m / 60} hours`;

}
const whenLabel = t => t.mode === 'days' ? `${daysLabel(t.days)} at ${t.time}` : everyLabel(everyMin(t));

  return `${day === 0 ? 'Today' : day === 1 ? 'Tomorrow' : DNAME[t.getDay()].slice(0, 3)} ${hm}`;
}

}

function newCta(d) {
  const p = problem(d);
  return `${p ? `<span class="hint">${p}</span>` : ''}<button class="btn line lg" data-act="back">Cancel</button><button class="btn primary lg" data-act="create" ${p ? 'disabled' : ''}>Create</button>`;
}
function sessionRow(title, sub, ctl) { return `<div class="srow"><div class="tx"><b>${title}</b><span>${sub}</span></div>${ctl}</div>`; }
function newPage() {
  const d = state.draft, pcol = PROJECTS.find(p => p[0] === d.project)[1];
  const prov = providerOf(d);
  const modelMenu = `<div class="mh">Model</div>${MODELS.map(([k, m]) => mi('model', 'm:' + m, `${m}`, d.model === m, agentIcon(k, 15))).join('')}<div class="msep"></div><div class="mh">Effort</div>${EFFORTS.map(e => mi('model', 'e:' + e, e, d.effort === e, '<span style="width:15px"></span>')).join('')}`;
  return `<header class="nhead"><div class="l"><input class="ntitle" id="f-title" data-f="title" value="${esc(d.title)}" placeholder="Untitled" maxlength="80" aria-label="Name" spellcheck="false">
      <div class="nmeta"><button class="sw acc" role="switch" aria-checked="${d.enabled}" aria-label="Active" data-act="tog-enabled"><i></i></button><span>${d.enabled ? 'Active' : 'Paused'}</span><span class="bar"></span>
        <span class="dw">${ddb('project', `<i style="width:10px;height:10px;border-radius:3px;background:${pcol}"></i>${d.project}`, 'ghost')}${menu('project', PROJECTS.map(([n, c]) => mi('project', n, n, d.project === n, `<i style="width:9px;height:9px;border-radius:3px;background:${c}"></i>`)).join(''))}</span></div></div>
      <div class="cta" id="ncta">${newCta(d)}</div></header>
    <div class="scroll" data-keep><div class="nbody enter">
      <section class="nsec" style="margin-top:20px"><h3 class="sl">Triggers</h3>${triggersCard(d)}</section>
      <section class="nsec"><h3 class="sl">Instructions</h3><div class="ncard ins"><textarea id="f-prompt" data-f="prompt" placeholder="Tell the agent what to do when this automation runs…" aria-label="Instructions" spellcheck="false">${esc(d.prompt)}</textarea>
        <div class="chrow"><span class="dw">${ddb('model', `${agentIcon(prov, 15)}${d.model} <span class="dim">${d.effort}</span>`)}${menu('model', modelMenu, 'up')}</span>
        <span class="dw">${ddb('perm', `${icon('sparkle', 15)}${d.perm}`)}${menu('perm', PERMS.map(([v, s]) => mi('perm', v, `${v}`, d.perm === v)).join(''), 'up')}</span></div></div>
        <p class="nhelp">Skills, @file references, and built-in commands work here.</p></section>
      <section class="nsec"><h3 class="sl">Session</h3><div class="ncard">
        ${sessionRow('Working copy', 'This repo, or a fresh worktree', `<span class="dw">${ddb('copy', label(COPIES, d.copy))}${menu('copy', COPIES.map(([v, l]) => mi('copy', v, l, d.copy === v)).join(''), 'r')}</span>`)}
        ${sessionRow('Conversation', 'New chat, or continue the last run', `<span class="dw">${ddb('convo', label(CONVOS, d.convo))}${menu('convo', CONVOS.map(([v, l]) => mi('convo', v, l, d.convo === v)).join(''), 'r')}</span>`)}
        ${sessionRow('Session folder', 'Where runs appear in the sidebar', `<span class="dw">${ddb('folder', d.folder)}${menu('folder', FOLDERS.map(f => mi('folder', f, f, d.folder === f)).join(''), 'r')}</span>`)}</div></section>
      <section class="nsec"><div class="ncard"><button class="advh" data-act="adv" aria-expanded="${d.adv}"><span class="tx"><b>Advanced</b><span>Catch-up window for missed runs</span></span>${icon('chevd', 16)}</button>
        ${d.adv ? `<div class="advb">${sessionRow('Catch up if late by', 'Past this, a missed run is skipped', `<span class="dw">${ddb('catch', label(CATCH, d.catchup))}${menu('catch', CATCH.map(([v, l]) => mi('catch', v, l, d.catchup === v)).join(''), 'r')}</span>`)}</div>` : ''}</div></section>
    </div></div>`;
}
function paintNew() {
  const d = state.draft;
  $('#ncta') && ($('#ncta').innerHTML = newCta(d));
  $('#nerr') && ($('#nerr').textContent = scheduleError(d.trigger));
  $('#tlabel') && d.trigger && ($('#tlabel').innerHTML = triggerLabel(d.trigger));
}
function openNew(patch) {
  if (patch) state.draft = { ...blankDraft(), ...patch };
  state.view = 'new'; state.dd = null; mount(current);
  setTimeout(() => $('#f-title')?.focus(), 80);
}
function leaveNew() { state.view = null; state.dd = null; mount(current); }
function createAutomation() {
  const d = state.draft; if (problem(d)) return;
  const name = autoName(d), when = whenLabel(d.trigger), nx = nextRun(d.trigger);
  const a = { id: 'n-' + (++seq), name, tIcon: 'clock', trig: when, trigFull: when, scope: d.project, project: d.project, pc: PROJECTS.find(p => p[0] === d.project)[1], agent: providerOf(d), ws: d.copy === 'worktree' ? 'New worktree per run' : 'Project folder', enabled: d.enabled,
    next: d.enabled && nx ? nx : '—', grace: d.catchup === '0' ? 'Skip if late' : `Run if under ${label(CATCH, d.catchup).replace(/ minutes| hours?/, m => m.trim()[0] === 'm' ? 'm' : 'h').replace(' ', '')} late`, sentence: draftSentence(d), dots: '' };
  AUTOS.unshift(a);
  state.draft = blankDraft(); state.view = null; state.dd = null; state.tab = 'automations'; state.seg = 'all'; state.sel = a.id; state.fresh = 'drawer';
  mount(current);
  toast(`Created <b>${esc(name)}</b>`);
}
function newAct(act, t) {
  const d = state.draft;
  if (act === 'back') { leaveNew(); return true; }
  if (act === 'create') { createAutomation(); return true; }
  if (act === 'dd') state.dd = state.dd === t.dataset.k ? null : t.dataset.k;
  else if (act === 'pick') {
    const { k, v } = t.dataset; state.dd = null;
    if (k === 'trig') d.trigger = sched();
    else if (k === 'project') d.project = v;
    else if (k === 'model') { if (v[0] === 'm') d.model = v.slice(2); else d.effort = v.slice(2); state.dd = 'model'; }
    else d[{ perm: 'perm', copy: 'copy', convo: 'convo', folder: 'folder', catch: 'catchup' }[k]] = v;
  }
  else if (act === 'tog-enabled') d.enabled = !d.enabled;
  else if (act === 'adv') d.adv = !d.adv;
  else if (act === 'rm-trigger') d.trigger = null;
  else if (act === 'mode') d.trigger.mode = t.dataset.v;
  else if (act === 'day') { const x = +t.dataset.d, ds = d.trigger.days; d.trigger.days = ds.includes(x) ? ds.filter(y => y !== x) : [...ds, x]; }
  else if (act === 'preset') d.trigger.days = t.dataset.v.split(',').map(Number);
  else if (act === 'every') d.trigger.every = t.dataset.v;
  else return false;
  rerender(); return true;
}
document.addEventListener('click', e => {
  if (state.view !== 'new' || !state.dd || e.target.closest('.menu,[data-act=dd]')) return;
  state.dd = null; rerender();
});
$('#stage').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f || state.view !== 'new') return;
  if (f === 'time' || f === 'every') state.draft.trigger[f] = e.target.value; else state.draft[f] = e.target.value;
  paintNew();
});
$('#stage').addEventListener('keydown', e => {
  if (state.view !== 'new') return;
  if (e.key === 'Escape') {
    if (state.dd) { state.dd = null; rerender(); }
    else if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.target.blur(); else leaveNew();
  }
  else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); createAutomation(); }
  else if (e.key === 'Enter' && e.target.id === 'f-title') { e.preventDefault(); $('#f-prompt')?.focus(); }
});

/* ---------- interactions ---------- */
let seq = 0, toastT;
function toast(msg) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
function runNow(id) {
  const a = auto(id);
  const r = { id: 'n' + (++seq), a: id, st: 'running', reason: 'Run now', when: 'Just now', dur: '', day: 'now', sum: 'Starting a session in ' + a.ws.toLowerCase() + '…' };
  RUNS.unshift(r); a.dots = a.dots.slice(1) + 'r';
  rerender(); toast(`${glyph('running', 14)}Started <b>${a.name}</b>`);
  setTimeout(() => { r.st = 'succeeded'; r.dur = '2m'; r.when = 'Just now'; r.sum = 'Finished. Nothing needed changing.'; a.dots = a.dots.slice(0, -1) + 's'; rerender(); }, 2600);
}
const compose = v => openNew(v ? { prompt: v } : null);
$('#stage').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.composer input')) compose(e.target.value.trim()); });
$('#stage').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const { act, id } = t.dataset;
  if (state.view === 'new' && newAct(act, t)) return;
  if (act === 'toggle') { e.stopPropagation(); const a = auto(id); a.enabled = !a.enabled; toast(`<b>${a.name}</b> ${a.enabled ? 'resumed' : 'paused'}`); }
  else if (act === 'select') { if (state.sel !== id) state.fresh = 'drawer'; state.sel = id; }
  else if (act === 'close') state.sel = null;
  else if (act === 'seg') state.seg = t.dataset.v;
  else if (act === 'chip') state.chip = id || null;
  else if (act === 'tab') state.tab = t.dataset.v;
  else if (act === 'expand') state.open[id] = !state.open[id];
  else if (act === 'run') return runNow(id);
  else if (act === 'open') { toast(`Opening <b>${auto(id).name}</b>’s session`); return; }
  else if (act === 'new') return openNew();
  else if (act === 'tpl') return openNew(TEMPLATES[t.dataset.n]);
  else if (act === 'edit') { toast('Editing reuses this page, filled in'); return; }
  else if (act === 'compose') { compose($('.composer input').value.trim()); return; }
  rerender();
});

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const u = new URL(location); u.searchParams.set('t', t); history.replaceState(null, '', u);
}
document.querySelectorAll('#themeSeg button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.t)));
setTheme(new URLSearchParams(location.search).get('t') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

function paintChrome() {
  $('#inboxBadge').textContent = RUNS.filter(r => r.st === 'waiting').length || '';
  $('#projects').innerHTML = PROJECTS.map(([n, c]) => `<div class="proj"><i style="background:${c}"></i>${n}</div>`).join('');
}

/* ---------- picker wiring (reference, with a keep-scroll rerender) ---------- */
const variants = [() => state.view === 'new' ? newPage() : tabs(), () => state.view === 'new' ? newPage() : sentences()];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  stage.classList.remove('noanim');
  paintChrome();
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function rerender() {
  const tops = [...stage.querySelectorAll('[data-keep]')].map(n => n.scrollTop);
  stage.classList.add('noanim');
  paintChrome();
  stage.innerHTML = variants[current]();
  stage.querySelectorAll('[data-keep]').forEach((n, i) => { n.scrollTop = tops[i] || 0; });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
  else if (e.key === 'd' || e.key === 'D') setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
