<style>
:root{
  --t:#ebebeb;--tb:#bcbcbc;--t2:#a1a1a1;--t3:#818181;--t4:#6c6c6c;--t5:#616161;
  --win:#171717;--side:#1b1b1b;
  --f1:rgba(235,235,235,.05);--f2:rgba(235,235,235,.08);--f3:rgba(235,235,235,.1);--f4:rgba(235,235,235,.13);
  --hair:rgba(235,235,235,.07);--sep:rgba(235,235,235,.08);--sep2:rgba(235,235,235,.14);
  --add:#3dd68c;--del:#e5484d;--wait:#ffb224;--blue:#4c9df3;--rust:#f0743e;
  --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  /* monocode: --motion-reorder-duration 160ms, --motion-ease-out */
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--t);background:#0b0b0c radial-gradient(1200px 700px at 20% 0%,#23262d,transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default}
svg{display:block;flex:none}
.fi{width:16px;height:14px;flex:none;display:inline-grid;place-items:center;font:700 9px/1 var(--sans);letter-spacing:-.03em}
body.grabbing,body.grabbing *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}

#win{position:fixed;inset:14px;display:flex;border-radius:10px;overflow:hidden;background:var(--win);font-size:13px;
  box-shadow:0 0 0 .5px rgba(255,255,255,.12),0 24px 70px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none}
.lights{position:absolute;left:14px;top:14px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%}
#side{position:relative;width:228px;flex:none;background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:40px 8px 10px}
.search{height:30px;flex:none;border-radius:9px;background:var(--f2);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--t3)}
.search kbd{margin-left:auto;font:12px var(--sans)}
.shead{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--t4);padding:18px 8px 6px;text-transform:uppercase}
.frow{height:28px;flex:none;display:flex;align-items:center;gap:7px;padding:0 8px;border-radius:7px;color:var(--tb);white-space:nowrap}
.frow:hover{background:var(--f2)}
.frow .nm{flex:none}
.frow .dir{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--t4);font-size:11.5px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}

/* title bar: session tabs (TitleBar.tsx) */
.tbar{height:40px;flex:none;display:flex;align-items:center;border-bottom:.5px solid var(--sep);padding:0 6px}
.tstrip{position:relative;flex:1;display:flex;align-items:center;gap:2px;min-width:0;height:100%;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.tstrip::-webkit-scrollbar{display:none}
.st{position:relative;width:224px;min-width:112px;height:30px;flex:0 1 auto;display:flex;align-items:center;gap:7px;padding:0 28px 0 8px;border-radius:6px;color:rgba(235,235,235,.5);transform:translate3d(0,0,0)}
.st:hover{background:rgba(235,235,235,.05);color:var(--t)}
.st.on{background:var(--f3);color:var(--t)}
.st:not(.on) .ti{opacity:.55}
.st .tx{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.2}
.st .hd{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .mt{font-size:11px;color:rgba(235,235,235,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.opening{animation:tabin .22s var(--ease)}
.tplus{width:28px;height:28px;flex:none;margin-left:2px;border-radius:7px;display:grid;place-items:center;color:var(--t3)}
.tplus:hover{background:var(--f3);color:var(--t)}
.tmark{position:absolute;top:7px;bottom:7px;width:2px;margin-left:-1px;border-radius:1px;background:var(--blue);pointer-events:none;z-index:20}

/* pane tree */
.tree{flex:1;min-height:0;display:flex}
.split{flex:1;display:flex;min-width:0;min-height:0}
.split.col{flex-direction:column}
.node{position:relative;display:flex;min-width:0;min-height:0}
.sash{position:relative;flex:none;background:var(--sep);z-index:5}
.split.row>.sash{width:1px}.split.col>.sash{height:1px}
.sash::after{content:"";position:absolute;inset:0}
.split.row>.sash::after{left:-4px;right:-4px;cursor:col-resize}
.split.col>.sash::after{top:-4px;bottom:-4px;cursor:row-resize}
.sash:hover,.sash.active{background:var(--sep2)}
.pane{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;transition:opacity .15s var(--ease)}
.pane.dragging{opacity:.4}
.pin{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.pin[data-enter]{animation:pane-enter .26s var(--ease)}
.pin[data-enter=right]{--ex:100%}.pin[data-enter=left]{--ex:-100%}.pin[data-enter=bottom]{--ey:100%}.pin[data-enter=top]{--ey:-100%}
@keyframes pane-enter{from{transform:translate(var(--ex,0),var(--ey,0))}to{transform:none}}
.hint{position:absolute;inset:0;z-index:40;pointer-events:none}
.hint i,.hint b{position:absolute}
.hint i{background:rgba(76,157,243,.15)}
.hint b{background:var(--blue)}
.hint[data-edge=left] i{inset:0 50% 0 0}.hint[data-edge=left] b{top:0;bottom:0;left:0;width:2px}
.hint[data-edge=right] i{inset:0 0 0 50%}.hint[data-edge=right] b{top:0;bottom:0;right:0;width:2px}
.hint[data-edge=top] i{inset:0 0 50% 0}.hint[data-edge=top] b{left:0;right:0;top:0;height:2px}
.hint[data-edge=bottom] i{inset:50% 0 0 0}.hint[data-edge=bottom] b{left:0;right:0;bottom:0;height:2px}

/* session pane header, only in a split (SessionPane.tsx) */
.sh{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:.5px solid var(--sep);cursor:grab;touch-action:none}
.sh>svg:first-child{color:rgba(235,235,235,.35)}
.sh .fd{width:8px;height:8px;border-radius:50%;flex:none}
.pane.focus .sh .fd{background:var(--blue)}
.sh .ttl{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x1{width:20px;height:20px;flex:none;border-radius:4px;display:grid;place-items:center;color:rgba(235,235,235,.5)}
.x1:hover{background:var(--f3);color:var(--t)}

/* file tabs (SurfaceTabs.tsx) */
.bm{height:36px;flex:none;display:flex;border-bottom:.5px solid var(--sep);min-width:0}
.bm .row{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow-x:auto;overscroll-behavior:none;padding:0 10px 0 6px;scrollbar-width:none}
.bm .row::-webkit-scrollbar{display:none}
.grip{width:20px;height:30px;flex:none;display:grid;place-items:center;border-radius:6px;color:rgba(235,235,235,.35);cursor:grab;touch-action:none}
.grip:hover{background:rgba(235,235,235,.05);color:rgba(235,235,235,.7)}
.tm{position:relative;height:100%;width:224px;min-width:112px;flex:0 1 auto;display:flex;align-items:center;touch-action:none;transform:translate3d(0,0,0)}
.tm.opening{animation:tabin .22s var(--ease)}
@keyframes tabin{from{max-width:0;opacity:0}to{max-width:224px;opacity:1}}
.tm>.tb{height:30px;flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 28px 0 8px;border-radius:6px;font-size:13px;color:rgba(235,235,235,.5);white-space:nowrap}
.tm>.tb:hover{background:rgba(235,235,235,.05);color:var(--t)}
.tm.on>.tb{background:var(--f3);color:var(--t)}
.tm:not(.on) .tb>:first-child{opacity:.55}
.tm .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1}
.tm.pv .nm{font-style:italic}
.tm>.x1,.st>.x1{position:absolute;right:4px;top:50%;margin-top:-10px;opacity:0}
.tm.on>.x1,.tm:hover>.x1,.st:hover>.x1{opacity:1}
[data-reordering] .x1{visibility:hidden}
[data-dragging],[data-settling]{z-index:10}
.fill{min-width:16px;flex:1;align-self:stretch}
.fill[data-pane-drag]{cursor:grab}
.mdfloat{position:absolute;top:8px;right:16px;z-index:20;display:flex;padding:2px;border-radius:6px;background:rgba(235,235,235,.1);box-shadow:inset 0 0 0 1px rgba(235,235,235,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mdfloat button{padding:2px 8px;border-radius:4px;font-size:11px;color:rgba(235,235,235,.45)}
.mdfloat button:hover{color:rgba(235,235,235,.8)}
.mdfloat button.on{background:rgba(235,235,235,.18);color:var(--t)}

/* bodies */
.body{position:relative;flex:1;min-height:0;overflow:auto}
.chat{padding:18px 22px;display:flex;flex-direction:column;gap:12px;font-size:13.5px;line-height:1.55;color:var(--tb)}
.chat p{margin:0}
.ub{align-self:flex-end;max-width:80%;background:var(--f3);color:var(--t);padding:9px 13px;border-radius:14px}
.tool{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t3)}
.tool code{font:12px var(--mono);color:var(--t2);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(235,235,235,.25);text-underline-offset:3px}
.tool code:hover{color:var(--t)}
.empty{margin:auto;color:var(--t3);text-align:center}
.composer{margin:0 14px 14px;height:44px;flex:none;border-radius:12px;background:var(--f2);box-shadow:0 0 0 .5px var(--hair);display:flex;align-items:center;padding:0 14px;color:var(--t4)}
.mdv{padding:30px 40px 80px;max-width:760px;color:var(--tb);font-size:14px;line-height:1.65}
.mdv h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;color:var(--t);margin:0 0 18px;font-weight:700}
.mdv h2{font-size:20px;line-height:1.25;letter-spacing:-.01em;color:var(--t);margin:30px 0 10px;font-weight:650}
.mdv p,.mdv ul{margin:0 0 12px}
.mdv pre{font:12.5px/1.6 var(--mono);background:var(--f1);border-radius:8px;padding:12px 14px;margin:0 0 12px;color:var(--t);white-space:pre-wrap}
.mdv code{font:12.5px var(--mono);background:var(--f2);padding:1px 5px;border-radius:5px;color:var(--t)}
.dia{border-radius:10px;background:var(--f1);box-shadow:0 0 0 .5px var(--hair);padding:16px;margin:6px 0 14px;overflow:hidden}
.dia svg{width:100%;height:auto;font:12px var(--sans)}
.code{font:12.5px/20px var(--mono);padding:10px 0 80px;color:#d4d4d4;white-space:pre}
.code .l{display:flex}.code .no{width:52px;flex:none;text-align:right;padding-right:18px;color:var(--t5)}
.k{color:#f97583}.s{color:#9ecbff}.c{color:#6a737d}.f{color:#b392f0}
@media (prefers-reduced-motion: reduce){.pin[data-enter],.tm.opening,.st.opening{animation:none}.pane{transition:none}}
</style>

/// How quickly a sliding tab closes on where it's going: about 90% of the way in 80ms.
const SLIDE: f32 = 0.035;

/// What a tab drag carries. The held tab draws itself on the strip, so the drag has no preview.
pub(super) struct DragTab;

/// A tab held on the strip and the tabs sliding out of its way.
pub(crate) struct TabDrag {
    pub(super) from: usize,
    /// Where the pointer holds the tab, from its left edge.
    pub(super) grab: f32,
    pub(super) pointer: f32,
    slots: Vec<(f32, f32)>,
    offsets: Vec<f32>,
    last_frame: Option<Instant>,
    released: bool,
    pub(crate) away: bool,
}

impl TabDrag {
    fn new(from: usize, grab: f32, pointer: f32) -> Self {
        Self { from, grab, pointer, slots: Vec::new(), offsets: Vec::new(), last_frame: None, released: false, away: false }
    }

function hl(line, p) {

/* ── pane tree (layout.ts) ── */
const leaves = n => n.type === 'leaf' ? [n.id] : n.children.flatMap(leaves);
function removeLeaf(n, id) {

  n.children.forEach((c, i) => {

    if (kept) { children.push(kept); sizes.push(n.sizes[i]); }

function insertAt(n, target, edge, node) {

  if (n.type === 'leaf') {
    return n.id === target ? {type: 'split', id: uid('x'), dir, children: before ? [node, n] : [n, node], sizes: [.5, .5]} : n;
  }
  const at = n.children.findIndex(c => c.type === 'leaf' && c.id === target);
  if (at >= 0 && n.dir === dir) {
    // A drop beside a sibling of the same direction joins that split and halves the target.
    const children = n.children.slice(), sizes = n.sizes.slice(), half = sizes[at] / 2;
    sizes[at] = half;
    children.splice(before ? at : at + 1, 0, node);
    sizes.splice(before ? at : at + 1, 0, half);

  return {...n, children: n.children.map(c => insertAt(c, target, edge, node))};
}

}
function edgeFromPoint(x, y, r) {

// TitleBar.tsx tabCopy: in a split, the focused file leads and the conversation follows.

function openFile(p, pin) {

/* ── drop targets (paneDrop.ts) ── */
function paneFromPoint(x, y) {

  const mid = el => { const r = el.getBoundingClientRect(); return (r.left + r.right) / 2; };
  const t = tabs.reduce((a, b) => Math.abs(x - mid(b)) < Math.abs(x - mid(a)) ? b : a);
  const r = t.getBoundingClientRect(), after = x >= mid(t);

function showHint(over) { if (hint.parentElement !== over.el) over.el.append(hint); hint.dataset.edge = over.edge; }

function showMark(t) { if (mark.parentElement !== t.strip) t.strip.append(mark); mark.style.left = t.x + 'px'; }
const clearMark = () => mark.remove();

/* ── pane drag (PaneTree.tsx startPaneDrag) ── */
function startPaneDrag(e, from) {
  const sx = e.clientX, sy = e.clientY;
  let active = false, x = sx, y = sy, target = null;
  const src = () => stage.querySelector(`[data-pane-id="${from}"]`);
  const move = ev => {
    x = ev.clientX; y = ev.clientY;
    if (!active) {
      if (Math.hypot(x - sx, y - sy) < DRAG_THRESHOLD) return;
      active = true;
      document.body.classList.add('grabbing');
      src().classList.add('dragging');
    }
    const t = titleDropFromPoint(x, y);
    if (t) { clearHint(); showMark(t); target = {title: t}; return; }
    clearMark();
    const over = paneFromPoint(x, y);
    if (!over || over.id === from) { clearHint(); target = null; return; }
    showHint(over);
    target = {pane: over};
  };
  const finish = commit => {
    removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', cancel);
    removeEventListener('keydown', key);
    document.body.classList.remove('grabbing');
    src()?.classList.remove('dragging');
    clearHint(); clearMark();
    if (!active) return;
    suppressClickUntil = performance.now() + 300;
    if (!commit || !target) return;
    if (target.title) detachPane(from, target.title);
    else movePane(from, target.pane.id, target.pane.edge);
    paint();
  };
  const up = () => finish(true), cancel = () => finish(false);
  const key = ev => { if (ev.key === 'Escape') { ev.preventDefault(); finish(false); } };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', cancel);
  addEventListener('keydown', key);
}

/* ── tab reorder (useAnimatedReorder.ts) ── */
const moveItem = (list, from, to) => { const l = list.slice(); l.splice(to, 0, l.splice(from, 1)[0]); return l; };
function reorder(e, els, from, onCommit, external) {
  if (els.length < 2 && !external) return;
  const order0 = els.map((_, i) => i);
  // Measure once: animated positions must not affect the drop calculation.
  const rects = els.map(el => { const r = el.getBoundingClientRect(); return {start: r.left, size: r.width, end: r.right}; });
  const handle = els[from], start = e.clientX, tr = `transform ${REORDER_MS}ms var(--ease)`;
  let active = false, settling = false, dest = from, pos = start, frame = 0;
  const tx = v => `translate3d(${v}px,0,0)`;
  const preview = to => {
    const order = moveItem(order0, from, to);
    els.forEach((el, i) => { if (i !== from) el.style.transform = tx(rects[order.indexOf(i)].start - rects[i].start); });
  };
  const draw = (moveHandle = true) => {
    frame = 0;
    const off = Math.max(rects[0].start - rects[from].start, Math.min(pos - start, rects.at(-1).end - rects[from].end));
    if (moveHandle) handle.style.transform = tx(off);
    const center = rects[from].start + rects[from].size / 2 + off;
    let next = from, best = Infinity;
    rects.forEach((r, i) => { const d = Math.abs(center - r.start - r.size / 2); if (d < best) { best = d; next = i; } });
    if (next !== dest) { dest = next; preview(next); }
  };
  const reset = () => {
    removeEventListener('pointermove', onMove);
    removeEventListener('pointerup', onUp);
    removeEventListener('pointercancel', onCancel);
    removeEventListener('keydown', onKey);
    els.forEach(el => { el.style.removeProperty('transition'); el.style.removeProperty('transform'); delete el.dataset.reordering; delete el.dataset.settling; });
    delete handle.dataset.dragging;
    document.body.classList.remove('grabbing');
    if (active) suppressClickUntil = performance.now() + 400;
    external?.onEnd?.();
  };
  const stop = (commit, ev) => {
    if (settling) return;
    if (!active) return reset();
    if (commit && ev && external?.onDrop(ev)) return reset();
    settling = true;
    cancelAnimationFrame(frame);
    if (commit) draw(false);
    handle.dataset.settling = '';
    const to = commit ? dest : from;
    preview(to);
    handle.style.transition = tr;
    handle.style.transform = tx(rects[to].start - rects[from].start);
    setTimeout(() => { reset(); if (commit && to !== from) onCommit(moveItem(order0, from, to)); }, REORDER_MS);
  };
  function onMove(ev) {
    if (settling) return;
    pos = ev.clientX;
    if (!active) {
      if (Math.abs(pos - start) < DRAG_THRESHOLD && !(external && Math.abs(ev.clientY - e.clientY) >= DRAG_THRESHOLD)) return;
      active = true;
      document.body.classList.add('grabbing');
      els.forEach(el => { el.style.transition = tr; el.dataset.reordering = ''; });
      handle.style.transition = 'none';
      handle.dataset.dragging = '';
    }
    if (external?.onMove(ev)) { cancelAnimationFrame(frame); frame = 0; dest = from; preview(from); return; }
    if (!frame) frame = requestAnimationFrame(() => draw());
  }
  function onUp(ev) { onMove(ev); stop(true, ev); }
  function onCancel() { stop(false); }
  function onKey(ev) { if (ev.key === 'Escape') { ev.preventDefault(); stop(false); } }
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
  addEventListener('pointercancel', onCancel);
  addEventListener('keydown', onKey);
}
function startTabReorder(e, paneId, i) {
  const els = [...stage.querySelectorAll(`[data-tab="${paneId}"]`)];
  reorder(e, els, i, order => {
    const p = PANES[paneId], active = p.files[p.active];
    p.files = order.map(k => p.files[k]);
    p.active = p.files.indexOf(active);
    paint();
  }, {
    onMove: ev => {
      const t = titleDropFromPoint(ev.clientX, ev.clientY);
      if (t) showMark(t); else clearMark();
      return !!t;
    },
    onDrop: ev => {
      const t = titleDropFromPoint(ev.clientX, ev.clientY);
      clearMark();
      if (!t) return false;
      detachFile(paneId, i, t);
      paint();
      return true;
    },
    onEnd: clearMark,
  });
}
function startTitleReorder(e, sid) {
  const els = [...stage.querySelectorAll('[data-title-tab]')];
  const from = els.findIndex(el => el.dataset.titleTab === sid);
  reorder(e, els, from, order => {
    S.sessions = order.map(k => S.sessions[k]);
    paint();
  }, {
    // Another session's tab dragged over a pane offers to split it there.
    onMove: ev => {
      if (sid === S.cur) return false;
      const over = paneFromPoint(ev.clientX, ev.clientY);
      if (over) showHint(over); else clearHint();
      return !!over;
    },
    onDrop: ev => {
      if (sid === S.cur) return false;
      const over = paneFromPoint(ev.clientX, ev.clientY);
      clearHint();
      if (!over) return false;
      placeSession(sid, over.id, over.edge);
      paint();
      return true;
    },
    onEnd: clearHint,
  });
}
function startSash(e, sash) {
  e.preventDefault();
  const split = findSplit(cur().tree, sash.dataset.sash), i = +sash.dataset.i;
  const box = sash.parentElement, kids = [...box.children].filter(c => c.classList.contains('node'));
  const row = split.dir === 'row', r = box.getBoundingClientRect();
  const total = row ? r.width : r.height, start = row ? e.clientX : e.clientY;
  const a0 = split.sizes[i], b0 = split.sizes[i + 1];
  sash.setPointerCapture(e.pointerId);
  sash.classList.add('active');
  const move = ev => {
    const a = Math.min(Math.max(a0 + ((row ? ev.clientX : ev.clientY) - start) / total, .12), a0 + b0 - .12);
    split.sizes[i] = a; split.sizes[i + 1] = a0 + b0 - a;
    kids[i].style.flex = `${a} 1 0`; kids[i + 1].style.flex = `${a0 + b0 - a} 1 0`;
  };
  sash.addEventListener('pointermove', move);
  sash.addEventListener('pointerup', () => { sash.removeEventListener('pointermove', move); sash.classList.remove('active'); }, {once: true});
}

/* ── input ── */
let lastPress = {key: '', at: 0};
const doublePress = key => { const now = performance.now(), d = lastPress.key === key && now - lastPress.at < 350; lastPress = {key, at: now}; return d; };
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const t = e.target, s = cur();
  const paneEl = t.closest('[data-pane-id]');
  const focusMoved = paneEl && s.focus !== paneEl.dataset.paneId;
  if (focusMoved) s.focus = paneEl.dataset.paneId;
  if (t.closest('[data-no-drag]')) { if (focusMoved) paintFocus(); return; }
  const sash = t.closest('[data-sash]');
  if (sash) return startSash(e, sash);
  const tab = t.closest('[data-tab]');
  if (tab) {
    const id = tab.dataset.tab, i = +tab.dataset.i, p = PANES[id];
    // Double-clicking a preview tab keeps it.
    if (doublePress(id + ':' + p.files[i].path) && p.files[i].preview) delete p.files[i].preview;
    p.active = i;
    paint();
    return startTabReorder(e, id, i);
  }
  const tt = t.closest('[data-title-tab]');
  if (tt) return startTitleReorder(e, tt.dataset.titleTab);
  if (focusMoved) paintFocus();
  const pd = t.closest('[data-pane-drag]');
  if (pd) { e.preventDefault(); startPaneDrag(e, pd.dataset.paneDrag); }
});
stage.addEventListener('click', e => {
  if (performance.now() < suppressClickUntil) return;
  const el = e.target.closest('[data-a],[data-title-tab]');
  if (!el) return;
  const d = el.dataset;
  switch (d.a) {
    case 'closeFile': closeFile(d.id, +d.i); break;
    case 'closePane': dropPane(d.id); break;
    case 'closeSession': closeSession(d.id); break;
    case 'newSession': newSession(); break;
    case 'mode': S.src[d.path] = d.src === '1'; break;
    case 'mention': openFile(d.path, false); break;
    case 'sideFile': openFile(d.path, doublePress('side:' + d.path)); break;
    default: if (d.titleTab) S.cur = d.titleTab;
  }
  paint();
});
stage.addEventListener('auxclick', e => {
  const tab = e.button === 1 && e.target.closest('[data-tab]');
  if (!tab) return;
  closeFile(tab.dataset.tab, +tab.dataset.i);
  paint();
});
paint();
</script>
