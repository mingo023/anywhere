<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session handoff · Anywhere — design prototype</title>
<style>
:root{
  /* Graphite Light (packages/desktop/themes/graphite-light.json) */
  --text:#111113;--text-body:#3f3f46;--text-2:#6f6f78;--text-3:#8b8b94;--text-4:#a1a1aa;--text-5:#b4b4bc;--text-6:#d4d4d8;--on-text:#fff;
  --window:#f4f4f5;--surface:#fff;--page:#f7f7f7;--side:#fafafb;--popover:#fff;--highlight:#fffffff2;--shadow:#00000024;--field:#ffffffd9;
  --fill-1:#11111308;--fill-2:#1111130b;--fill-3:#1111130e;--fill-4:#11111311;--separator:#11111317;--separator-strong:#1111131f;--accent-bg:#1111131c;
  --waiting:#ad5700;--waiting-text:#ad5700;--waiting-dot:#ffb224;--waiting-bg:#ffb2242e;--success:#2b9a66;--success-text:#18794e;--success-bg:#30a46c21;
  --failed:#cd2b31;--failed-text:#cd2b31;--failed-bg:#e5484d1c;--working:#cc4e00;--goal-text:#0b5fb5;--goal-bg:#3e8ef724;--bubble:#f1f1f2;--scrim:#28241e2e;
  --claude:#d97757;
}
:root[data-theme=dark]{
  /* Graphite Dark (graphite-dark.json), over a dark wallpaper since the window is translucent */
  --text:#ebebeb;--text-body:#bcbcbc;--text-2:#a1a1a1;--text-3:#818181;--text-4:#6c6c6c;--text-5:#616161;--text-6:#414141;--on-text:#171717;
  --window:#2b2b2c;--surface:#ebebeb1a;--page:#303031;--side:#2b2b2c;--popover:#232323;--highlight:#ffffff0f;--shadow:#00000059;--field:#ebebeb14;
  --fill-1:#ebebeb0d;--fill-2:#ebebeb14;--fill-3:#ebebeb1a;--fill-4:#ebebeb1f;--separator:#ebebeb14;--separator-strong:#ebebeb24;--accent-bg:#ebebeb33;
  --waiting:#ffb224;--waiting-text:#ffca16;--waiting-dot:#ffb224;--waiting-bg:#ffb2242e;--success:#30a46c;--success-text:#3dd68c;--success-bg:#30a46c21;
  --failed:#e5484d;--failed-text:#ff9592;--failed-bg:#e5484d1c;--working:#f76b15;--goal-text:#70b8ff;--goal-bg:#3e8ef724;--bubble:#2c2c30;--scrim:#0000004d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Geist",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);background:var(--window);font-size:13px;height:100vh;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;text-align:left}
button:focus-visible,.mp:focus-visible,.ar:focus-visible{box-shadow:0 0 0 2px var(--accent-bg)}
svg.i{flex:none;display:block}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
.grow{flex:1;min-width:0}
.app{display:flex;height:100vh}

/* ---------- sidebar (ui::side) ---------- */
.side{width:272px;flex:none;background:var(--side);border-right:.5px solid var(--separator);display:flex;flex-direction:column;padding:0 10px}
.top{height:40px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--text-3)}
.search{height:32px;flex:none;margin:2px 0 8px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:9px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong);color:var(--text-3);font-size:13.5px;cursor:pointer}
.search kbd{margin-left:auto;font:inherit;font-size:11.5px;color:var(--text-4)}
.row{height:28px;flex:none;padding:0 6px;display:flex;align-items:center;gap:8px;border-radius:8px;font-size:13.5px;white-space:nowrap;position:relative}
.row:hover{background:var(--fill-2)}
.row.on{background:var(--fill-4)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.nav{color:var(--text-2)}
.child{padding-left:32px}
.child .lead{position:absolute;left:12px;top:7px;width:14px;display:flex;justify-content:center}
.stat{font-size:12px}.stat .a{color:var(--success-text)}.stat .d{color:var(--failed-text);margin-left:6px}
.space{height:34px;flex:none;margin:8px 0 0;padding:0 6px;display:flex;align-items:center;gap:8px;border-radius:8px}
.space .sw-ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.space b{font-size:14px;font-weight:600}
.space .h{font-size:12px;color:var(--text-3);flex:1;min-width:0}
.sh{height:28px;flex:none;margin:8px 0 2px;padding:0 6px;display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
.sh>span:first-child{flex:1}
.list{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -4px;padding:0 4px 8px}
.tile{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px;font-weight:600;color:var(--text-2);background:var(--surface);box-shadow:inset 0 0 0 .5px var(--separator-strong)}
.dot{width:6px;height:6px;border-radius:3px;flex:none;background:var(--success)}
.dot.off{background:var(--text-5)}.dot.wait{background:var(--waiting-dot)}
.sdot{width:7px;height:7px;border-radius:4px;background:var(--waiting-dot)}
.spin{width:9px;height:9px;flex:none;border-radius:5px;border:1.5px solid var(--working);border-right-color:transparent;animation:sp .8s linear infinite}
.spin.n{border-color:var(--text-3);border-right-color:transparent}
.spin.big{width:12px;height:12px;border-width:1.75px}
@keyframes sp{to{transform:rotate(360deg)}}
.switcher{flex:none;display:flex;align-items:center;gap:2px;padding:6px 8px 10px;border-top:.5px solid var(--separator);margin:0 -10px}
.sw{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-3);position:relative}
.sw:hover{background:var(--fill-2)}
.sw.on{background:var(--fill-4);color:var(--text)}
.sw .dot{position:absolute;right:5px;bottom:6px;box-shadow:0 0 0 1.5px var(--window)}

/* session card (ui::session_row) */
.cards{display:flex;flex-direction:column;gap:2px;padding:0 0 4px}
.card{padding:8px 10px 9px;border-radius:10px;display:flex;flex-direction:column;gap:4px;position:relative;cursor:pointer}
.card:hover{background:var(--fill-2)}
.card.on{background:var(--fill-4)}
.card .ln{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.card .ln .when{margin-left:auto;color:var(--text-3)}
.card .tt{font-size:13.5px;font-weight:500;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.card .ft .br{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;white-space:nowrap}
.card .note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.card .note.warn{color:var(--waiting-text)}
.card .more{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:6px;display:none;align-items:center;justify-content:center;color:var(--text-3)}
.card:hover .more,.card .more[data-open]{display:flex}
.card:hover .when,.card.menu-open .when{visibility:hidden}
.card .more:hover,.card .more[data-open]{background:var(--fill-3);color:var(--text)}
.card.gone{opacity:.62}
.card.gone .tt{font-weight:400}
.pill{height:18px;padding:0 7px;border-radius:9px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.work{color:var(--working);background:#cc4e001a}
.pill.need{color:var(--waiting-text);background:var(--waiting-bg)}
.pill.idle{color:var(--text-2);background:var(--fill-3)}
.pill.move{color:var(--goal-text);background:var(--goal-bg)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;background:var(--page)}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;border-bottom:.5px solid var(--separator)}
.tab{height:32px;padding:0 12px 0 10px;display:flex;align-items:center;gap:8px;border-radius:8px;background:var(--fill-3);max-width:260px;position:relative}
.tab .t{display:flex;flex-direction:column;line-height:14px;min-width:0}
.tab .t b{font-weight:400;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .t span{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs .add{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.rail{width:44px;flex:none;border-left:.5px solid var(--separator);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;color:var(--text-3)}
.chat{flex:1;overflow:auto;display:flex;justify-content:center}
.chat .col{width:680px;padding:40px 0 20px;display:flex;flex-direction:column;gap:14px}
.bubble{align-self:flex-end;max-width:520px;padding:10px 16px;border-radius:16px;background:var(--bubble);box-shadow:0 0 0 .5px var(--separator);font-size:14px;line-height:21px}
.worked{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:13.5px}
.reply{font-size:14px;line-height:22px;color:var(--text-body)}
.reply code{font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px;padding:1px 6px;border-radius:5px;background:var(--fill-3);color:var(--text)}
.composer-wrap{flex:none;display:flex;flex-direction:column;align-items:center;padding:0 0 12px}
.composer{width:690px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a,0 8px 24px #0000000d;padding:12px 14px 10px}
.composer .ph{font-size:14.5px;color:var(--text-4);height:38px}
.composer .bar{display:flex;align-items:center;gap:8px;font-size:13px}
.composer .bar .m{display:flex;align-items:center;gap:6px}
.composer .bar .m span{color:var(--text-3)}
.composer.locked{opacity:.75}
.under{width:690px;display:flex;align-items:center;gap:6px;padding:8px 4px 0;font-size:12.5px;color:var(--text-3)}
.under .r{margin-left:auto;color:var(--waiting-text)}
.under .r.info{color:var(--text-3)}
.moved{width:690px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a;padding:14px 16px;display:flex;align-items:center;gap:12px}
.moved .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.moved .tx b{font-weight:600;font-size:13.5px}
.moved .tx span{font-size:12.5px;color:var(--text-3)}

/* sessions panel (right), as in the app */
.spanel{width:340px;flex:none;border-left:.5px solid var(--separator);display:flex;flex-direction:column;background:var(--page)}
.spanel .phd{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px}
.spanel .phd b{flex:1;min-width:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spanel .phd span{color:var(--text-3);display:flex}
.spanel .sq{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--text-3);font-size:14px;border-bottom:.5px solid var(--separator)}
.spanel .cards{padding:8px;overflow:auto}
.spanel .card{background:var(--fill-1)}
.spanel .card.on{background:var(--fill-3)}

/* mascot (icons/mascot-*.svg, coloured as in welcome/view.rs) */
.cheer{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 0 2px;position:relative}
.stage{width:200px;height:150px;position:relative;cursor:pointer;margin-bottom:2px}
.stage .glow{position:absolute;left:50%;top:58%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(#7a68bf73,#7a68bf00 68%);animation:glow 1.4s ease-out both}
@keyframes glow{from{opacity:0;transform:scale(.6)}}
.stage .shadow{position:absolute;left:50%;bottom:14px;width:84px;height:8px;margin-left:-42px;border-radius:50%;background:#00000033;filter:blur(3px);animation:shadow 1.1s both}
@keyframes shadow{0%{transform:scale(.3);opacity:0}38%{transform:scale(1.05);opacity:1}55%{transform:scale(.92)}100%{transform:none;opacity:1}}
.stage .bot{position:absolute;left:50%;bottom:8px;width:140px;height:140px;margin-left:-70px;transform-origin:50% 84%;animation:drop 1.1s both}
/* falls, squashes from its feet, rebounds once, settles (welcome.rs: GRAVITY, REBOUND, landing spring) */
@keyframes drop{0%{opacity:0;transform:translateY(-64px) scale(.92,1.1);animation-timing-function:cubic-bezier(.55,0,1,.45)}12%{opacity:1}
 34%{transform:translateY(0) scale(1.14,.8);animation-timing-function:cubic-bezier(0,.55,.45,1)}
 52%{transform:translateY(-26px) scale(.96,1.05);animation-timing-function:cubic-bezier(.55,0,1,.45)}
 66%{transform:translateY(0) scale(1.06,.93)}80%{transform:scale(.98,1.02)}100%{transform:none}}
.stage.hop .bot{animation:hop .6s cubic-bezier(.34,1.4,.64,1) both}
@keyframes hop{0%{transform:scale(1.12,.84)}35%{transform:translateY(-34px) scale(.94,1.08)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.stage .light{animation:flash 2.4s ease-in-out .5s infinite}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.55}}
.stage .halo{transform-origin:131px 19px;animation:halo 2.4s ease-in-out .5s infinite}
@keyframes halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.25;transform:scale(1.35)}}
.confetti{position:absolute;left:50%;top:62px;width:0;height:0;pointer-events:none}
.confetti i{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:2px;opacity:0;animation:burst 1.25s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.cheer h2{font-size:20px;line-height:26px;font-weight:700;margin-top:4px}
.cheer .lede{font-size:13.5px;line-height:20px;color:var(--text-2);max-width:380px}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.stage .bot,.stage .shadow,.stage .glow{animation:none!important}}

/* ---------- menus (ui::pop, menu_row, danger_row) ---------- */
.pop{background:var(--popover);border-radius:12px;box-shadow:0 0 0 .5px var(--separator),inset 0 1px 0 var(--highlight),0 18px 50px var(--shadow),0 2px 6px #0000000f}
.menu{position:fixed;z-index:20;padding:6px;display:flex;flex-direction:column;width:230px;animation:menuin .15s cubic-bezier(.22,1,.36,1)}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}}
.ml{padding:6px 10px 2px;font-size:11.5px;font-weight:500;color:var(--text-3)}
.md{height:.5px;margin:4px 8px;background:var(--separator);flex:none}
.mp{height:32px;padding:0 10px;display:flex;align-items:center;gap:10px;border-radius:8px;font-size:13.5px;white-space:nowrap;cursor:pointer;color:var(--text);width:100%}
.mp:hover{background:var(--fill-2)}
.mp .lead{width:14px;display:flex;justify-content:center;flex:none;color:var(--text-2)}
.mp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mp kbd{font:inherit;font-size:12px;color:var(--text-4)}
.mp.danger{color:var(--failed)}.mp.danger .lead{color:var(--failed)}.mp.danger:hover{background:var(--failed-bg)}
.mp.new{position:relative}
.mp.new::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--goal-text);opacity:0;animation:hint 2.4s ease-out .2s}
@keyframes hint{20%{opacity:.5}100%{opacity:0}}

/* ---------- palette (ui::palette_row) ---------- */
.palette{position:fixed;left:50%;top:13vh;transform:translateX(-50%);width:640px;z-index:31;overflow:hidden;animation:modalin .2s cubic-bezier(.22,1,.36,1)}
.palette .q{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:.5px solid var(--separator);font-size:16px}
.palette .q .esc{margin-left:auto;font-size:12px;color:var(--text-3)}
.palette .grp{padding:8px 8px 4px}
.palette .gl{padding:6px 12px 6px;font-size:12px;font-weight:500;color:var(--text-2)}
.prow{height:40px;padding:0 12px;display:flex;align-items:center;gap:12px;border-radius:10px;font-size:14px;cursor:pointer;width:100%}
.prow.sel{background:var(--accent-bg)}
.prow .lead{width:24px;height:24px;border-radius:7px;background:var(--fill-3);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-2)}
.prow .tt{font-weight:500;white-space:nowrap}
.prow .dt{flex:1;min-width:0;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow kbd{font:inherit;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--fill-3);color:var(--text-2)}
.palette .ft{height:40px;display:flex;align-items:center;gap:18px;padding:0 20px;border-top:.5px solid var(--separator);font-size:12px;color:var(--text-3)}
.palette .ft .r{margin-left:auto}

/* ---------- buttons (ui::button) ---------- */
.btn{height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.btn.lg{height:36px;padding:0 18px;border-radius:18px;font-size:14px}
.btn.sm{height:26px;padding:0 10px;border-radius:13px;font-size:12.5px}
.btn.primary{background:var(--text);color:var(--on-text);font-weight:600;box-shadow:inset 0 1px 0 #ffffff2e,0 4px 12px #0000002e}
.btn.secondary{background:var(--fill-3)}
.btn.secondary:hover{background:var(--fill-4)}
.btn.ghost{color:var(--text-2)}
.btn.ghost:hover{background:var(--fill-3)}
.btn.outline{background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.45;cursor:default}
.link{font-size:12.5px;font-weight:500;color:var(--text);text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}

/* ---------- sheet (ui::modal + ui::pop) ---------- */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:520px;max-height:80vh;overflow:auto;z-index:31;border-radius:16px;padding:22px 24px 20px;display:flex;flex-direction:column;gap:16px;animation:modalin .2s cubic-bezier(.22,1,.36,1)}
@keyframes modalin{from{opacity:0;transform:translateX(-50%) scale(.97)}}
.sheet>*{flex:none}
.sheet .hd{display:flex;align-items:flex-start;gap:12px}
.sheet .hd h2{flex:1;font-size:20px;line-height:26px;font-weight:700}
.sheet .hd .x{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--text-3);margin:-1px -4px 0 0}
.sheet .hd .x:hover{background:var(--fill-3);color:var(--text)}
.sheet .sub{font-size:13.5px;line-height:20px;color:var(--text-2);margin-top:-8px}
.lab{font-size:12px;font-weight:600;color:var(--text-2);margin:0 2px -8px}
.box{border-radius:12px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong),0 1px 2px #0000000a;overflow:hidden}
.box>*+*{border-top:.5px solid var(--separator)}
.foot{display:flex;align-items:center;gap:8px;margin-top:4px}
.sheet .foot{position:sticky;bottom:-20px;margin:0 -24px -20px;padding:12px 24px 20px;background:var(--popover)}
.foot .note{flex:1;font-size:12px;line-height:16px;color:var(--text-3)}
.checks{margin-top:2px}
.ck{display:flex;gap:10px;padding:10px 12px;font-size:13px;line-height:18px}
.ck+.ck{border-top:.5px solid var(--separator)}
.ck>.st{width:16px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.ck.bad>.st{color:var(--waiting)}
.ck .tx{flex:1;min-width:0}
.ck .why{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px}
.cmd{display:flex;align-items:center;gap:8px;margin-top:8px;height:30px;padding:0 4px 0 10px;border-radius:8px;background:var(--fill-1);box-shadow:inset 0 0 0 .5px var(--separator)}
.cmd code{flex:1;min-width:0;font:12px/1 'Geist Mono',ui-monospace,monospace;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd button{height:22px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.cmd button:hover{background:var(--fill-3)}
.ck .acts{display:flex;gap:6px;margin-top:8px}
.callout{display:flex;gap:10px;padding:11px 12px;border-radius:10px;font-size:12.5px;line-height:18px;color:var(--text-body);background:var(--fill-2)}
.callout b{color:var(--text);font-weight:600}
.callout.warn{background:var(--waiting-bg)}.callout.warn>svg{color:var(--waiting)}
.callout.bad{background:var(--failed-bg)}.callout.bad>svg{color:var(--failed)}
.callout.ok{background:var(--success-bg)}.callout.ok>svg{color:var(--success)}
.callout>svg{margin-top:1px}

/* host rows (machine picker .ar) */
.hr{padding:9px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;width:100%}
.hr:hover{background:var(--fill-1)}
.hr.sel{background:var(--fill-2)}
.hr.off{cursor:default}.hr.off:hover{background:none}
.hr.off .tx .n{color:var(--text-3)}
.htile{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;position:relative}
.htile .dot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:5px;box-shadow:0 0 0 1.5px var(--surface)}
.hr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hr .tx .n{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.hr .tx .h{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tag.ok{color:var(--success-text)}.tag.warn{color:var(--waiting-text)}.tag.mute{color:var(--text-3)}.tag.bad{color:var(--failed-text)}
.radio{width:16px;height:16px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1.5px var(--text-5);position:relative}
.sel .radio{box-shadow:inset 0 0 0 5px var(--text)}

/* what moves */
.mv{padding:9px 12px;display:flex;align-items:center;gap:10px;font-size:13px}
.mv .ic{width:14px;color:var(--text-3);display:flex;justify-content:center}
.mv .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .mt{font-size:12px;color:var(--text-3);white-space:nowrap}
.mv.off .ic,.mv.off .tx{color:var(--text-3)}
.mv .chip{height:22px;padding:0 9px 0 7px;border-radius:11px;background:var(--fill-2);color:var(--text-2);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.mv .chip svg{color:var(--text-3)}

textarea.summary{width:100%;min-height:150px;resize:vertical;padding:11px 12px;border-radius:11px;background:var(--field);box-shadow:0 0 0 .5px var(--separator);font-size:13px;line-height:20px;color:var(--text)}

/* steps (Settings › Hosts install steps) */
.steps{display:flex;flex-direction:column;padding:4px 0}
.st{display:flex;gap:11px;padding:7px 12px;font-size:13px;align-items:flex-start}
.st .mk{width:16px;height:18px;display:flex;align-items:center;justify-content:center;flex:none}
.st .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.st .tx span{font-size:12px;color:var(--text-3)}
.st.todo{color:var(--text-4)}
.st.todo .tx span{color:var(--text-5)}
.st.fail .tx>b{color:var(--failed-text)}
.st .tx>b{font-weight:400}
.st.now .tx>b{font-weight:500}
.ring{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--text-5)}
.bar2{height:4px;border-radius:2px;background:var(--fill-3);overflow:hidden;margin-top:4px;width:180px}
.bar2 i{display:block;height:100%;background:var(--text-2);border-radius:2px;transition:width .3s}
.safe{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.safe.ok{color:var(--success-text)}
.donemark{width:40px;height:40px;border-radius:20px;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.facts{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-2)}
.facts div{display:flex;gap:8px;align-items:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:13px;animation:menuin .2s}
.tip{position:fixed;z-index:50;padding:5px 8px;border-radius:7px;background:var(--text);color:var(--on-text);font-size:11.5px;pointer-events:none;white-space:nowrap}

/* prototype controls, not part of the design */
.guide{position:fixed;right:404px;bottom:14px;width:212px;max-height:calc(100vh - 28px);overflow:auto;padding:12px 10px 10px;font-size:12px;color:var(--text-2);z-index:25}
.guide .gh{display:flex;align-items:center;gap:6px;padding:0 6px 8px;font-weight:600;color:var(--text)}
.guide .gh button{margin-left:auto;font-weight:400;color:var(--text-3);font-size:11.5px;padding:2px 6px;border-radius:6px}
.guide .gh button:hover{background:var(--fill-2)}
.guide .gs{padding:8px 6px 3px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-4)}
.guide .gi{display:flex;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;width:100%;color:var(--text-2)}
.guide .gi:hover{background:var(--fill-2);color:var(--text)}
.guide .gi.on{background:var(--fill-3);color:var(--text)}
.guide .gi i{font-style:normal;color:var(--text-4);width:16px;text-align:right;flex:none}
.guide .why{margin:8px 6px 0;padding:9px 10px;border-radius:8px;background:var(--fill-2);line-height:1.5;color:var(--text-2)}
.guide .why b{color:var(--text);display:block;margin-bottom:2px}
.guide.min{width:auto}
.guide.min .gs,.guide.min .gi,.guide.min .why{display:none}
.guide.min .gh{padding:0 4px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}.spin{animation:sp 1.6s linear infinite!important}}
</style>
</head>

  const tag=s.checking?'<span class="tag mute"><span class="spin" style="border-color:var(--text-3);border-right-color:transparent"></span>Checking…</span>'

  return `<button class="hr${sel?' sel':''}" data-act="host" data-v="${h.id}"><span class="radio"></span><span class="htile" style="background:${h.color}">${ic(h.icon,14)}<span class="dot"></span></span><span class="tx"><span class="n">${h.name}</span><span class="h">${esc(h.addr)}</span></span>${tag}</button>`;
}
function pickSheet(){
  const hosts=online();
  if(!hosts.length)return `<div class="hd"><h2>Hand off to a host</h2><button class="x" data-act="close" aria-label="Close">${ic('x',15)}</button></div>
    <div class="box"><div style="padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">${ic('server',22,'var(--text-4)')}<b style="font-weight:600">No host is connected</b><span style="font-size:12.5px;color:var(--text-3);max-width:320px">Hosts you add in Settings show here while they’re connected.</span><button class="btn outline sm" style="margin-top:6px" data-act="toast" data-v="Opens Settings › Hosts">${ic('plus',12)}Add a host…</button></div></div>
    <div class="foot"><span class="note"></span><button class="btn ghost lg" data-act="close">Close</button></div>`;
  if(!hosts.find(h=>h.id===s.host))s.host=hosts[0].id;
  const h=H(),res=canResume(h),a=A(),bad=s.checking?[]:toFix(h);
  let block='',primary;
  if(!res.ok){
    block=`<div class="callout warn">${ic('warning',14)}<div><b>The conversation can’t move to ${h.name}</b><br>${res.why} A new ${short()} session starts from a summary instead.</div></div>`;
    primary=`<button class="btn primary lg" data-act="summary">${s.agent==='shell'?'Write summary…':'Review summary…'}</button>`;
  }else{
    primary=`<button class="btn primary lg" data-act="go">Hand off</button>`;
  }
  const conv=res.ok?`<div class="mv"><span class="ic">${ic('comment',13)}</span><span class="tx">Conversation</span><span class="mt">38 messages</span></div>`:`<div class="mv off"><span class="ic">${ic('comment',13)}</span><span class="tx">Conversation</span><span class="chip">${ic('sparkle',12)}Sent as a summary</span></div>`;
  return `<div class="hd"><h2>Hand off to a host</h2><button class="x" data-act="close" aria-label="Close">${ic('x',15)}</button></div>
    <p class="sub">“${TITLE}” · ${esc(a.name)}</p>
    <div class="lab">Host</div>
    <div class="box">${hosts.map(hostRow).join('')}</div>
    ${bad.length?fixBox(h):block}
    <div class="lab">What moves</div><div class="box">
      <div class="mv"><span class="ic">${ic('branch',13)}</span><span class="tx mono" style="font-size:12.5px">${BRANCH}</span><span class="mt">3 commits</span></div>
      <div class="mv"><span class="ic">${ic('file',13)}</span><span class="tx">12 changed files</span><span class="mt stat mono"><span class="a">+42</span><span class="d">−17</span></span></div>
      ${conv}</div>
    <div class="foot"><span class="note"></span><button class="btn ghost lg" data-act="close">Cancel</button>${bad.length?`<button class="btn primary lg" data-act="recheck">Check again</button>`:s.checking?primary.replace('<button','<button disabled style="opacity:.4;pointer-events:none"'):primary}</div>`;
}
function fixBox(h){
  const rows=checks(h).filter(c=>!c.ok).map(c=>`<div class="ck bad"><span class="st">${ic('warning',14)}</span><span class="tx"><b style="font-weight:600">${c.label}</b>${c.why?`<span class="why">${c.why}</span>`:''}
      <span class="cmd"><code>${esc(c.cmd)}</code><button data-act="toast" data-v="Copied">${ic('copy',12)}Copy</button></span>
      <span class="acts"><button class="btn outline sm" data-act="toast" data-v="Opens a terminal on ${h.name}">${ic('terminal',12)}Open terminal</button></span></span></div>`).join('');
  return `<div class="lab">Fix on ${h.name}, then check again</div><div class="box checks">${rows}</div>`;
}
function summarySheet(){
  const h=H();
  return `<div class="hd"><button class="x" data-act="back" aria-label="Back" style="margin:-1px 0 0 -6px">${ic('back',15)}</button><h2>Summary for the new ${short()} session</h2><button class="x" data-act="close" aria-label="Close">${ic('x',15)}</button></div>
    <p class="sub">${s.agent==='shell'?'What should the new session know?':'It becomes the new session’s first prompt.'}</p>
    <textarea class="summary" id="summary" spellcheck="false" placeholder="What were you doing, what's done, what's next?">${s.agent==='shell'?'':esc(s.summary||SUMMARY)}</textarea>
    <div class="foot"><span class="note"></span><button class="btn ghost lg" data-act="back">Back</button><button class="btn primary lg" data-act="go">Move code & start</button></div>`;
}
function stepMark(i,cur,failed){
  if(failed&&i===cur)return ic('x',13,'var(--failed)');
  if(i<cur)return ic('check',13,'var(--success)');
  if(i===cur&&!failed)return '<span class="spin big n"></span>';
  return '<span class="ring"></span>';
}
const FAILS={
  offline:{at:'send',msg:h=>`${h.name} went offline at 0.6 of 1.4 MB.`,title:h=>`${h.name} went offline`,body:h=>`Nothing changed on this Mac. It retries when ${h.name} is back.`,act:'Retry now'},
  history:{at:'check',msg:h=>`${short()} opened with 0 of 38 messages.`,title:h=>`The conversation didn’t open on ${h.name}`,body:h=>`${short()} opened empty there. Nothing changed on this Mac.`,act:'Retry'},
};
function progressSheet(){
  const h=H(),list=steps(),f=s.fail&&FAILS[s.fail],failAt=f?list.findIndex(x=>x[0]===f.at):-1;
  const cur=f?failAt:s.step;
  const done=s.phase==='done';
  const rows=list.map((x,i)=>{
    const st=f&&i===failAt?'fail':i<cur||done?'':i===cur?'now':'todo';
    let extra='';
    if(x[0]==='send'&&i===cur&&!f)extra=`<div class="bar2"><i style="width:${Math.min(100,s.sent)}%"></i></div>`;
    const sub=st==='fail'?f.msg(h):x[2];
    return `<div class="st ${st}"><span class="mk">${done?ic('check',13,'var(--success)'):stepMark(i,cur,!!f)}</span><span class="tx"><b>${x[1]}</b>${sub?`<span>${esc(sub)}</span>`:''}${extra}</span></div>`;
  }).join('');
  const resume=canResume(h).ok&&s.choiceUsed==='resume';
  if(f){
    return `<div class="hd"><h2>${esc(f.title(h))}</h2><button class="x" data-act="close" aria-label="Close">${ic('x',15)}</button></div>
      <div class="box"><div class="steps">${rows}</div></div>
      <p class="sub" style="margin-top:0">${esc(f.body(h))}</p>
      <div class="foot"><span class="note"></span><button class="btn ghost lg" data-act="close">Close</button>${f.extra?f.extra(h):''}<button class="btn primary lg" data-act="retry">${esc(f.act)}</button></div>`;
  }
  if(done){
    return `<div class="hd" style="margin-bottom:-14px"><span class="grow"></span><button class="x" data-act="close" aria-label="Close">${ic('x',15)}</button></div>
      <div class="cheer">${mascot()}
      <h2>${resume?`${short()} made it to ${h.name}!`:`A fresh ${short()} is up on ${h.name}`}</h2>
      <p class="lede">${resume?'It picks up where you left off. You can close this Mac.':'It starts from your summary and all the code. This session stays open here.'}</p></div>
      <div class="foot"><span class="note"></span><button class="btn ghost lg" data-act="close">Done</button><button class="btn primary lg" data-act="space" data-v="${h.id}">Open on ${h.name}</button></div>`;
  }
  const cancellable=list[cur]&&!['start','check'].includes(list[cur][0]);
  return `<div class="hd"><h2>Handing off to ${h.name}</h2><button class="x" data-act="hide" aria-label="Hide">${ic('x',15)}</button></div>
    <div class="box"><div class="steps">${rows}</div></div>
    <div class="safe">${ic('laptop',13,'var(--text-3)')}<span>Keep this Mac awake until it’s done.</span></div>
    <div class="foot"><span class="note"></span>${cancellable?'<button class="btn ghost lg" data-act="cancel">Cancel handoff</button>':''}<button class="btn secondary lg" data-act="hide">Hide</button></div>`;
}
function sheet(){
  if(!s.sheet)return '';
  const body=s.sheet==='pick'?pickSheet():s.sheet==='summary'?summarySheet():progressSheet();
  return `<div class="backdrop" data-act="${s.sheet==='progress'&&s.phase!=='failed'&&s.phase!=='done'?'hide':'close'}"></div><section class="sheet pop" role="dialog" aria-modal="true" data-stop>${body}</section>`;
}

/* ---------- guide ---------- */
const SCEN=[
  ['Find it',[['menu','Session menu'],['tab','Tab menu (right-click)'],['palette','Command palette']]],
  ['Before it starts',[['checking','Checking hosts'],['norepo','Project isn’t there'],['noauth','Agent not signed in'],['branchtaken','Branch already there'],['nohost','No host connected']]],
  ['Hand off',[['pick','Pick a host'],['working','Agent is working'],['moving','Moving'],['hidden','Hidden while moving'],['done','Done'],['after','This Mac afterwards'],['host','On the host']]],
  ['When it stops',[['offline','Host goes offline'],['history','History didn’t open']]],
  ['Other agents',[['hermes','Hermes · other user'],['grok','Grok · other path'],['grokok','Grok · same path'],['antigravity','Antigravity · other path'],['shell','Started in a terminal'],['summary','Summary to start with']]],
];
const WHY={
  menu:['Where it lives','In the session’s menu in the sessions panel, under Fork session: both make this conversation continue somewhere else. A hint ring marks it the first time.'],
  tab:['Same menu, other door','The session tab’s right-click menu gets the same row, under Open in Terminal chat.'],
  palette:['Search for it','“hand”, “host” or a host’s name finds the action for the open session.'],
  pick:['Connected hosts only','Only hosts connected right now are listed, each checked as the sheet opens: Ready or Not ready.'],
  working:['Don’t wait for the turn','The button stays “Hand off”. A working agent stops by itself first; a quiet note says so, and the edits it made so far go along.'],
  checking:['Checked up front','Opening the sheet checks every connected host. Nothing is sent until the host has what it needs.'],
  norepo:['Anywhere doesn’t clone','A host without the project gets the exact command to run there. The user clones it, presses Check again, and it’s found by its remote.'],
  noauth:['Sign in by hand','Not checked for sessions started in a terminal: Anywhere can’t start those.'],
  branchtaken:['Never overwrite','A branch with commits the Mac lacks is left alone. Renaming it there is the user’s call.'],
  moving:['Steps you can trust','Each step names what it touched. “You can close this Mac” only appears after the host checks the history.'],
  hidden:['Out of the way','Hiding keeps it going: the card, tab and composer carry the state. The session menu reopens it.'],
  done:['A small celebration','The app’s mascot drops in, lit, with happy eyes and a burst of confetti; click it to cheer again. It only appears once the host has checked all 38 messages.'],
  after:['A trail, not a hole','The Mac keeps the worktree and a quiet card pointing at the host.'],
  host:['Where it continues','The session sits in the host’s space with its history and a “Continued on devbox” marker.'],
  offline:['Fail safe','Nothing on the Mac changes until the host verifies. Every stop says what happened and what is safe.'],
  history:['Empty is a failure','Some agents open an empty session instead of failing. The check catches it and closes that session.'],
  nohost:['Nothing to pick','Only connected hosts are listed. With none, the sheet points to Settings › Hosts.'],
  hermes:['Honest about limits','Hermes ties a conversation to the user. On a host with another user it says so in plain words and offers what still works.'],
  grok:['Same, for paths','Grok and Antigravity tie a conversation to the folder path. mac-mini has the same path, so it’s ready there.'],
  grokok:['Same path, full handoff','On mac-mini the project lives at the same path, so Grok’s conversation moves as with any other agent.'],
  antigravity:['Same rule as Grok','Antigravity needs the same folder path too.'],
  shell:['Started outside Anywhere','A terminal-typed session can’t be read, so only code moves; the summary is yours to write.'],
  summary:['A summary is a new start','It’s editable, shown as the first prompt on the host, and never presented as the old history.'],
};
function guide(){
  const w=WHY[s.scenario];
  return `<div class="guide pop${s.guide?'':' min'}" data-stop><div class="gh">Prototype<button data-act="theme">${document.documentElement.dataset.theme==='dark'?'Light':'Dark'}</button><button data-act="guide">${s.guide?'Hide':'Scenarios'}</button></div>
    ${SCEN.map(([g,items])=>`<div class="gs">${g}</div>`+items.map(([id,l])=>`<button class="gi${s.scenario===id?' on':''}" data-act="scenario" data-v="${id}"><span class="grow">${l}</span></button>`).join('')).join('')}
    ${w?`<div class="why"><b>${w[0]}</b>${w[1]}</div>`:''}</div>`;
}

/* ---------- render ---------- */
const $=q=>document.querySelector(q);
function render(){
  $('#root').innerHTML=`<div class="app">${sidebar()}${main()}</div>${sheet()}${s.palette?palette():''}${s.toast?`<div class="toast pop">${ic('check',13,'var(--success)')}${esc(s.toast)}</div>`:''}${guide()}`;
  if(s.menu)$('#root').insertAdjacentHTML('beforeend',s.menu==='card'?cardMenu():tabMenu());
  const ta=$('#summary');if(ta)ta.oninput=e=>{s.summary=e.target.value};
}

/* ---------- motion of a handoff ---------- */
let timer=null;
function stop(){clearInterval(timer);timer=null}
function run(){
  stop();
  const list=steps();
  timer=setInterval(()=>{
    const cur=list[s.step];
    if(!cur){stop();s.phase='done';if(s.hidden){s.toast=`${short()} is running on ${H().name}`;setTimeout(()=>{s.toast=null;render()},2600)}render();return}
    if(cur[0]==='send'&&s.sent<100){s.sent+=20;render();return}
    if(cur[0]==='turn')s.turn='idle';
    s.step++;render();
  },650);
}
/** Prototype: checks take a moment; a recheck finds what the user fixed by hand. */
function recheck(fixed){
  s.checking=true;
  setTimeout(()=>{if(fixed)toFix(H()).forEach(c=>{const h=H();if(c.fix==='repo')h.repo='~/code/app-android';else if(c.fix==='signed')h.signed=true;else h.branchTaken=false});s.checking=false;render()},900);
}
function startHandoff(){
  const h=H(),res=canResume(h).ok;
  s.choiceUsed=res?'resume':'summary';
  s.sheet='progress';s.step=0;s.sent=0;s.fail=null;s.hidden=false;
  s.phase='moving';
  run();render();
}

/* ---------- scenarios ---------- */
function scenario(id){
  stop();s={...S0,guide:s.guide,scenario:id};
  HOSTS.forEach(h=>{h.link=h.id==='office'?'offline':'online';h.signed=true;h.branchTaken=false;h.repo=h.id==='gpu'?null:'~/code/app-android'});
  const at=(o)=>Object.assign(s,o);
  const freeze=(stepKey,extra={})=>{const list=steps();s.sheet='progress';s.choiceUsed=canResume(H()).ok?'resume':'summary';s.phase=extra.phase||'moving';s.step=Math.max(0,list.findIndex(x=>x[0]===stepKey));s.sent=40;Object.assign(s,extra)};
  switch(id){
    case 'menu':at({menu:'card'});break;
    case 'tab':at({menu:'tab'});break;
    case 'palette':at({palette:true});break;
    case 'pick':at({sheet:'pick'});break;
    case 'working':at({sheet:'pick',turn:'working'});break;
    case 'checking':at({sheet:'pick',checking:true});break;
    case 'norepo':at({sheet:'pick',host:'gpu'});break;
    case 'noauth':at({sheet:'pick',host:'mini'});HOSTS[1].signed=false;break;
    case 'branchtaken':at({sheet:'pick'});HOSTS[0].branchTaken=true;break;
    case 'moving':freeze('send');break;
    case 'hidden':freeze('conv',{sheet:null,hidden:true});break;
    case 'done':freeze('check',{phase:'done',step:99});break;
    case 'after':freeze('check',{phase:'done',step:99,sheet:null});break;
    case 'host':freeze('check',{phase:'done',step:99,sheet:null,space:'devbox'});break;
    case 'offline':freeze('send',{phase:'failed',fail:'offline'});break;
    case 'history':freeze('check',{phase:'failed',fail:'history'});break;
    case 'nohost':at({sheet:'pick'});HOSTS.forEach(h=>h.link='offline');break;
    case 'hermes':at({sheet:'pick',agent:'hermes'});break;
    case 'grok':at({sheet:'pick',agent:'grok'});break;
    case 'grokok':at({sheet:'pick',agent:'grok',host:'mini'});break;
    case 'antigravity':at({sheet:'pick',agent:'antigravity'});break;
    case 'shell':at({sheet:'pick',agent:'shell'});break;
    case 'summary':at({sheet:'summary',agent:'hermes'});break;
  }
  render();
}

/* ---------- events ---------- */
document.addEventListener('mousedown',e=>{
  // A press outside an open menu shuts it (docs/DESIGN.md); a press on its trigger is handled by the click.
  if(s.menu&&!e.target.closest('[data-stop]')&&!e.target.closest('[data-v=card].more')&&!e.target.closest('.tab')){s.menu=null;render()}
});
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('.tab')){e.preventDefault();s.menu=s.menu==='tab'?null:'tab';render()}
  else if(e.target.closest('.card.on')&&s.space==='mac'){e.preventDefault();s.menu='card';render()}
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  if(el.closest('.card')&&act==='view'&&e.target.closest('.more'))return;
  e.stopPropagation();
  switch(act){
    case 'menu':s.menu=s.menu===v?null:v;break; // a second press on the trigger shuts it
    case 'tabmenu':s.menu=s.menu==='tab'?null:'tab';break;
    case 'palette':s.palette=true;s.menu=null;break;
    case 'open':s.menu=null;s.palette=false;s.sheet='pick';recheck(false);break;
    case 'reopen':s.menu=null;s.sheet='progress';s.hidden=false;break;
    case 'host':s.host=v;break;
    case 'recheck':recheck(true);break;
    case 'summary':s.sheet='summary';break;
    case 'back':s.sheet='pick';break;
    case 'go':startHandoff();return;
    case 'hide':s.sheet=null;s.hidden=true;break;
    case 'cancel':stop();s.phase='none';s.sheet=null;s.menu=null;s.toast='Handoff cancelled. Nothing changed.';setTimeout(()=>{s.toast=null;render()},2200);break;
    case 'retry':s.fail=null;s.phase='moving';run();break;
    case 'close':if(s.sheet==='progress'&&s.phase==='moving')s.hidden=true;s.sheet=null;s.palette=false;break;
    case 'space':s.space=v;s.sheet=null;s.menu=null;break;
    case 'view':s.menu=null;break;
    case 'toast':s.menu=null;s.toast=v;setTimeout(()=>{s.toast=null;render()},2000);break;
    case 'scenario':scenario(v);return;
    case 'cheer':{const st=el;st.classList.remove('hop');void st.offsetWidth;st.classList.add('hop');const c=st.querySelector('.confetti');c.outerHTML=confetti();return}
    case 'guide':s.guide=!s.guide;break;
    case 'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';break;
  }
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(s.menu)s.menu=null;else if(s.palette)s.palette=false;else if(s.sheet==='progress'&&s.phase==='moving'){s.sheet=null;s.hidden=true}else s.sheet=null;render()}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();s.palette=true;render()}
});
let tipEl=null;
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');tipEl?.remove();tipEl=null;if(!t)return;const r=t.getBoundingClientRect();tipEl=document.createElement('div');tipEl.className='tip';tipEl.textContent=t.dataset.tip;tipEl.style.left=r.left+'px';tipEl.style.top=(r.bottom+6)+'px';document.body.appendChild(tipEl)});
if(location.search.includes('dark'))document.documentElement.dataset.theme='dark';
scenario(location.hash.slice(1)||'menu');
</script>
</body>
</html>
