<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anywhere · Pull request detail</title>
<style>
:root{
  --page:#121212;--surface:#1a1a1a;--raised:#222;--text:#ebebeb;--text-body:#bcbcbc;--text-2:#a1a1a1;--text-3:#818181;--text-4:#6c6c6c;--text-6:#414141;
  --fill-1:rgba(235,235,235,.05);--fill-2:rgba(235,235,235,.078);--fill-3:rgba(235,235,235,.102);--fill-4:rgba(235,235,235,.122);
  --hairline:rgba(235,235,235,.07);--sep:rgba(235,235,235,.078);--sep-strong:rgba(235,235,235,.14);
  --glass:rgba(34,34,34,.72);--glass-ring:rgba(235,235,235,.12);
  --shadow:0 18px 48px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.3);
  --row-shadow:0 0 0 .5px rgba(235,235,235,.08);
  --primary:#ebebeb;--on-primary:#121212;
  --waiting:#ffb224;--waiting-text:#ffca16;--waiting-bg:rgba(255,178,36,.13);
  --failed:#e5484d;--failed-text:#ff9592;--failed-bg:rgba(229,72,77,.12);
  --success:#30a46c;--success-text:#3dd68c;--success-bg:rgba(48,164,108,.14);
  --merged:#8e4ec6;--merged-text:#bf7af0;--merged-bg:rgba(142,78,198,.16);
  --add-bg:rgba(48,164,108,.12);--add-text:#7ee2a8;--del-bg:rgba(229,72,77,.12);--del-text:#ff9592;
  --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
:root.light{
  --page:#fafafa;--surface:#fff;--raised:#fff;--text:#111113;--text-body:#3f3f46;--text-2:#6f6f78;--text-3:#8b8b94;--text-4:#a1a1aa;--text-6:#d4d4d8;
  --fill-1:rgba(17,17,19,.03);--fill-2:rgba(17,17,19,.043);--fill-3:rgba(17,17,19,.055);--fill-4:rgba(17,17,19,.067);
  --hairline:rgba(17,17,19,.071);--sep:rgba(17,17,19,.09);--sep-strong:rgba(17,17,19,.122);
  --glass:rgba(255,255,255,.76);--glass-ring:rgba(17,17,19,.1);
  --shadow:0 18px 48px rgba(17,17,19,.14),0 4px 12px rgba(17,17,19,.06);
  --row-shadow:0 0 0 .5px rgba(17,17,19,.08),0 1px 2px rgba(17,17,19,.04);
  --primary:#111113;--on-primary:#fff;
  --waiting:#ad5700;--waiting-text:#ad5700;--waiting-bg:rgba(255,178,36,.16);
  --failed:#cd2b31;--failed-text:#cd2b31;--failed-bg:rgba(229,72,77,.09);
  --success:#2b9a66;--success-text:#218358;--success-bg:rgba(48,164,108,.12);
  --merged:#8e4ec6;--merged-text:#8145b5;--merged-bg:rgba(142,78,198,.1);
  --add-bg:rgba(48,164,108,.1);--add-text:#18794e;--del-bg:rgba(229,72,77,.08);--del-text:#cd2b31;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0a}
:root.light body{background:#d9dce2}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--text);font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default;text-align:left}
button:focus-visible{outline:2px solid var(--sep-strong);outline-offset:1px}
svg{display:block;flex:none}
code{font:11.5px var(--mono);background:var(--fill-3);padding:1px 5px;border-radius:4px;color:var(--text)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.spin{animation:spin .9s linear infinite}

/* ── window: chat | panel | rail ── */
#win{position:absolute;inset:24px 24px 76px;border-radius:12px;overflow:hidden;background:var(--page);
  box-shadow:0 0 0 .5px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.5);display:flex}
#log{flex:1;min-width:0;overflow-y:auto;padding:20px 24px 24px}
#log .lh{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;font-size:12.5px;color:var(--text-3);line-height:18px;max-width:560px}
#log .lh b{font-size:13.5px;color:var(--text)}
#log i{font-style:normal}
.old,.new{font:600 10.5px/16px var(--mono);padding:0 5px;border-radius:4px;white-space:nowrap}
.old{background:var(--success-bg);color:var(--success-text)}.new{background:var(--waiting-bg);color:var(--waiting-text)}
.le{padding:8px 10px;border-radius:9px;background:var(--fill-1);box-shadow:inset 0 0 0 .5px var(--hairline);margin-bottom:6px;font-size:12.5px}
.le .h{display:flex;align-items:center;gap:8px}
.le .what{font-weight:600}
.le .kind{font:600 10.5px/16px var(--mono);padding:0 5px;border-radius:4px}
.le .kind.old{background:var(--success-bg);color:var(--success-text)}.le .kind.new{background:var(--waiting-bg);color:var(--waiting-text)}
.le .sp{flex:1}.le .res{font:11.5px var(--mono)}
.le code{display:block;margin-top:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:16px;color:var(--text-2);background:var(--fill-2)}
.le .fx{margin-top:5px;font-size:12px;color:var(--text-3);line-height:17px}
.le .fx b{color:var(--text-2);font-weight:500}
#panel{position:relative;flex:none;width:334px;display:flex;flex-direction:column;border-left:.5px solid var(--sep);min-height:0}
#edge{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:20}
#edge:hover,#edge.drag{background:linear-gradient(90deg,transparent 2px,var(--sep-strong) 2px,var(--sep-strong) 4px,transparent 4px)}
#rail{flex:none;width:44px;border-left:.5px solid var(--sep);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:44px}
#rail button{position:relative;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
#rail button:hover{background:var(--fill-2)}
#rail button.on{background:var(--fill-3);color:var(--text)}
#rail .badge{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--failed)}

/* ── panel head ── */
.ph{height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;font-size:13.5px;font-weight:600}
.ph .t{flex:1}
.ib{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);transition:background-color .12s}
.ib:hover{background:var(--fill-2);color:var(--text)}
.ib:active{transform:scale(.94)}
.ib.busy{pointer-events:none;color:var(--text-2)}
.ib.busy svg{animation:spin .8s linear infinite}
#scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;position:relative}

/* ── hero: what the PR is and where it stands ── */
.hero{padding:2px 16px 12px;display:flex;flex-direction:column;gap:10px}
.title{font-size:16px;line-height:21px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:pretty}
.title .num{color:var(--text-3);font-weight:500}
.state{display:flex;align-items:center;gap:8px}
.chip{height:28px;padding:0 8px 0 9px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;min-width:0;
  background:var(--c-bg);color:var(--c-fg);transition:background-color .2s,color .2s}
.chip .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip:hover{filter:brightness(1.12)}
.chip:active{transform:scale(.97)}
.chip .dn{opacity:.7}
.state .sp{flex:1}
.btn{height:28px;padding:0 11px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:background-color .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.pri:hover{opacity:.9}
.btn.sec{background:var(--fill-3)}
.btn.sec:hover{background:var(--fill-4)}
.btn.ghost{color:var(--text-2)}
.btn.ghost:hover{background:var(--fill-2);color:var(--text)}
.btn.sm{height:24px;padding:0 9px;border-radius:7px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.split .btn[disabled]{opacity:1}
.split{display:flex;border-radius:8px;overflow:hidden}
.split .btn{border-radius:0}
.split .more{width:26px;padding:0;border-left:1px solid color-mix(in srgb,var(--on-primary) 18%,transparent)}
.branches{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--text-2);min-width:0;white-space:nowrap}
.branches .b{display:flex;align-items:center;gap:4px;min-width:0}
.branches .b span{overflow:hidden;text-overflow:ellipsis}
.branches .ar{color:var(--text-4)}
.add{color:var(--success-text)}.del{color:var(--failed-text)}
.people{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);min-width:0}
.people .by{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.people .by b{color:var(--text-2);font-weight:500}
.people .vr{width:1px;height:14px;background:var(--sep-strong)}
.revs{display:flex;align-items:center}
.revs{gap:6px}
.revs .av{box-shadow:0 0 0 2px var(--page)}
.av{position:relative;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;flex:none}
.av.bot{border-radius:6px;background:var(--fill-4);color:var(--text-2)}
.av .v{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--page)}
.av .v.ok{background:var(--success)}.av .v.no{background:var(--failed)}.av .v.wait{background:var(--text-4)}
.plus{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text-4)}
.plus:hover{background:var(--fill-2);color:var(--text-2)}
.labels{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.label{height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:500;display:flex;align-items:center;
  color:var(--l);background:color-mix(in srgb,var(--l) 14%,transparent);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--l) 40%,transparent)}

/* ── banners ── */
.banner{margin:0 12px 12px;padding:8px 8px 8px 10px;border-radius:9px;display:flex;align-items:center;gap:9px;font-size:12px;line-height:16px;color:var(--text-2)}
.banner b{display:block;font-size:12.5px;color:var(--text);font-weight:600}
.banner .tx{flex:1;min-width:0}

/* ── tabs: sticky, glass once stuck ── */
.tabs{position:sticky;top:0;z-index:5;height:44px;padding:0 10px;display:flex;align-items:center;gap:2px;
  background:var(--page);transition:background-color .2s}
.tabs.stuck{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.tabs::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;pointer-events:none;opacity:0;
  background:linear-gradient(var(--page),transparent);transition:opacity .2s}
.tabs.stuck::after{opacity:.9}
.tabs .ind{position:absolute;left:0;top:8px;height:28px;border-radius:8px;background:var(--fill-3);will-change:transform,width}
.tab{position:relative;z-index:1;height:28px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:5px;color:var(--text-3);font-size:12.5px;font-weight:500;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text)}
.tab .n{font:11.5px var(--mono);color:var(--text-4)}
.tab.on .n{color:var(--text-3)}
.tab .lbl{display:none}
.tab.on .lbl{display:inline}
.tab .n.ok{color:var(--success-text)}.tab .n.bad{color:var(--failed-text)}.tab .n.run{color:var(--waiting-text)}
.tabs .sp{flex:1}

#body{padding:4px 0 72px}
.pane.enter{animation:paneIn .22s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}

/* ── disclosure sections ── */
.sec{padding:0 12px}
.sec-row{display:flex;align-items:center;gap:8px}
.sec-h{height:32px;flex:1;display:flex;align-items:center;gap:6px;padding:0 4px;border-radius:7px;color:var(--text-3);font-size:12px;font-weight:500}
.sec-h:hover{color:var(--text-2)}
.sec-h .chev{transition:transform .25s var(--ease)}
.sec.shut .sec-h .chev{transform:rotate(-90deg)}
.sec-h .c{font:11.5px var(--mono);color:var(--text-4)}
.sec-h .sp{flex:1}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s var(--ease),opacity .2s}
.sec.shut .fold{grid-template-rows:0fr;opacity:0}
.fold>div{min-height:0;overflow:hidden}

/* ── description: rendered markdown ── */
.md{padding:2px 4px 14px;font-size:13px;line-height:20px;color:var(--text-body)}
.md h3{margin:10px 0 4px;font-size:13.5px;font-weight:600;color:var(--text)}
.md h3:first-child{margin-top:0}
.md p{margin:0 0 8px}
.md ul{list-style:none;margin:0;padding:0}
.md li{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.cb{width:14px;height:14px;margin-top:3px;border-radius:4px;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--sep-strong)}
.cb.on{background:var(--primary);box-shadow:none;color:var(--on-primary)}

/* ── timeline ── */
.tl{display:flex;flex-direction:column;gap:10px;padding:2px 0 8px}
.card{border-radius:12px;background:var(--surface);box-shadow:var(--row-shadow);overflow:hidden}
.fresh{animation:rise .3s var(--ease) both}
.card.pending,.rp.pending{opacity:.55}
.ib.xs{width:22px;height:22px}
.bulk{width:100%;height:30px}
.allres{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;background:var(--surface);box-shadow:var(--row-shadow);font-size:12.5px;color:var(--text-3)}
.tcol{margin:0 8px 8px;width:calc(100% - 16px);height:32px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:7px;font:11.5px var(--mono);color:var(--text-3);box-shadow:inset 0 0 0 .5px var(--sep-strong)}
.tcol:hover{background:var(--fill-1);color:var(--text-2)}
.tcol .sp{flex:1}.tcol .mt{font-family:var(--sans)}
.outd{height:16px;padding:0 5px;border-radius:4px;background:var(--fill-3);color:var(--text-3);font:500 10.5px/16px var(--sans)}
.err{display:flex;align-items:center;gap:6px;margin:6px 10px 0 36px;font-size:12px;color:var(--failed-text)}
.composer .err{margin:0 10px 4px}
.composer{margin:6px 12px 0;border-radius:10px;background:var(--fill-2);box-shadow:inset 0 0 0 .5px var(--sep-strong)}
.composer textarea{width:100%;min-height:56px;resize:none;border:0;outline:0;background:none;color:var(--text);font:12.5px/18px var(--sans);padding:9px 10px 0;display:block}
.composer .f,.reply .f{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:4px 6px 6px}
.hint{margin-right:auto;padding-left:4px;font-size:11px;color:var(--text-4)}
blockquote{margin:0 0 4px;padding-left:8px;border-left:2px solid var(--sep-strong);color:var(--text-3)}
.cbody p,.rp .m p{margin:0 0 4px}.cbody p:last-child,.rp .m p:last-child{margin:0}
.filter b{font-weight:500;color:var(--text-4);margin-left:2px}
.ch{display:flex;align-items:center;gap:7px;padding:9px 8px 0 10px;font-size:12.5px;min-width:0}
.ch .who{font-weight:600;white-space:nowrap}
.tag{height:16px;padding:0 5px;border-radius:4px;background:var(--fill-3);color:var(--text-3);font-size:10.5px;font-weight:500;display:flex;align-items:center}
.ch .when{color:var(--text-4);white-space:nowrap}
.ch .sp{flex:1}
.verdict{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;white-space:nowrap;color:var(--text-3)}
.verdict.ok{color:var(--success-text)}.verdict.no{color:var(--failed-text)}
.cbody{padding:5px 12px 10px 37px;font-size:13px;line-height:19px;color:var(--text-body)}
.event{display:flex;align-items:center;gap:8px;padding:0 10px;height:24px;font-size:12px;color:var(--text-3)}
.event .ln{width:20px;display:grid;place-items:center;color:var(--text-4)}
.event code{font-size:11px}

.thread{margin:0 8px 8px;border-radius:9px;box-shadow:inset 0 0 0 .5px var(--sep-strong);overflow:hidden}
.thread.done{opacity:.72}
.th{width:100%;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;font:11.5px var(--mono);color:var(--text-3);background:var(--fill-1);min-width:0}
.th .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;direction:rtl;text-align:left}
.th .p b{color:var(--text-2);font-weight:400}
.th .sp{flex:1}
.pill{height:18px;padding:0 6px;border-radius:5px;font:600 11px var(--sans);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill.res{background:var(--success-bg);color:var(--success-text)}
.pill.rep{background:var(--fill-3);color:var(--text)}
.pill.fix{color:var(--waiting-text);font-weight:500}
.pill.fix i{width:6px;height:6px;border-radius:50%;background:var(--waiting)}
.code{font:11.5px/18px var(--mono);background:var(--fill-2);overflow-x:auto;scrollbar-width:none;padding:3px 0}
.code div{display:flex;white-space:pre;color:var(--text-2);min-width:max-content}
.code .n{width:34px;flex:none;text-align:right;padding-right:10px;color:var(--text-4);user-select:none}
.code .add{background:var(--add-bg);color:var(--add-text);box-shadow:inset 2px 0 var(--success)}
.code .del{background:var(--del-bg);color:var(--del-text);box-shadow:inset 2px 0 var(--failed)}
.code .at{box-shadow:inset 2px 0 var(--success)}
.rp{display:flex;gap:8px;padding:9px 10px 0;font-size:12.5px;line-height:18px;color:var(--text-body)}
.rp .m{flex:1;min-width:0}
.rp .m .h{display:flex;gap:6px;align-items:center;margin-bottom:1px}
.rp .m .h b{font-weight:600;color:var(--text)}
.rp .m .h span{color:var(--text-4);font-size:11.5px}
.more-replies{margin:6px 10px 0 38px;font-size:12px;color:var(--text-3)}
.more-replies:hover{color:var(--text)}
.tacts{display:flex;gap:4px;padding:8px 8px 8px 36px}
.tacts .sp{flex:1}
.reply{margin:0 8px 8px 36px;border-radius:8px;background:var(--fill-2);box-shadow:inset 0 0 0 .5px var(--sep-strong);animation:rise .2s var(--ease) both}
.reply textarea{width:100%;min-height:36px;display:block;resize:none;border:0;outline:0;background:none;color:var(--text);font:12.5px/18px var(--sans);padding:8px 10px 0}
.filter{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--fill-2)}
.filter button{height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;color:var(--text-3)}
.filter button.on{background:var(--raised);color:var(--text);box-shadow:var(--row-shadow)}
.compose{margin:6px 12px 0;width:calc(100% - 24px);height:36px;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--fill-2);color:var(--text-4);font-size:12.5px}
.compose:hover{background:var(--fill-3)}

/* ── list tabs: fixed-height rows, map onto uniform_list ── */
.list{margin:0 10px;border-radius:12px;background:var(--surface);box-shadow:var(--row-shadow);overflow:hidden}
.lr{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;font-size:12.5px;color:var(--text-2);min-width:0}
.lr+.lr{border-top:.5px solid var(--hairline)}
.lr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .mt{font:11.5px var(--mono);color:var(--text-4);white-space:nowrap}
.lr.btnrow:hover{background:var(--fill-1)}
.lr.bad .nm{color:var(--failed-text);font-weight:500}
.lr .acts{display:flex;gap:4px;opacity:1}
.lsum{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 8px;font-size:12px;color:var(--text-3)}
.lsum b{font-weight:500}
.path{display:flex;min-width:0;font:12px var(--mono)}
.path .d{color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.path .f{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:40%}
.cm{display:flex;align-items:center;gap:3px;font:11px var(--mono);color:var(--text-3)}
.sha{font:11.5px var(--mono);color:var(--text-3)}
.dotl{width:13px;display:grid;place-items:center}
.dotl i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--text-3)}

/* ── merge footer for list tabs ── */
.gate{margin:12px 10px 0;padding:10px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--row-shadow);display:flex;flex-direction:column;gap:6px}
.gl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);min-height:22px}
.gl .g{width:13px;display:grid;place-items:center}

/* ── popovers, anchored to their trigger ── */
.pop{position:absolute;z-index:30;min-width:220px;padding:5px;border-radius:11px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 0 0 .5px var(--glass-ring),var(--shadow);transform-origin:var(--o,top left);animation:pop .16s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.mi{height:30px;width:100%;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:7px;font-size:12.5px;color:var(--text)}
.mi:hover{background:var(--fill-3)}
.mi .sp{flex:1}
.msep{height:.5px;background:var(--sep-strong);margin:4px 6px}
.mh{padding:6px 8px 4px;font-size:11px;font-weight:600;color:var(--text-3)}
.mrow{display:flex;align-items:center;gap:8px;padding:0 8px;height:26px;font-size:12.5px;color:var(--text-2)}
.mrow .g{width:13px;display:grid;place-items:center}

/* ── toast ── */
#toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:40;height:38px;border-radius:10px;padding:0 6px 0 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;
  background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0 0 .5px var(--glass-ring),var(--shadow);
  transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .3s var(--ease),opacity .2s}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#undo[hidden]{display:none}
#toast .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── empty ── */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 16px 40px;text-align:center}
.empty .bd{width:40px;height:40px;border-radius:50%;background:var(--fill-2);display:grid;place-items:center;color:var(--text-2);margin-bottom:8px}
.empty b{font-size:13.5px}
.empty .br{font:11.5px var(--mono);color:var(--text-3)}
.empty .sub{font-size:12px;color:var(--text-3)}

/* ── “needs new data” overlay ── */
body.newdata [data-new]{outline:1px dashed var(--waiting);outline-offset:2px;border-radius:6px;position:relative}
body.newdata [data-new]::after{content:attr(data-new);position:absolute;right:0;top:-9px;z-index:9;padding:0 4px;border-radius:3px;background:var(--waiting);color:#121212;font:600 9.5px/14px var(--mono);white-space:nowrap;pointer-events:none}

/* ── demo bar ── */
#demo{position:absolute;left:24px;right:24px;bottom:18px;height:40px;display:flex;align-items:center;gap:6px;font-size:12.5px}
#demo button{height:30px;padding:0 11px;border-radius:8px;background:rgba(255,255,255,.08);color:#ebebeb}
#demo button:hover{background:rgba(255,255,255,.14)}
#demo button:active{transform:scale(.97)}
#demo button.on{background:#ebebeb;color:#121212}
:root.light #demo button{background:rgba(17,17,19,.08);color:#111113}
:root.light #demo button.on{background:#111113;color:#fff}
#demo .sp{flex:1}

@media (prefers-reduced-motion:reduce){
  .pane.enter,.fresh,.reply{animation:fadeOnly .15s ease both}
  @keyframes fadeOnly{from{opacity:0}to{opacity:1}}
  .pop{animation:fadeOnly .12s ease both}
  .fold,.sec-h .chev,#toast{transition:opacity .15s ease}
  #toast{transform:none}
}
@media (prefers-reduced-transparency:reduce){
  .tabs.stuck,.pop,#toast{background:var(--raised);backdrop-filter:none;-webkit-backdrop-filter:none}
}

<body>
<div id="win">
  <div id="log"><div class="lh"><b>What the app runs</b><span>Every action in the panel, as the call it makes and what the state does around it. <i class="old">exists</i> is in <code>github.rs</code> today; <i class="new">new</i> is to build.</span></div><div class="entries"></div></div>

</div>

<script>
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const q=new URLSearchParams(location.hash.slice(1));
/* the self-test runs every delay at 2% speed */
const SPEED=q.has('selftest')?.02:1;

/* ── icons ── */
const P={
  pr:'<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="12.5" r="1.6"/><path d="M4 5.1v5.8M12 10.9V6.5a2 2 0 0 0-2-2H7.5M9 3l-1.5 1.5L9 6"/>',
  merge:'<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="8" r="1.6"/><path d="M4 5.1v5.8M4 5.5c0 2 1.5 2.5 3 2.5h3.4"/>',
  branch:'<circle cx="4.5" cy="12.5" r="1.6"/><circle cx="4.5" cy="3.5" r="1.6"/><circle cx="11.5" cy="5" r="1.6"/><path d="M4.5 5.1v5.8M11.5 6.6c0 3-7 2-7 4.3"/>',
  check:'<path d="M3.5 8.5l3 3 6-7"/>',x:'<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  warn:'<path d="M8 2.5l6 10.5H2z"/><path d="M8 6.5v3M8 11.3v.2"/>',clock:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.3"/>',
  ext:'<path d="M9 3h4v4M13 3L7.5 8.5M11 9.5V13H3V5h3.5"/>',down:'<path d="M4.5 6.5L8 10l3.5-3.5"/>',right:'<path d="M6.5 4.5L10 8l-3.5 3.5"/>',
  plus:'<path d="M8 3.5v9M3.5 8h9"/>',chat:'<path d="M3 3.5h10v7H8l-3 2.5v-2.5H3z"/>',commit:'<circle cx="8" cy="8" r="2.4"/><path d="M1.5 8h4.1M10.4 8h4.1"/>',
  clip:'<rect x="3.5" y="3" width="9" height="10.5" rx="1.5"/><path d="M6 3V2h4v1M6 8.5l1.5 1.5L10.5 7"/>',
  file:'<path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3"/>',
  dots:'<path d="M4 8h.01M8 8h.01M12 8h.01" stroke-width="2.2"/>',bot:'<rect x="3" y="5.5" width="10" height="7" rx="2"/><path d="M8 3v2.5M6 9h.01M10 9h.01" stroke-width="1.6"/>',
  sessions:'<rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M5 6.5h6M5 9.5h4"/>',files:'<path d="M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z"/>',
  sync:'<path d="M13 8a5 5 0 0 1-8.6 3.5M3 8a5 5 0 0 1 8.6-3.5"/><path d="M11.8 2v2.7H9.1M4.2 14v-2.7h2.7"/>',
  reply:'<path d="M6.5 4L3 7.5 6.5 11M3 7.5h6.5a3.5 3.5 0 0 1 3.5 3.5v1"/>',trash:'<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/>',
  link:'<path d="M7 9a2.5 2.5 0 0 0 3.5 0l2-2A2.5 2.5 0 0 0 9 3.5l-.7.7M9 7a2.5 2.5 0 0 0-3.5 0l-2 2A2.5 2.5 0 0 0 7 12.5l.7-.7"/>',
  quote:'<path d="M3 4.5h10M3 8h7M3 11.5h8"/>',
};
const I=(n,s=14,c='currentColor',w=1.4)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const GH=s=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="currentColor"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.4c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.3.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.5 7.5 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.5.8.5 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg>`;
const SPIN=(s=12,c='var(--waiting)')=>`<svg class="spin" width="${s}" height="${s}" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="${c}" stroke-opacity=".25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
$('#gh').innerHTML=I('ext',14);$('#sync').innerHTML=I('sync',14);
const HUE={mingo:16,mira:200,kai:280,'review-bot':0,claude:20};
function av(who,v){
  const bot=who.endsWith('-bot'),badge=v?`<span class="v ${v}">${I(v==='ok'?'check':v==='no'?'x':'clock',8,'#fff',2.2)}</span>`:'';
  if(bot)return `<span class="av bot">${I('bot',13)}${badge}</span>`;
  return `<span class="av" style="background:hsl(${HUE[who]??120} 45% 42%)">${who[0].toUpperCase()}${badge}</span>`;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,one)=>n===1?`1 ${one}`:`${n} ${one}s`;
function ago(at){const s=(Date.now()-at)/1000;return s<45?'now':s<3600?Math.round(s/60)+'m':s<86400?Math.round(s/3600)+'h':Math.round(s/86400)+'d'}
/* paragraphs, `code` and > quotes: what comment bodies need here */
function md(s){
  let out='',qt=[];const flush=()=>{if(qt.length){out+=`<blockquote>${qt.join('<br>')}</blockquote>`;qt=[]}};
  for(const l of esc(s).split('\n')){if(/^&gt; ?/.test(l)){qt.push(l.replace(/^&gt; ?/,''));continue}flush();if(l.trim())out+=`<p>${l}</p>`}
  flush();return out.replace(/`([^`]+)`/g,'<code>$1</code>');
}

/* ── the PR ── */
const AGENT='Claude',ME='mingo',MIN=60e3,HR=60*MIN;
const PR={number:283,title:'The sidebar shows one machine at a time as a space',base:'main',head:'mingo/spaces',add:412,del:138,author:'mingo',opened:'Nov 17',
  url:'https://github.com/acme/anywhere/pull/283',labels:[['enhancement','#3e9cff'],['desktop','#a78bfa']]};
const CHECKS=[['build (macos-15)','4m 12s'],['clippy','2m 03s'],['test (workspace)','6m 40s'],['ios / TestFlight','11m 02s'],['lint web','38s'],['Vercel – blog','skipped']];
const COMMITS=[['Spaces swipe between machines','b41c9e2','mingo','2h'],['A space keeps its scroll per machine','7a0d31f','mingo','3h'],['The rail shows the space’s machine','e2c4a90','claude','5h'],['Sidebar keys sessions by host','91fd0b3','mingo','1d']];
const FILES=[['crates/pocket/src/','spaces.rs',214,22,2],['crates/pocket/src/sidebar/','panel.rs',96,61,0],['crates/pocket/src/sidebar/','rail.rs',58,40,1],['crates/hosts/src/','hosts.rs',31,9,0],['docs/adr/','0003-desktop-code-layout.md',13,6,0]];

/* Shaped like what gh returns: `gh pr view --json comments,reviews` and the THREADS query,
   each thread comment carrying pullRequestReview{id} so it nests under its review. */
let uid=0,store;
function seed(st){
  const done=st==='ready'||st==='merged',t=Date.now();
  const c=(author,body,before,hunk='')=>({id:'PRRC_'+(++uid),author,body,at:t-before,hunk});
  const fix=c('claude','Fixed in `b41c9e2`: an empty space now says “No sessions on mira-mbp” with New session.',2*MIN);
  return {
    reviews:[
      {id:'PRR_1',author:'review-bot',state:'COMMENTED',body:'One note on the empty state; the rest reads well.',at:t-26*HR},
      {id:'PRR_2',author:'mira',state:done?'APPROVED':'COMMENTED',body:done?'Swipes feel right now. Ship it.':'',at:t-20*HR},
    ],
    comments:[{id:'IC_1',author:'kai',body:'Does a space remember which session was open, or only the scroll?',at:t-HR}],
    threads:[
      {id:'PRRT_1',review:'PRR_1',path:'crates/pocket/src/spaces.rs',line:42,outdated:false,resolved:done,
        comments:[c('review-bot','An empty space draws the same blank as a loading one. Say it has no sessions, and offer New session.',26*HR,
          '@@ -40,6 +40,7 @@\n     let host = self.spaces.current();\n     let rows = host.sessions(&self.store);\n+    if rows.is_empty() { return self.no_sessions(host, cx); }'),...(done?[fix]:[])]},
      {id:'PRRT_2',review:'PRR_1',path:'crates/pocket/src/sidebar/rail.rs',line:88,outdated:true,resolved:true,
        comments:[c('review-bot','The badge sits on the icon’s edge at 32px and clips.',26*HR,'@@ -86,3 +87,3 @@\n     let badge = ui::dot(6., FAILED)\n-        .top(px(3.)).right(px(3.));\n+        .top(px(5.)).right(px(5.));'),c('mingo','Moved it in by 2px.',22*HR)]},
      {id:'PRRT_3',review:'PRR_2',path:'crates/pocket/src/spaces.rs',line:118,outdated:false,resolved:done,
        comments:[c('mira','Should a swipe past the last space wrap to the first?',20*HR,'@@ -116,5 +116,6 @@\n     fn swipe(&mut self, dx: f32) {\n         let next = self.at + dx.signum() as isize;\n+        let next = next.clamp(0, self.len() - 1);'),
          c('mingo','I left it stopping: wrapping hides how many there are.',19*HR),c('mira','Fair, but then rubber-band it so the stop reads as a stop.',18*HR),
          c('mingo','Will do.',17*HR),c('mira','Still a hard stop on the build I tried.',3*HR),...(done?[c('claude','Rubber-bands past the ends now (`rubberband` in `glide.rs`).',2*MIN)]:[])]},
    ],
    events:[{key:'push1',who:'mingo',text:'pushed 3 commits',at:t-30*HR},...(done?[{key:'push2',who:'claude',text:'pushed <code>b41c9e2</code>',at:t-3*MIN}]:[])],
    sent:new Set(st==='fixing'?['PRRT_1','PRRT_3']:[]),checkSent:st==='fixing',checksFixed:done,
  };
}
const thread=id=>store.threads.find(t=>t.id===id);
/* Thread::state: resolved, then handed to an agent since the last push, then answered by someone else */
function tstate(t){
  const first=t.comments[0]?.author,last=t.comments.at(-1)?.author;
  return t.resolved?'Resolved':store.sent.has(t.id)?'Sent':last!==first?'Replied':'Open';
}
const spot=t=>`${t.path.split('/').pop()}:${t.line}`;
const toFix=()=>store.threads.filter(t=>tstate(t)==='Open');
function commentCount(){return store.comments.length+store.reviews.filter(r=>r.body).length+store.threads.reduce((n,t)=>n+t.comments.length,0)}

const S={state:'failed',tab:'conv',descOpen:true,convOpen:true,all:false,menu:null,method:'Squash and merge',deleteAfter:true,busy:null,
  replying:null,composing:false,drafts:{},err:{},expanded:new Set(),failNext:false,wantFocus:null};
const STATES={ready:'Ready',failed:'Checks failed',fixing:`${AGENT} fixing`,conflicts:'Conflicts',draft:'Draft',merged:'Merged',none:'No PR'};

function model(){
  const st=S.state,m={...PR};
  const failing=(st==='failed'||st==='fixing')&&!store.checksFixed;
  m.checks=CHECKS.map(([n,d])=>({name:n,d,o:d==='skipped'?'skipped':'passed'}));
  if(failing)m.checks[2].o='failed';
  if(st==='draft')m.checks[3].o='pending';
  const mira=store.reviews.find(r=>r.author==='mira');
  m.reviews=[{who:'mira',v:mira.state==='APPROVED'?'ok':'wait'},{who:'review-bot',v:null},{who:'kai',v:'wait'}];
  m.failed=m.checks.filter(c=>c.o==='failed').length;m.pending=m.checks.filter(c=>c.o==='pending').length;
  m.fixing=store.sent.size+(store.checkSent?1:0);
  m.toFix=(store.checkSent?0:m.failed)+toFix().length;
  m.chip=m.fixing?['waiting','spin',`Fixing ${plural(m.fixing,'item')}`]:{
    ready:['success','check','Ready to merge'],failed:['failed','x',`${m.failed} check failed`],fixing:['success','check','Ready to merge'],
    conflicts:['failed','warn','Conflicts with main'],draft:['muted','pr','Draft'],merged:['merged','merge','Merged'],
  }[st];
  if(S.busy)m.chip=['waiting','spin',S.busy];
  m.gate={ready:['check','var(--success)','No conflicts with main'],failed:['dot','','Can’t merge until checks pass'],fixing:['dot','','Can’t merge until checks pass'],
    conflicts:['warn','var(--failed)','Conflicts with main'],draft:['dot','','Drafts can’t be merged'],merged:['merge','var(--merged)','Merged by mingo · 2m ago']}[st];
  return m;
}
const CHIP={success:['var(--success-bg)','var(--success-text)'],failed:['var(--failed-bg)','var(--failed-text)'],waiting:['var(--waiting-bg)','var(--waiting-text)'],
  muted:['var(--fill-3)','var(--text-2)'],merged:['var(--merged-bg)','var(--merged-text)']};

/* ── render: full only on a state switch; actions update the parts they touch, so drafts, scroll and stuck tabs survive ── */
let seen=new Set(),bannerShown=false;
function render(){
  document.querySelectorAll('#states button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.state));
  renderRail();
  if(S.state==='none'){$('#content').innerHTML=emptyView();return}
  $('#content').innerHTML='<div id="top"></div><nav id="tabs"></nav><div id="body"></div>';
  seen=new Set();bannerShown=false;
  update();
}
function update(enterDx=null){
  if(S.state==='none')return;
  const m=model();
  const b=banner(m);
  $('#top').innerHTML=hero(m)+(b&&!bannerShown?b.replace('class="banner"','class="banner fresh"'):b);
  bannerShown=!!b;
  $('#tabs').outerHTML=tabs(m);
  const t=$('#tabs');t.classList.toggle('stuck',$('#scroll').scrollTop>=t.offsetTop-1);
  placeIndicator(false);
  renderBody(m,enterDx);
  renderRail();
}
function renderBody(m,enterDx){
  const a=document.activeElement,keep=a?.dataset?.draft,caret=keep?a.selectionStart:0;
  $('#body').innerHTML=pane(m,enterDx);
  for(const ta of document.querySelectorAll('textarea[data-draft]')){ta.value=S.drafts[ta.dataset.draft]||'';grow(ta)}
  const f=S.wantFocus||keep,el=f&&document.querySelector(`textarea[data-draft="${f}"]`);
  if(el){el.focus();const p=S.wantFocus?el.value.length:caret;el.setSelectionRange(p,p);if(S.wantFocus)el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})}
  S.wantFocus=null;
  markSeen();
}
const fresh=key=>seen.size&&!seen.has(key)?' fresh':'';
function markSeen(){
  for(const x of [...store.reviews,...store.comments,...store.events.map(e=>({id:e.key}))])seen.add(x.id);
  for(const t of store.threads){seen.add(t.id);for(const c of t.comments)seen.add(c.id)}
}
function grow(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px'}

function hero(m){
  const [tone,ic,text]=m.chip,[bg,fg]=CHIP[tone];
  const glyph=ic==='spin'?SPIN(12,fg):I(ic,13,'currentColor',ic==='check'||ic==='x'?2:1.5);
  return `<section class="hero">
    <h1 class="title">${m.title} <span class="num">#${m.number}</span></h1>
    <div class="state">
      <button class="chip" id="chip" style="--c-bg:${bg};--c-fg:${fg}">${glyph}<span class="lb">${text}</span><span class="dn">${I('down',12)}</span></button>
      <span class="sp"></span>${action(m)}
    </div>
    <div class="branches" data-new="additions,deletions"><span class="b">${I('branch',13,'var(--text-4)')}<span>${m.base}</span></span><span class="ar">←</span>
      <span class="b">${I('branch',13,'var(--text-4)')}<span>${m.head}</span></span><span class="add">+${m.add}</span><span class="del">−${m.del}</span></div>
    <div class="people"><span class="by" data-new="author,createdAt">${av(m.author)}<span><b>${m.author}</b> opened ${m.opened}</span></span><span class="vr"></span>
      <span class="revs">${m.reviews.map(r=>av(r.who,r.v)).join('')}</span><button class="plus" title="Request a review" data-new="write: reviewers">${I('plus',13)}</button></div>

function hunkTail(h,n=3){
  let nl=0;const out=[];
  for(const l of h.split('\n')){if(l.startsWith('@@')){nl=+(l.match(/\+(\d+)/)?.[1]??1)-1;continue}const k=l[0];if(k!=='-')nl++;out.push([k==='-'?'':nl,k,l.slice(1)])}
  return out.slice(-n);
}
/* the replies a long thread folds: all between its opening and its last two, once that is at least two */
function folded(n,whole){const hidden=n-1-2;return !whole&&hidden>=2?[1,1+hidden]:null}

function threadCard(t){

/* ── tab indicator: a critically damped spring that retargets from where it is, carrying its velocity ── */
const ind={x:0,w:0,vx:0,vw:0,tx:0,tw:0,raf:0};
function placeIndicator(animate){
  const tabsEl=$('#tabs'),on=tabsEl?.querySelector('.tab.on');if(!on)return;
  ind.tx=on.offsetLeft;ind.tw=on.offsetWidth;
  if(!animate||reduce){if(!ind.raf){ind.x=ind.tx;ind.w=ind.tw;ind.vx=ind.vw=0}paint();return}
  if(!ind.raf){let last=performance.now();const step=t=>{const dt=Math.min((t-last)/1000,1/30);last=t;
    const k=(2*Math.PI/.3)**2,c=4*Math.PI*1/.3; // response .3s, damping 1
    ind.vx+=(-k*(ind.x-ind.tx)-c*ind.vx)*dt;ind.x+=ind.vx*dt;ind.vw+=(-k*(ind.w-ind.tw)-c*ind.vw)*dt;ind.w+=ind.vw*dt;paint();
    if(Math.abs(ind.x-ind.tx)+Math.abs(ind.w-ind.tw)<.3&&Math.abs(ind.vx)+Math.abs(ind.vw)<3){ind.x=ind.tx;ind.w=ind.tw;paint();ind.raf=0;return}
    ind.raf=requestAnimationFrame(step)};ind.raf=requestAnimationFrame(step)}
}
function paint(){const e=$('#ind');if(e){e.style.transform=`translateX(${ind.x}px)`;e.style.width=ind.w+'px'}}

const ORDER=['conv','checks','commits','files'];

/* ── what the app runs: one entry per action, its gh call, and what the state does around it ── */
const Q={REPLY:'REPLY',RESOLVE:'RESOLVE',UNRESOLVE:'UNRESOLVE'};
function log(what,argv,kind,fx){
  const e=document.createElement('div');e.className='le fresh';
  e.innerHTML=`<div class="h"><span class="what">${what}</span><span class="kind ${kind.startsWith('new')?'new':'old'}">${kind}</span><span class="sp"></span><span class="res">${argv.startsWith('gh')?SPIN(11,'var(--text-3)'):''}</span></div><code>${esc(argv)}</code>${fx?`<div class="fx">${fx}</div>`:''}`;
  $('#log .entries').append(e);$('#log').scrollTop=$('#log').scrollHeight;
  if(!argv.startsWith('gh'))done(e,true,'local');
  return e;
}
function done(e,ok,text){e.querySelector('.res').innerHTML=ok?`<span style="color:var(--success-text)">${text||'ok'}</span>`:`<span style="color:var(--failed-text)">${text}</span>`}
/* Runs a write: the state already shows it; `fail` puts things back the way the app does. */
function write(what,argv,kind,fx,{ok,fail}){
  const e=log(what,argv,kind,fx),failing=S.failNext;
  S.failNext=false;$('#failnext').classList.remove('on');
  setTimeout(()=>{
    if(failing){const msg='HTTP 502: Server Error';done(e,false,msg);fail(msg)}else{done(e,true);ok?.()}
    update();
  },700*SPEED);
}

function agentFixes(id){

  t.comments.push({id:'PRRC_'+(++uid),author:'claude',body:id==='PRRT_3'?'Rubber-bands past the ends now (`rubberband` in `glide.rs`).':'Fixed in `b41c9e2`: an empty space now says “No sessions on mira-mbp” with New session.',at:Date.now(),hunk:''});
  t.resolved=true;store.sent.delete(id);
  if(!store.events.some(e=>e.key==='push2'))store.events.push({key:'push2',who:'claude',text:'pushed <code>b41c9e2</code>',at:Date.now()-1});
}
function sendThreads(ids){
  ids.forEach(id=>store.sent.add(id));
  log(`Send ${ids.length>1?plural(ids.length,'comment'):spot(thread(ids[0]))} to ${AGENT}`,`send_to_agent(fix_prompt(pr, &[], &[${ids.join(', ')}]))`,'exists',
    'Track.send: thread → Sent (“Fixing”) until the PR shows it resolved or the head moves');
  toast(`Sent ${plural(ids.length,'comment')} to ${AGENT}`);update();
  setTimeout(()=>{
    ids.forEach(agentFixes);
    done(log('Poll picks up the fix',FETCH[1][1],'exists','Claude replied and resolved; Track.fixing drops what the PR shows resolved'),true);
    update();toast(`${AGENT} resolved ${plural(ids.length,'comment')}`);
  },3500*SPEED);
}
const ACT={
  fix(){
    const open=toFix().map(t=>t.id);open.forEach(id=>store.sent.add(id));store.checkSent=true;S.state='fixing';
    log(`Send all to ${AGENT}`,`send_to_agent(fix_prompt(pr, &[test (workspace)], &[${open.join(', ')}]))`,'exists','the check and every open thread go in one prompt');
    toast(`Sent ${plural(open.length+1,'item')} to ${AGENT}`);update();
    timer=setTimeout(()=>{open.forEach(agentFixes);store.checkSent=false;store.checksFixed=true;S.state='ready';update();toast('Checks passed · comments resolved')},4500*SPEED);
  },
  'send-thread'(id){sendThreads([id])},
  'send-open'(){sendThreads(toFix().map(t=>t.id))},
  resolve(){S.state='fixing';update();toast(`${AGENT} is resolving the conflict`);timer=setTimeout(()=>{S.state='ready';update()},3500*SPEED)},
  ready(){S.state='ready';update();toast('Marked ready for review')},
  merge(){S.busy='Merging…';update();timer=setTimeout(()=>{S.busy=null;S.state='merged';update();toast('Merged PR #283 into main')},1300*SPEED)},
  delete(){S.state='none';render();toast('Deleted the worktree mingo/spaces')},
  keep(){toast('Kept the worktree');document.querySelector('.banner')?.remove()},
  create(){S.state='draft';S.tab='conv';render()},
  delafter(){S.deleteAfter=!S.deleteAfter;openMenu('merge',$('#mmore'))},
  gh(){closeMenu();toast('Opens github.com/…/pull/283')},
  'open-file'(){toast('Opens the file’s diff in the main pane')},

  reply(id){S.replying=id;delete S.err[id];S.wantFocus='r:'+id;update()},
  'cancel-reply'(id){S.replying=null;delete S.drafts['r:'+id];delete S.err[id];update()},
  'send-reply'(id){
    const key='r:'+id,body=(S.drafts[key]||'').trim(),t=thread(id);if(!body)return;
    const c={id:'PRRC_'+(++uid),author:ME,body,at:Date.now(),hunk:'',pending:true};
    t.comments.push(c);S.replying=null;delete S.drafts[key];delete S.err[id];update();
    write(`Reply on ${spot(t)}`,`gh api graphql -f id=${id} -f body=${body.replace(/\n/g,'\\n')} -f query=REPLY`,'exists',
      'optimistic: the reply shows at once · error: it goes, its text returns to the box, and the PR re-polls',{
      ok(){c.pending=false},
      fail(msg){t.comments.splice(t.comments.indexOf(c),1);S.replying=id;S.drafts[key]=body;S.err[id]=`Couldn’t post the reply: ${msg}`;S.wantFocus=key},
    });
  },
  'toggle-resolve'(id,undo=true){
    const t=thread(id),to=!t.resolved;
    t.resolved=to;S.expanded.delete(id);update();
    if(undo)toast(to?'Resolved the conversation':'Reopened the conversation',()=>ACT['toggle-resolve'](id,false));
    write(`${to?'Resolve':'Reopen'} ${spot(t)}`,`gh api graphql -f id=${id} -f query=${to?Q.RESOLVE:Q.UNRESOLVE}`,'exists',
      'optimistic, with Undo · error: flips back',{
      fail(msg){t.resolved=!to;toast(`Couldn’t ${to?'resolve':'reopen'} the conversation: ${msg}`)},
    });
  },
  expand(id){S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id);update()},
  view(id){const t=thread(id);toast(t.outdated?'Outdated: its line has moved, so it stays here':`Opens ${spot(t)} in the PR diff`)},

  compose(){S.composing=true;S.wantFocus='new';if(S.tab!=='conv'){S.tab='conv';update(8)}else update()},
  'cancel-compose'(){S.composing=false;delete S.drafts.new;delete S.err.new;update()},
  'send-comment'(){
    const body=(S.drafts.new||'').trim();if(!body)return;
    const c={id:'IC_'+(++uid),author:ME,body,at:Date.now(),pending:true};
    store.comments.push(c);S.composing=false;delete S.drafts.new;delete S.err.new;update();
    document.querySelector(`[data-key="${c.id}"]`)?.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
    write('Comment on #283','gh pr comment 283 --body-file -','new',
      'body on stdin · optimistic card “Sending…” · error: card goes, text returns to the composer',{
      ok(){c.pending=false},
      fail(msg){store.comments.splice(store.comments.indexOf(c),1);S.composing=true;S.drafts.new=body;S.err.new=`Couldn’t post the comment: ${msg}`;S.wantFocus='new'},
    });
  },
  quote(id){
    const src=[...store.comments,...store.reviews].find(x=>x.id===id);closeMenu();
    const quoted=src.body.split('\n').map(l=>'> '+l).join('\n')+'\n\n';
    S.drafts.new=(S.drafts.new?S.drafts.new.trimEnd()+'\n\n':'')+quoted;S.composing=true;S.wantFocus='new';update();
    log('Quote reply','(no call) fills the composer','new','GitHub has no replies on top-level comments; quoting is how its web UI answers one');
  },
  copy(id){closeMenu();const url=`${PR.url}#issuecomment-${id}`;navigator.clipboard?.writeText(url).catch(()=>{});toast('Copied the link');log('Copy link',url,'new fields','from the comment’s url field')},
  menu(id,el){S.menu==='comment'+id?closeMenu():openMenu('comment',el,id)},
};

/* someone else comments: what a poll brings in */
function incoming(){
  const t=thread('PRRT_1');
  if(t&&!t.resolved){t.comments.push({id:'PRRC_'+(++uid),author:'kai',body:'+1, the blank had me waiting for a spinner too.',at:Date.now(),hunk:''})}
  else store.comments.push({id:'IC_'+(++uid),author:'mira',body:'Tried the build: the empty state reads right.',at:Date.now()});
  done(log('Poll: a new comment',FETCH[1][1],'exists','new items rise in; open reply boxes and drafts stay as they are'),true);
  update();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(!e.target.closest('.pop')&&!e.target.closest('#chip')&&!e.target.closest('#mmore')&&!e.target.closest('[data-act="menu"]'))closeMenu();
  if(!t)return;
  if(t.dataset.s){go(t.dataset.s);return}
  if(t.dataset.tab){setTab(t.dataset.tab);return}
  if(t.dataset.fold){const k=t.dataset.fold+'Open';S[k]=!S[k];t.closest('.sec').classList.toggle('shut',!S[k]);return}
  if(t.dataset.all){S.all=t.dataset.all==='1';update();return}
  if(t.dataset.method){S.method=t.dataset.method;closeMenu();toast(`Merges with “${S.method}”`);return}
  if(t.id==='chip'){S.menu==='status'?closeMenu():openMenu('status',t);return}
  if(t.id==='mmore'){S.menu==='merge'?closeMenu():openMenu('merge',t);return}
  if(t.id==='sync'){refresh();return}
  if(t.id==='gh'){toast('Opens github.com/…/pull/283');return}
  if(t.dataset.act&&ACT[t.dataset.act])ACT[t.dataset.act](t.dataset.id,t);
});
document.addEventListener('input',e=>{const k=e.target.dataset?.draft;if(k){S.drafts[k]=e.target.value;grow(e.target)}});
addEventListener('keydown',e=>{
  const k=e.target.dataset?.draft;
  if(k){
    const id=k.slice(2);
    if(e.key==='Enter'&&e.metaKey){e.preventDefault();k==='new'?ACT['send-comment']():ACT['send-reply'](id)}
    if(e.key==='Escape'){k==='new'?ACT['cancel-compose']():ACT['cancel-reply'](id)}
    return;
  }
  if(e.key==='Escape')closeMenu();
  if(e.metaKey&&e.key==='r'){e.preventDefault();refresh();return}
  const i='1234'.indexOf(e.key);if(i>=0)setTab(ORDER[i]);
});

/* ── refresh: spins while gh is asked; the click never waits on the 2s git poll ── */
let synced=Date.now();
function refresh(){
  const b=$('#sync');if(b.classList.contains('busy'))return;
  b.classList.add('busy');
  const es=FETCH.map(f=>log(...f));
  setTimeout(()=>{es.forEach(e=>done(e,true));b.classList.remove('busy');synced=Date.now();update();toast('Up to date with GitHub')},900*SPEED);
}
setInterval(()=>{const s=Math.round((Date.now()-synced)/1000);$('#sync').title=`Refresh (⌘R) · updated ${s<5?'just now':s<60?s+'s ago':Math.round(s/60)+'m ago'}`},1000);

/* sticky tabs turn to glass once content scrolls under them */
$('#scroll').addEventListener('scroll',()=>{const t=$('#tabs');if(t)t.classList.toggle('stuck',$('#scroll').scrollTop>=t.offsetTop-1);closeMenu()},{passive:true});

/* panel edge: drag 1:1 from where it was grabbed, clamped like the app (280–600) */
(()=>{const edge=$('#edge'),panel=$('#panel');let x0,w0;
  edge.addEventListener('pointerdown',e=>{edge.setPointerCapture(e.pointerId);x0=e.clientX;w0=panel.offsetWidth;edge.classList.add('drag')});
  edge.addEventListener('pointermove',e=>{if(!edge.hasPointerCapture(e.pointerId))return;panel.style.width=Math.max(280,Math.min(600,w0+x0-e.clientX))+'px';placeIndicator(false)});
  edge.addEventListener('pointerup',()=>edge.classList.remove('drag'));
  edge.addEventListener('dblclick',()=>{panel.style.width='334px';placeIndicator(false)});
})();

$('#states').innerHTML=Object.entries(STATES).map(([k,l])=>`<button data-s="${k}">${l}</button>`).join(' ');
$('#incoming').onclick=incoming;
$('#failnext').onclick=e=>{S.failNext=!S.failNext;e.currentTarget.classList.toggle('on',S.failNext)};
$('#newdata').onclick=e=>{document.body.classList.toggle('newdata');e.target.classList.toggle('on')};
$('#theme').onclick=()=>document.documentElement.classList.toggle('light');
if(q.get('state'))S.state=q.get('state');if(q.get('tab'))S.tab=q.get('tab');if(q.has('light'))document.documentElement.classList.add('light');
if(q.has('newdata'))document.body.classList.add('newdata');
store=seed(S.state);
render();
FETCH.forEach(f=>done(log(...f),true));
if(q.get('scroll'))$('#scroll').scrollTop=+q.get('scroll');

/* ── #selftest: drives the comments flow with real clicks and checks the store and the DOM ── */
if(q.has('selftest'))(async()=>{
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const settle=()=>wait(60);
  const click=sel=>{const el=typeof sel==='string'?document.querySelector(sel):sel;if(!el)throw new Error('missing '+sel);el.click()};
  const type=(key,text)=>{const ta=document.querySelector(`textarea[data-draft="${key}"]`);if(!ta)throw new Error('no box '+key);ta.value=text;ta.dispatchEvent(new Event('input',{bubbles:true}))};
  const res=[];const ok=(name,cond)=>res.push(`${cond?'PASS':'FAIL'} ${name}`);
  const visible=id=>!!document.querySelector(`[data-thread="${id}"]`);
  const T=id=>`[data-thread="${id}"]`;
  try{
    ok('opens on 2 unresolved threads, the resolved one hidden',visible('PRRT_1')&&visible('PRRT_3')&&!visible('PRRT_2'));
    ok('a long thread folds its middle replies',$(`${T('PRRT_3')} .more-replies`)?.textContent==='Show 2 more replies');
    click(`${T('PRRT_3')} .more-replies`);await settle();
    ok('Show more replies unfolds every reply',document.querySelectorAll(`${T('PRRT_3')} .rp`).length===5);
    const n0=commentCount();
    click(`${T('PRRT_1')} [data-act="reply"]`);await settle();
    ok('Reply opens a box addressed to the thread’s author',document.querySelector('textarea[data-draft="r:PRRT_1"]')?.placeholder==='Reply to review-bot…'&&document.activeElement?.dataset.draft==='r:PRRT_1');
    type('r:PRRT_1','On it.');incoming();await settle();
    ok('a poll keeps the draft in the open box',document.querySelector('textarea[data-draft="r:PRRT_1"]')?.value==='On it.');
    click(`${T('PRRT_1')} [data-act="send-reply"]`);
    ok('the reply shows at once as Sending…',thread('PRRT_1').comments.at(-1).pending===true&&!!$(`${T('PRRT_1')} .rp.pending`));
    await wait(80);
    ok('the reply posts, and the thread reads Replied',!thread('PRRT_1').comments.at(-1).pending&&tstate(thread('PRRT_1'))==='Replied'&&!!$(`${T('PRRT_1')} .pill.rep`));
    S.failNext=true;click(`${T('PRRT_1')} [data-act="reply"]`);await settle();type('r:PRRT_1','Second try');click(`${T('PRRT_1')} [data-act="send-reply"]`);await wait(100);
    ok('a failed reply comes back to the box with the error',document.querySelector('textarea[data-draft="r:PRRT_1"]')?.value==='Second try'&&/Couldn’t post the reply/.test($(`${T('PRRT_1')} .err`)?.textContent)&&!thread('PRRT_1').comments.some(c=>c.body==='Second try'));
    click(`${T('PRRT_1')} [data-act="cancel-reply"]`);await settle();
    click(`${T('PRRT_1')} [data-act="toggle-resolve"]`);await wait(100);
    ok('Resolve hides the thread under Unresolved',thread('PRRT_1').resolved&&!visible('PRRT_1')&&$('#toast .t').textContent==='Resolved the conversation');
    click('#undo');await wait(100);
    ok('Undo reopens it',!thread('PRRT_1').resolved&&visible('PRRT_1'));
    click(`${T('PRRT_3')} [data-act="send-thread"]`);
    ok('Send to Claude marks only that thread Fixing',tstate(thread('PRRT_3'))==='Sent'&&!!$(`${T('PRRT_3')} .pill.fix`)&&!store.checkSent&&/fixing 1 item/.test($('.banner')?.textContent));
    await wait(150);
    ok('Claude’s reply resolves it and the banner goes',thread('PRRT_3').resolved&&thread('PRRT_3').comments.at(-1).author==='claude'&&!$('.banner'));
    click('[data-all="1"]');await settle();
    ok('All shows resolved threads folded to one line',!!$('.tcol[data-id="PRRT_2"]')&&!visible('PRRT_2'));
    click('.tcol[data-id="PRRT_2"]');await settle();
    ok('a folded thread opens on click, marked Outdated',visible('PRRT_2')&&!!$(`${T('PRRT_2')} .outd`));
    click('.compose');await settle();
    ok('Leave a comment opens a focused composer',document.activeElement?.dataset.draft==='new');
    type('new','Shipping after the rubber-band lands.');
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',metaKey:true,bubbles:true}));
    const mine=store.comments.at(-1);
    ok('⌘↵ posts it as a Sending… card',mine.author===ME&&mine.pending&&!!$(`[data-key="${mine.id}"].pending`));
    await wait(80);
    ok('it lands, and the tab counts it',!mine.pending&&+$('#convn').textContent===commentCount()&&commentCount()>n0);
    S.failNext=true;click('.compose');await settle();type('new','Will it post?');click('[data-act="send-comment"]');await wait(100);
    ok('a failed comment returns to the composer',document.querySelector('textarea[data-draft="new"]')?.value==='Will it post?'&&/Couldn’t post the comment/.test($('.composer .err')?.textContent));
    click('[data-act="cancel-compose"]');await settle();
    click('[data-key="IC_1"] [data-act="quote"]');await settle();
    ok('Quote reply fills the composer with the quote',document.querySelector('textarea[data-draft="new"]')?.value.startsWith('> Does a space remember'));
    click('[data-key="IC_1"] [data-act="menu"]');await settle();
    ok('··· offers Copy link and Quote reply',[...document.querySelectorAll('.pop .mi')].map(b=>b.textContent.trim()).join('|')==='Copy link|Quote reply');
  }catch(err){res.push('FAIL threw: '+err.message)}
  const fails=res.filter(r=>r.startsWith('FAIL')).length;
  const out=document.createElement('pre');out.id='selftest';out.style.cssText='position:fixed;left:24px;top:24px;z-index:99;margin:0;padding:10px 12px;border-radius:8px;background:#000;color:#3dd68c;font:11px/16px var(--mono)';out.textContent=`${fails?'FAILED':'PASSED'} ${res.length-fails}/${res.length}\n`+res.join('\n');
  document.body.append(out);document.title=out.textContent.split('\n')[0];
})();
</script>
