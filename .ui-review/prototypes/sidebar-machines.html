<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar · projects across machines — prototype</title>
<style>
:root{
  --text:#073642;--text-2:#566c73;--text-3:#657b83;--text-4:#93a1a1;--text-5:#b0bab0;--text-6:#d1d3c6;--on-text:#fdf6e3;
  --window:#eee8d5;--surface:#fdf6e3;--page:#f9f2df;--side:#f6efdcb3;--popover:#fdf6e3;--highlight:#fffffff2;--shadow:#00000024;
  --fill-2:#0736420b;--fill-3:#0736420e;--fill-4:#07364211;--separator:#07364217;--separator-strong:#0736421f;--accent-bg:#0736421c;
  --waiting:#947000;--waiting-dot:#b58900;--success:#7a8d00;--success-text:#606e00;--failed:#dc322f;--failed-text:#c42c2a;--working:#cb4b16;--claude:#d97757;
}
:root[data-theme=graphite]{
  --text:#111113;--text-2:#6f6f78;--text-3:#8b8b94;--text-4:#a1a1aa;--text-5:#b4b4bc;--text-6:#d4d4d8;--on-text:#fff;
  --window:#f4f4f5;--surface:#fff;--page:#f7f7f7;--side:#fafafbb3;--popover:#fff;
  --fill-2:#1111130b;--fill-3:#1111130e;--fill-4:#11111311;--separator:#11111317;--separator-strong:#1111131f;--accent-bg:#1111131c;
  --waiting:#ad5700;--waiting-dot:#ffb224;--success:#2b9a66;--success-text:#18794e;--failed:#cd2b31;--failed-text:#cd2b31;--working:#cc4e00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);background:var(--window);font-size:13px;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg.i{flex:none;display:block}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
.app{display:flex;height:100vh}
.side{width:272px;flex:none;background:var(--side);border-right:.5px solid var(--separator);display:flex;flex-direction:column;padding:0 10px;position:relative;overflow:hidden}
.top{height:40px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--text-3)}
.search{height:32px;flex:none;margin:2px 0 8px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:9px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong);color:var(--text-3);font-size:13.5px}
.search kbd{margin-left:auto;font:inherit;font-size:11.5px;color:var(--text-4)}
.row{height:28px;flex:none;padding:0 6px;display:flex;align-items:center;gap:8px;border-radius:8px;font-size:13.5px;color:var(--text);white-space:nowrap;position:relative}
.row:hover{background:var(--fill-2)}
.row.on{background:var(--fill-4)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.nav{color:var(--text-2)}
.row .acts{display:none;gap:4px;color:var(--text-3)}
.row:hover .acts{display:flex}
.row:hover .meta{display:none}
.child{padding-left:32px;color:var(--text)}
.child .lead{position:absolute;left:12px;top:7px;width:14px;display:flex;justify-content:center}
.child.dim{color:var(--text-3)}
.stat{font-size:12px}.stat .a{color:var(--success-text)}.stat .d{color:var(--failed-text);margin-left:6px}
.sh{height:28px;flex:none;margin:14px 0 2px;padding:0 6px;display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
.sh span{flex:1}
.list{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:8px;margin:0 -4px;padding-left:4px;padding-right:4px}
.grp{margin-bottom:8px}
.tile{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px;font-weight:600;color:var(--text-2);background:var(--surface);box-shadow:inset 0 0 0 .5px var(--separator-strong)}
.tile.e{font-size:12px}
.dot{width:6px;height:6px;border-radius:3px;flex:none;background:var(--success)}
.dot.off{background:var(--text-5)}
.sdot{width:7px;height:7px;border-radius:4px;background:var(--working)}
.sdot.need{background:var(--waiting-dot)}
.spin{width:9px;height:9px;border-radius:5px;border:1.5px solid var(--working);border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mtag{height:18px;padding:0 6px;display:inline-flex;align-items:center;gap:4px;border-radius:5px;background:var(--fill-3);font-size:11px;color:var(--text-3);flex:none}
.mtag.off{opacity:.6}
.foot{flex:none;padding:6px 0 10px;border-top:.5px solid transparent}

/* A · spaces */
.space-head{height:34px;flex:none;margin:6px 0 0;padding:0 6px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.space-head .h{font-weight:400;font-size:12px;color:var(--text-3)}
.switcher{flex:none;display:flex;align-items:center;gap:2px;padding:6px 0 8px}
.sw{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);position:relative}
.sw:hover{background:var(--fill-2)}
.sw.on{background:var(--fill-4);color:var(--text)}
.sw .dot{position:absolute;right:5px;bottom:5px;box-shadow:0 0 0 1.5px var(--window)}
.sw .badge{position:absolute;right:2px;top:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--waiting-dot);color:#171717;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pane{animation:slide .22s cubic-bezier(.22,1,.36,1)}
.pane.l{animation-name:slidel}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes slidel{from{opacity:0;transform:translateX(-24px)}}
.empty{margin:28px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--text-3);font-size:12.5px}
.empty b{color:var(--text);font-weight:500;font-size:13px}
.btn{height:28px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:500;background:var(--fill-3);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--fill-4)}

/* B · project-first filter */
.filters{flex:none;display:flex;gap:2px;padding:0 2px 4px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.chip{height:24px;padding:0 7px;flex:none;white-space:nowrap;display:flex;align-items:center;gap:5px;border-radius:7px;font-size:12px;color:var(--text-2)}
.chip:hover{background:var(--fill-2)}
.chip.on{background:var(--fill-4);color:var(--text)}
.msub{height:24px;padding-left:32px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);font-weight:500}
.msub .ln{flex:1;height:.5px;background:var(--separator)}

/* C · machine sections */
.mh{height:30px;flex:none;margin-top:12px;padding:0 6px;display:flex;align-items:center;gap:8px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text-2)}
.mh:hover{background:var(--fill-2)}
.mh .nm{flex:1}
.mh .h{font-weight:400;color:var(--text-4)}
.mh .acts{display:none;gap:6px;color:var(--text-3)}
.mh:hover .acts{display:flex}
.mh:hover .h{display:none}
.mh .car{color:var(--text-4);transition:transform .15s}
.mh.closed .car{transform:rotate(-90deg)}
.fromhost{font-size:11px;color:var(--text-4)}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page)}
.bar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--text-3)}
.bar b{color:var(--text);font-weight:600}
.body{flex:1;padding:32px 48px;background-image:radial-gradient(var(--text-6) .9px,transparent 1px);background-size:14px 14px;overflow:auto}
.note{max-width:560px;padding:18px 20px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong),0 8px 24px #0000000d;line-height:1.55;color:var(--text-2);font-size:13px}
.note h2{font-size:15px;color:var(--text);margin-bottom:6px}
.note ul{margin:8px 0 0 18px}
.note li{margin:3px 0}
.note b{color:var(--text);font-weight:600}
.kbd{font-size:11px;padding:1px 5px;border-radius:4px;background:var(--fill-3);color:var(--text-2)}

.proto{position:fixed;right:14px;bottom:14px;display:flex;gap:4px;padding:4px;font-size:12px;color:var(--text-3);background:var(--popover);border-radius:12px;box-shadow:0 0 0 .5px var(--separator),0 18px 50px var(--shadow);z-index:9}
.proto button{padding:4px 9px;border-radius:7px}
.proto button[data-on]{background:var(--fill-4);color:var(--text)}
.proto .sep{width:.5px;background:var(--separator);margin:2px 4px}
.pm{position:absolute;left:18px;top:28px;z-index:12;width:212px;padding:5px;display:flex;flex-direction:column;gap:1px;background:var(--popover);border-radius:12px;box-shadow:0 0 0 .5px var(--separator),inset 0 1px 0 var(--highlight),0 18px 50px var(--shadow),0 2px 6px #0000000f;animation:slide .15s}
.pm .ml{padding:6px 10px 2px;font-size:11.5px;font-weight:500;color:var(--text-3)}
.pm .mp{height:30px;padding:0 10px;display:flex;align-items:center;gap:9px;border-radius:8px;font-size:13px;white-space:nowrap}
.pm .mp:hover{background:var(--fill-2)}
.pm .mp .nm{flex:1}
.pm .mp .h{font-size:11.5px;color:var(--text-4)}
.pm .mp.off{color:var(--text-4);cursor:default}.pm .mp.off:hover{background:none}
.pm .md{height:.5px;margin:4px 8px;background:var(--separator)}
.row .car{width:12px;color:var(--text-4);display:none}
.row:hover .car{display:block}
.row.closed .car{transform:rotate(-90deg)}
.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{0%{background:var(--accent-bg)}100%{background:transparent}}
.sess{max-width:560px;margin-bottom:16px;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 .5px var(--separator-strong);display:flex;align-items:center;gap:12px}
.sess .ic{width:34px;height:34px;border-radius:9px;background:var(--fill-3);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.sess b{display:block;font-size:14px}
.sess span{font-size:12px;color:var(--text-3)}
.sess.off{background:var(--fill-2)}
.tip{position:fixed;z-index:20;padding:5px 8px;border-radius:7px;background:var(--text);color:var(--on-text);font-size:11.5px;pointer-events:none;white-space:nowrap}
</style>
</head>

const tile=r=>MARK[r]?`<span class="tile e">${MARK[r]}</span>`:`<span class="tile">${r[0].toUpperCase()}</span>`;

function treeRow(p,t,tag=''){
  const off=!M[t[0]].online;
  const tip=M[t[0]].local?'':`${M[t[0]].name}${off?' · offline':''}${t[5]?' · '+t[5]:''}`;
  return `<div class="row child${s.sel===key(p,t)?' on':''}${off?' dim':''}${s.flash===key(p,t)?' fresh':''}" data-act="sel" data-v="${key(p,t)}" ${tip?`data-tip="${tip}"`:''}><span class="lead">${lead(t)}</span><span class="nm">${t[2]}</span>${tag}${stat(t)}</div>`;
}
function projRow(p,extra=''){
  const closed=s.pclosed[p.repo];
  return `<div class="pw" style="position:relative"><div class="row${closed?' closed':''}" data-act="pfold" data-v="${p.repo}"><span>${tile(p.repo)}</span><span class="nm">${p.repo}</span>${extra}<span class="car">${ic('chevron-down',12)}</span><span class="acts"><span data-act="pmenu" data-v="${p.repo}" data-tip="New session…">${ic('plus',14)}</span>${ic('more',14)}</span></div>${s.pmenu===p.repo?projMenu(p):''}</div>`;
}
function projMenu(p){
  const on=machinesOf(p);
  const rows=ORDER.map(k=>{const m=M[k],has=on.includes(k);
    if(!m.online)return `<div class="mp off">${ic(m.icon,14)}<span class="nm">${m.name}</span><span class="h">offline</span></div>`;
    return has?`<div class="mp" data-act="newon" data-v="${p.repo}|${k}">${ic(m.icon,14,'var(--text-2)')}<span class="nm">${m.name}</span>${mdot(k)}</div>`
      :`<div class="mp" data-act="finder" data-v="${k}">${ic(m.icon,14,'var(--text-4)')}<span class="nm" style="color:var(--text-3)">${m.name}</span><span class="h">Choose folder…</span></div>`}).join('');
  return `<div class="pm"><div class="ml">New session on</div>${rows}<div class="md"></div><div class="mp">${ic('settings',14,'var(--text-2)')}<span class="nm">Project settings</span></div></div>`;
}

/* A · machine as a space, Arc-style */
function spaces(){

    +ps.map(p=>`<div class="grp" style="opacity:.55">${projRow(p)}${p.trees.filter(t=>t[0]===id).map(t=>treeRow(p,t)).join('')}</div>`).join('');
  else body=ps.map(p=>`<div class="grp">${projRow(p)}${p.trees.filter(t=>t[0]===id).map(t=>treeRow(p,t)).join('')}</div>`).join('');
  const sw=ORDER.map((k,i)=>`<button class="sw${k===id?' on':''}" data-act="space" data-v="${k}" data-tip="${M[k].name} · ⌃${i+1}">${ic(M[k].icon,16)}${M[k].local?'':`<span class="dot${M[k].online?'':' off'}"></span>`}${needs(k)&&k!==id?`<span class="badge">${needs(k)}</span>`:''}</button>`).join('')

}

function projectFirst(){
  const f=s.filter;
  const chips=[['all','All']].concat(ORDER.map(k=>[k,M[k].name])).map(([k,l])=>`<button class="chip${f===k?' on':''}" data-act="filter" data-v="${k}">${k==='all'?'':ic(M[k].icon,12)}${k==='mac'?'Mac':l}${k!=='all'&&!M[k].local?mdot(k):''}</button>`).join('');
  const ps=P.filter(p=>f==='all'||p.trees.some(t=>t[0]===f));

    const rows=single?p.trees.filter(t=>t[0]===ms[0]).map(t=>treeRow(p,t)).join('')

function sections(){

}

const NOTES={
  spaces:`<h2>A · Machines as spaces</h2>Precedent: Arc's Spaces (switcher at the sidebar bottom, <span class="kbd">⌃1…9</span>), Slack's workspace rail, Linear's switcher.<ul><li>The sidebar shows one machine. Switch with a click, <span class="kbd">⌃1</span> <span class="kbd">⌃2</span> <span class="kbd">⌃3</span>, or a two-finger swipe.</li><li>A badge counts sessions waiting on you on other machines, so they don't hide.</li><li>An offline machine keeps its projects, dimmed, with Reconnect.</li></ul><p style="margin-top:8px"><b>Good:</b> each machine stays short. <b>Cost:</b> the same repo still splits across spaces, and you can't see agents finishing elsewhere. Arc's own team wrote that Spaces "introduce new ways of getting lost", and Dia dropped them for flat profiles.</p>`,
  first:`<h2>B · Project first, machines inside <span class="kbd">recommended</span></h2>Precedent: Paradev's sidebar. One row per repo, checkouts from every machine under it, local unmarked, remote marked, offline dimmed. A worktree made on another machine appears as soon as that machine is online.<ul><li>employer-backend lists This Mac, then mac-mini, under one row. A small heading names the machine, since Paradev's icon-only mark (name on hover) is easy to miss.</li><li>A repo on one other machine shows a machine tag on its row.</li><li>The chips filter to one machine, like Paradev's "This device / All devices".</li><li>Sessions mac-mini started itself land under their repo instead of becoming phantom projects.</li></ul><p style="margin-top:8px"><b>Good:</b> no duplicate rows, and everything about a repo is in one place. <b>Cost:</b> "same repo" needs a reliable match (remote URL first, folder name as fallback).</p>`,
  sections:`<h2>C · A section per machine</h2>Precedent: Zed's Remote Projects dialog (a header per server, projects under it), VS Code's Remote Explorer, Termius groups.<ul><li>The header shows status and a project count. On hover: add folder (opens the host finder), terminal, more.</li><li>An offline section dims and says when it was last seen.</li><li>Folding mac-mini hides its five sessions in one click.</li></ul><p style="margin-top:8px"><b>Good:</b> obvious, and one place per machine to connect or set up. <b>Cost:</b> the same repo appears in several sections, and the list grows with each machine. The research suggests it suits a management view (Settings › Hosts) better than the main sidebar.</p>`,
};

  const crumb=`<span>${repo}</span><span>/</span>${m.local?'':`<span style="display:flex;align-items:center;gap:5px">${ic(m.icon,12)}${m.name}${mdot(mk)}</span><span>/</span>`}<b>${name}</b>`;
  const card=m.online?`<div class="sess"><span class="ic">${ic('claude',16)}</span><div><b>${name}</b><span>${m.local?'On this Mac':'Runs on '+m.name+' · '+m.hint}</span></div></div>`
    :`<div class="sess off"><span class="ic">${ic(m.icon,16)}</span><div style="flex:1"><b>${m.name} is offline</b><span>Last seen ${m.seen}. ${name} is still there and comes back when it reconnects.</span></div><button class="btn" data-act="reconnect" data-v="${mk}">${ic('reload',13)}Reconnect</button></div>`;
  return `<div class="bar">${crumb}</div><div class="body">${card}<div class="note">${NOTES[s.variant]}</div></div>`;
}
function render(){
  const side=s.variant==='spaces'?spaces():s.variant==='first'?projectFirst():sections();
  document.getElementById('root').innerHTML=`<div class="app"><aside class="side">${side}</aside>
  <main class="main">${mainView()}</main></div>
  <div class="proto">${[['spaces','A · Spaces'],['first','B · Project first'],['sections','C · Sections']].map(([k,l])=>`<button data-act="variant" data-v="${k}"${s.variant===k?' data-on':''}>${l}</button>`).join('')}<span class="sep"></span><button data-act="simulate" data-tip="mac-mini's own Anywhere starts a worktree">+ session on mac-mini</button><button data-act="toggle" data-tip="Take mac-mini offline or back">mac-mini ${M.mini.online?'online':'offline'}</button><span class="sep"></span><button data-act="theme">${document.documentElement.dataset.theme==='graphite'?'Graphite':'Solarized'}</button></div>`;
  s.dir='';
}

function toast(msg){const d=document.createElement('div');d.className='tip';d.style.cssText='right:20px;bottom:64px;padding:8px 12px';d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),2200)}
let tipEl=null;
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');tipEl?.remove();tipEl=null;if(!t)return;const r=t.getBoundingClientRect();tipEl=document.createElement('div');tipEl.className='tip';tipEl.textContent=t.dataset.tip;document.body.append(tipEl);tipEl.style.left=Math.min(r.left,window.innerWidth-tipEl.offsetWidth-8)+'px';tipEl.style.top=(r.top-28)+'px'});
function go(space){if(space===s.space)return;s.dir=ORDER.indexOf(space)<ORDER.indexOf(s.space)?'l':'';s.space=space;render()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el){if(s.pmenu){s.pmenu=null;render()}return}const v=el.dataset.v;
  if(s.pmenu&&!['pmenu','newon','finder'].includes(el.dataset.act))s.pmenu=null;
  switch(el.dataset.act){
    case 'variant':s.variant=v;location.hash=v;break;
    case 'space':return go(v);
    case 'filter':s.filter=v;break;
    case 'fold':s.closed[v]=!s.closed[v];break;
    case 'sel':s.sel=v;break;
    case 'pfold':if(e.target.closest('.acts'))return;s.pclosed[v]=!s.pclosed[v];break;
    case 'pmenu':e.stopPropagation();s.pmenu=s.pmenu===v?null:v;break;
    case 'newon':{const [r,k]=v.split('|');const p=P.find(p=>p.repo===r);const nm=['brave-otter','quiet-heron','lucky-lynx'][s.n++%3];p.trees.push([k,'worktree',nm,'working',null,k==='mac'?'':'started from this Mac']);s.sel=`${r}/${k}/${nm}`;s.flash=s.sel;s.pmenu=null;break;}
    case 'finder':s.pmenu=null;toast(`Opens the host finder on ${M[v].name}`);return;
    case 'simulate':{const p=P[0];const nm=['wild-gecko','calm-tapir','swift-ibis'][s.n++%3];p.trees.push(['mini','worktree',nm,'working',null,'started on mac-mini']);s.flash=`${p.repo}/mini/${nm}`;s.pclosed[p.repo]=false;break;}
    case 'toggle':M.mini.online=!M.mini.online;M.mini.seen='just now';break;
    case 'reconnect':M[v].online=true;break;
    case 'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='graphite'?'':'graphite';break;
  }
  tipEl?.remove();tipEl=null;render();setTimeout(()=>{s.flash=null},1900);
});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&/^[1-3]$/.test(e.key)&&s.variant==='spaces')go(ORDER[+e.key-1])});
let wheel=0;document.addEventListener('wheel',e=>{if(s.variant!=='spaces'||!e.target.closest('.side')||Math.abs(e.deltaX)<Math.abs(e.deltaY))return;wheel+=e.deltaX;if(Math.abs(wheel)>80){const i=ORDER.indexOf(s.space)+(wheel>0?1:-1);wheel=0;if(ORDER[i])go(ORDER[i])}},{passive:true});
/* #menu and #offline open variant B on that state */
({menu:()=>{s.pmenu='employer-backend'},offline:()=>{M.mini.online=false;M.mini.seen='5m ago';s.sel='employer-backend/mini/monumental-falconet'}})[location.hash.slice(1)]?.();
render();
</script>
</body>
</html>
