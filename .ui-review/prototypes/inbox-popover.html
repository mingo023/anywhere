<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket · Inbox popover prototype</title>
<style>
:root{
  --text:#111113;--t2:#6f6f78;--t3:#8b8b94;--t4:#a1a1aa;--t6:#d4d4d8;
  --window:#f4f4f5;--main:#fafafa;--nav:#fafafb;--surface:#fff;--well:#f4f4f5;
  --fill1:rgba(17,17,19,.03);--fill2:rgba(17,17,19,.043);--fill3:rgba(17,17,19,.055);--fill4:rgba(17,17,19,.067);
  --sep:rgba(17,17,19,.09);--sep-strong:rgba(17,17,19,.122);--dot:rgba(17,17,19,.13);
  --pop:rgba(255,255,255,.84);--pop-edge:rgba(255,255,255,.7);--pop-shadow:0 0 0 .5px rgba(17,17,19,.14),0 18px 48px rgba(0,0,0,.16),0 4px 12px rgba(0,0,0,.06);
  --waiting:#ad5700;--waiting-dot:#ffb224;--waiting-bg:rgba(255,178,36,.18);
  --failed:#cd2b31;--failed-text:#cd2b31;--failed-bg:rgba(229,72,77,.11);
  --success:#2b9a66;--success-text:#18794e;--success-bg:rgba(48,164,108,.13);
  --btn:#111113;--btn-text:#fff;--bubble:#f1f1f2;--kbd:rgba(17,17,19,.06);--codebg:rgba(17,17,19,.06);--cut:#fff;--glyph-on:#fff;
  --sans:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --out:cubic-bezier(.23,1,.32,1);
}
[data-theme=dark]{
  --text:#ebebeb;--t2:#a1a1a1;--t3:#818181;--t4:#6c6c6c;--t6:#414141;
  --window:#121212;--main:#121212;--nav:#0e0e0e;--surface:rgba(235,235,235,.1);--well:rgba(235,235,235,.05);
  --fill1:rgba(235,235,235,.05);--fill2:rgba(235,235,235,.078);--fill3:rgba(235,235,235,.1);--fill4:rgba(235,235,235,.12);
  --sep:rgba(235,235,235,.078);--sep-strong:rgba(235,235,235,.14);--dot:rgba(235,235,235,.07);
  --pop:rgba(38,38,38,.8);--pop-edge:rgba(255,255,255,.07);--pop-shadow:0 0 0 .5px rgba(235,235,235,.14),0 18px 48px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.3);
  --waiting:#ffca16;--waiting-dot:#ffb224;--waiting-bg:rgba(255,178,36,.16);
  --failed:#e5484d;--failed-text:#ff9592;--failed-bg:rgba(229,72,77,.13);
  --success:#30a46c;--success-text:#3dd68c;--success-bg:rgba(48,164,108,.14);
  --btn:#ebebeb;--btn-text:#171717;--bubble:#2c2c30;--kbd:rgba(235,235,235,.1);--codebg:rgba(0,0,0,.25);--cut:#2b2b2b;--glyph-on:#171717;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--text);font-size:13px;
  background:radial-gradient(1100px 700px at 12% 0%,#d9dfe9 0%,transparent 60%),radial-gradient(900px 600px at 92% 100%,#e0d9e6 0%,transparent 60%),#c8cdd7}
body[data-theme=dark]{background:radial-gradient(1100px 700px at 12% 0%,#2a2f38 0%,transparent 60%),radial-gradient(900px 600px at 92% 100%,#2b2633 0%,transparent 60%),#16181c}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* harness chrome, not design */
#theme{position:fixed;top:12px;right:16px;z-index:10;height:26px;padding:0 10px;border-radius:999px;font-size:12px;
  background:rgba(10,10,10,.72);color:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#axis{position:fixed;top:12px;left:16px;z-index:10;font-size:12px;color:rgba(17,17,19,.6)}
body[data-theme=dark] #axis{color:rgba(255,255,255,.5)}
#axis b{color:rgba(17,17,19,.85);font-weight:600}
body[data-theme=dark] #axis b{color:rgba(255,255,255,.85)}

/* app window */
#win{position:absolute;inset:46px 28px 76px;display:flex;border-radius:12px;overflow:hidden;background:var(--window);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 24px 70px rgba(0,0,0,.24),0 6px 18px rgba(0,0,0,.1);user-select:none;-webkit-user-select:none}
.lights{position:absolute;left:14px;top:15px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

#rail{position:relative;width:56px;flex:none;background:var(--nav);padding:37px 0 12px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
#rail::after{content:"";position:absolute;top:42px;bottom:0;right:0;width:.5px;background:var(--sep)}
.rb{position:relative;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background-color 120ms ease-out}
.rb:hover{background:var(--fill2)}
.rb[data-on]{background:var(--fill4);color:var(--text)}
.rb:active{transform:scale(.96)}
.rb .ic{width:18px;height:18px}
.tileA{width:24px;height:24px;border-radius:6px;background:var(--btn);color:var(--btn-text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--waiting-dot);color:#1a1306;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--nav);font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
#aside{position:relative;width:272px;flex:none;background:var(--nav);padding:0 8px 8px;display:flex;flex-direction:column;z-index:3;border-right:.5px solid var(--sep)}
.atop{height:42px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding-right:2px}
.atop .rb{width:28px;height:28px;border-radius:7px;color:var(--t3)}
.atop .rb .ic{width:16px;height:16px}
.afield{height:32px;margin:0 4px 6px;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--t3);font-size:13px;background:var(--fill1);box-shadow:inset 0 0 0 .5px var(--sep-strong)}
.afield .ic{width:15px;height:15px}
.afield kbd{margin-left:auto;background:none;color:var(--t4)}
.nrow{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;color:var(--t2);font-size:13px}
.nrow:hover{background:var(--fill2)}
.nrow .ic{width:15px;height:15px}
.ahead{display:flex;align-items:center;padding:14px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--t3);text-transform:uppercase}
.ahead .ic{margin-left:auto;width:14px;height:14px}
.aproj{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13px;margin-top:4px}
.asess{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-radius:8px;font-size:13px;color:var(--t2);white-space:nowrap}
.asess span:last-child{overflow:hidden;text-overflow:ellipsis}
.asess:hover{background:var(--fill2)}
.asess[data-on]{background:var(--fill4);color:var(--text)}
.asess .g{width:14px;flex:none;display:flex;justify-content:center}
.asess .g .ic{width:12px;height:12px;stroke-width:2.2}
.asess .g .d{width:7px;height:7px;border-radius:50%;background:var(--waiting-dot)}
.asess .g.failed{color:var(--failed)}.asess .g.done{color:var(--success)}.asess .g.idle{color:var(--t4)}
.bars{display:flex;flex-direction:column;gap:3px}
.bars i{display:block;width:24px;height:3px;border-radius:2px;background:var(--sep-strong);overflow:hidden}
.bars i b{display:block;height:100%;border-radius:2px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--btn);color:var(--btn-text);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}

#main{flex:1;min-width:0;display:flex;flex-direction:column;background-color:var(--main);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;background-position:9px 9px}
.mhead{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 0 28px;font-size:13px;border-bottom:.5px solid var(--sep);background:var(--main)}
.mhead .p{color:var(--t2)}.mhead .s{color:var(--t6)}.mhead .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:20px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.pill.needs{background:var(--waiting-bg);color:var(--waiting)}
.pill.failed{background:var(--failed-bg);color:var(--failed-text)}
.pill.done{background:var(--success-bg);color:var(--success-text)}
.chat{flex:1;overflow:hidden;padding:28px 0;display:flex;flex-direction:column;gap:18px;align-items:center}
.chat>*{width:min(640px,calc(100% - 64px))}
.bub{align-self:center;display:flex;justify-content:flex-end}
.bub span{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--bubble);font-size:13.5px;line-height:20px}
.say{font-size:13.5px;line-height:21px;color:var(--text)}
.say code{font-family:var(--mono);font-size:12px;padding:1px 5px;border-radius:5px;background:var(--fill3)}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2)}
.step .ic{width:14px;height:14px}
.fade-in{animation:fadeIn 180ms var(--out)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}}

/* shared popover material */
.pop{position:absolute;z-index:20;display:flex;flex-direction:column;border-radius:12px;background:var(--pop);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:var(--pop-shadow);
  transform-origin:0 18px;opacity:0;transform:translate(-6px,0) scale(.96);pointer-events:none;overflow:hidden}
.pop::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 .5px 0 var(--pop-edge)}
.pop[data-dir=down]{transform:translate(0,-6px) scale(.96)}
.pop[data-open]{opacity:1;transform:none;pointer-events:auto;
  transition:transform var(--spring-ms) var(--spring),opacity 140ms ease-out}
.pop[data-closing]{transition:transform 160ms var(--out),opacity 140ms ease-out}

.phead{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px}
.phead h2{margin:0;flex:1;font-size:15px;font-weight:700;letter-spacing:-.01em}
.ib{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background-color 120ms ease-out,color 120ms ease-out}
.ib:hover{background:var(--fill3);color:var(--text)}
.ib:active{transform:scale(.94)}
.ib .ic{width:15px;height:15px}
.tip{position:relative}
.tip[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;padding:4px 7px;border-radius:6px;
  font-size:11px;background:var(--btn);color:var(--btn-text);pointer-events:none}

.list{flex:1;min-height:0;overflow-y:auto;padding:6px}
.empty{padding:46px 16px;text-align:center;color:var(--t3);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ring{width:36px;height:36px;border-radius:50%;background:var(--success-bg);color:var(--success-text);display:flex;align-items:center;justify-content:center}
.empty .ring .ic{width:18px;height:18px}
.foot{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:11.5px;color:var(--t3);border-top:.5px solid var(--sep)}
kbd{font-family:var(--mono);font-size:10.5px;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:var(--kbd);color:var(--t2);display:inline-flex;align-items:center;justify-content:center}

/* status mark */
.mark{width:26px;height:26px;flex:none;border-radius:8px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep-strong);display:flex;align-items:center;justify-content:center}
.mark .dot{width:8px;height:8px;border-radius:50%;background:var(--waiting-dot);box-shadow:0 0 0 3px var(--waiting-bg)}
.mark.failed{color:var(--failed)}.mark.done{color:var(--success)}
.mark .ic{width:13px;height:13px;stroke-width:2.2}
.prov{width:12px;height:12px;flex:none}

/* rows (variant 1 + updates in 2) */
.row{position:relative;display:flex;gap:12px;padding:10px 10px 10px 12px;border-radius:10px;margin-bottom:2px;transition:background-color 100ms ease-out}
.row:hover{background:var(--fill1)}
.row[data-sel]{background:var(--fill3)}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);min-width:0}
.meta b{font-weight:600}
.meta .sep{color:var(--t6)}
.meta .ago{margin-left:auto;color:var(--t4);font-variant-numeric:tabular-nums;flex:none}
.meta .who{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.sub{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateX(4px);transition:opacity 120ms ease-out,transform 160ms var(--out)}
.row:hover .acts,.row[data-sel] .acts{opacity:1;transform:none}
.acts button{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t2);
  background:var(--pop-solid,var(--surface));box-shadow:0 0 0 .5px var(--sep-strong),0 1px 2px rgba(0,0,0,.06)}
[data-theme=dark] .acts button{background:#303030}
.acts button:hover{color:var(--text)}
.acts button:active{transform:scale(.94)}
.acts .ic{width:14px;height:14px}
.row:hover .meta .ago,.row[data-sel] .meta .ago{opacity:0}

/* v1 tabs */
.tabs{position:relative;flex:none;display:flex;gap:2px;padding:0 10px;border-bottom:.5px solid var(--sep)}
.tab{position:relative;height:34px;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--t2);transition:color 120ms ease-out}
.tab:hover{color:var(--text)}
.tab[data-on]{color:var(--text)}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--t4)}
.tab[data-on] .n{color:var(--t2)}
.tab.needs .n{color:var(--waiting)}
.uline{position:absolute;bottom:-.5px;left:0;height:2px;border-radius:2px;background:var(--text);will-change:transform}
.tabs[data-ready] .uline{transition:transform 250ms var(--out),width 250ms var(--out)}

/* v2 segmented */
.seg{position:relative;display:flex;padding:2px;border-radius:9px;background:var(--fill3)}
.seg button{position:relative;z-index:1;height:26px;padding:0 10px;border-radius:7px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--t2);transition:color 120ms ease-out}
.seg button[data-on]{color:var(--text)}
.seg .n{min-width:16px;height:16px;padding:0 4px;border-radius:999px;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--fill4);color:var(--t2)}
.seg .needs .n{background:var(--waiting-dot);color:#1a1306}
.seg .n[data-zero]{background:var(--fill4);color:var(--t3)}
.thumb{position:absolute;top:2px;left:0;height:26px;border-radius:7px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep-strong),0 1px 2px rgba(0,0,0,.08)}
[data-theme=dark] .thumb{background:rgba(235,235,235,.14)}
.seg[data-ready] .thumb{transition:transform 250ms var(--out),width 250ms var(--out)}
.card{border-radius:12px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep),0 1px 2px rgba(0,0,0,.04);padding:12px;margin-bottom:8px}
[data-theme=dark] .card{background:rgba(235,235,235,.06)}
.tline{display:flex;align-items:center;gap:6px;margin-top:3px}
.tline .ttl{flex:1;min-width:0}
.ib.sm{width:24px;height:24px;border-radius:6px}
.ib.sm .ic{width:13px;height:13px}
.via{font-size:12px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.via b{font-weight:500;color:var(--t2)}
.box{margin-top:8px}
/* ui::repo_tile at the sidebar row's 20px, its corner dot cut out of the card */
.tile{position:relative;width:20px;height:20px;flex:none;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;color:var(--t2);background:var(--surface);box-shadow:inset 0 0 0 .5px var(--sep-strong)}
.tile .cb{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:5px;background:var(--waiting-dot);box-shadow:0 0 0 2px var(--cut)}
.tile .cb.failed{background:var(--failed)}.tile .cb.done{background:var(--success)}
#aside .tile .cb{box-shadow:0 0 0 2px var(--nav)}
.meta.pm{gap:8px}
.meta.pm .pn{font-size:13px;color:var(--text)}
.bhead{display:flex;align-items:flex-start;gap:8px}
.bhead>:first-child{flex:1;min-width:0}
.pager{flex:none;font-family:var(--mono);font-size:11px;color:var(--t2);padding-top:2px}
.lead{font-size:13px;line-height:18px}
.lead b{font-weight:600}
.q{font-size:13px;line-height:19px}
.ftxt{color:var(--failed-text);font-weight:600}
.hint{font-size:12px;color:var(--t3)}
.box .cmd{background:var(--codebg);box-shadow:none;margin-top:6px}
.box .cmd.multi{white-space:pre-wrap;overflow-wrap:anywhere}
.box .cmd.clamp{max-height:56px;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.cmd.path{display:flex;gap:8px}
.cmd.path .dstat{margin-left:auto;flex:none}
.dstat i{font-style:normal}.dstat .a{color:var(--success-text)}.dstat .d{color:var(--failed-text)}
.diff{margin-top:4px;padding:6px 10px;border-radius:8px;background:var(--codebg);font-family:var(--mono);font-size:11.5px;line-height:16px}
.dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.add{color:var(--success-text)}.dl.del{color:var(--failed-text)}
.more{margin-top:6px;font-size:12px;color:var(--t2);text-decoration:underline;text-underline-offset:2px}
.more:hover{color:var(--text)}
.qhead{display:flex;align-items:center;gap:8px}
.qh{flex:1;min-width:0;font-size:11.5px;font-weight:500;color:var(--t2)}
.qhead .pager{font-size:11px;font-weight:500;font-family:var(--sans);font-variant-numeric:tabular-nums;color:var(--t3);padding:0}
.qc{max-height:320px;overflow-y:auto;margin-top:6px}
.qt{font-size:13px;line-height:18px;font-weight:600}
.qbody{margin-top:4px;font-size:12.5px;line-height:18px;color:var(--t2)}
.qbody p{margin:0 0 6px}.qbody p:last-child,.qbody ul:last-child{margin-bottom:0}.qbody ul{margin:0 0 6px;padding-left:16px}.qbody li{margin:2px 0}
.qbody b{color:var(--text);font-weight:600}
.qbody code{font-family:var(--mono);font-size:11.5px;padding:0 4px;border-radius:4px;background:var(--codebg)}
.opts{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.opt2{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;background:var(--fill2);transition:background-color 100ms ease-out}
.opt2:hover,.opt2.on{background:var(--fill4)}
.opt2:active{opacity:.85}
.opt2 .mk{height:18px;display:flex;align-items:center;flex:none;color:var(--t3)}
.opt2.on .mk{color:var(--text)}
.opt2 .mk svg{width:13px;height:13px}
.opt2 .ol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt2 .ol b{font-size:13px;line-height:18px;font-weight:500}
.opt2 .od{font-size:11.5px;line-height:16px;color:var(--t2);text-wrap:pretty}
.reply.qo{margin-top:8px;height:34px;padding:0 4px 0 11px}
.btn[disabled]{opacity:.35;pointer-events:none}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;margin-top:6px;padding:7px 10px;border-radius:8px;text-align:left;
  background:var(--surface);box-shadow:0 0 0 .5px var(--sep-strong);transition:background-color 120ms ease-out}

    if (down) pop.setAttribute('data-dir', 'down');
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    pop.style.transformOrigin = down ? `${b.left - w.left - left + b.width / 2}px 0` : '0 18px';
    pop.style.maxHeight = (w.height - top - 14) + 'px';
  };
  const set = v => {
    if (v === open) return;
    open = v;
    bell.toggleAttribute('data-on', v);
    if (v) { place(); pop.removeAttribute('data-closing'); pop.setAttribute('data-open', ''); onOpen && onOpen(); }
    else { pop.setAttribute('data-closing', ''); pop.removeAttribute('data-open'); }
  };
  on(bell, 'pointerdown', e => { e.stopPropagation(); set(!open); });
  on(document, 'pointerdown', e => { if (open && !pop.contains(e.target) && !e.target.closest('.proto-picker,#theme,#axis')) set(false); });
  on(document, 'keydown', e => { if (open && e.key === 'Escape') set(false); });
  on(window, 'resize', () => open && place());
  place();
  if (autoOpen) requestAnimationFrame(() => requestAnimationFrame(() => set(true)));
  return {set, get open(){ return open; }};
}

function v1(root) {

  const TABS = [['all','All'],['needs','Needs you'],['failed','Failed'],['done','Done']];
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.style.width = '412px';
  root.querySelector('#win').appendChild(pop);
  pop.innerHTML = `<div class="phead"><h2>Inbox</h2>
      <button class="ib tip" data-tip="Mark all seen" id="allseen">${ic('checks')}</button></div>
    <div class="tabs">${TABS.map(([k,l]) => `<button class="tab ${k}" data-k="${k}">${l}<span class="n"></span></button>`).join('')}<span class="uline"></span></div>
    <div class="list"></div>
    <div class="foot"><kbd>J</kbd><kbd>K</kbd> move · <kbd>↵</kbd> open · <kbd>E</kbd> mark seen · <kbd>esc</kbd> close</div>`;
  const list = pop.querySelector('.list'), tabsEl = pop.querySelector('.tabs'), ul = pop.querySelector('.uline');
  const shown = () => notes.filter(n => tab === 'all' || n.status === tab);
  const moveLine = () => {
    const t = tabsEl.querySelector('[data-on]');
    ul.style.width = (t.offsetWidth - 16) + 'px';
    ul.style.transform = `translateX(${t.offsetLeft + 8}px)`;
  };
  const paint = () => {
    tabsEl.querySelectorAll('.tab').forEach(t => {
      const k = t.dataset.k, c = k === 'all' ? notes.length : notes.filter(n => n.status === k).length;
      t.toggleAttribute('data-on', k === tab);
      t.querySelector('.n').textContent = c || '';
    });
    const s = shown();
    sel = Math.min(sel, Math.max(0, s.length - 1));
    list.innerHTML = s.length ? s.map((n, i) => `<div class="row" data-id="${n.id}" ${i === sel && kbdNav ? 'data-sel' : ''}>
        ${markOf(n)}<div class="body">${meta(n)}<div class="ttl">${n.title}</div><div class="sub">${subOf(n)}</div></div>
        <div class="acts">${n.status !== 'needs' ? `<button class="tip" data-tip="Mark seen" data-act="seen">${ic('check')}</button>` : ''}
          <button class="tip" data-tip="Open session" data-act="open">${ic('open')}</button></div></div>`).join('')
      : `<div class="empty"><div class="ring">${ic('check')}</div>Nothing here. You're all caught up.</div>`;
    badge(root, notes);
    moveLine();
  };
  let kbdNav = false;
  const openNote = n => { a.set(false); renderMain(root, n); };
  const seen = id => {
    const el = list.querySelector(`[data-id="${id}"]`);
    collapse(el, () => { notes = notes.filter(n => n.id !== id); paint(); });
  };
  on(tabsEl, 'click', e => { const t = e.target.closest('.tab'); if (!t) return; tab = t.dataset.k; sel = 0; paint(); });
  on(list, 'click', e => {
    const row = e.target.closest('.row'); if (!row) return;
    const n = notes.find(x => x.id === row.dataset.id);
    if (e.target.closest('[data-act="seen"]')) seen(n.id); else openNote(n);
  });
  on(pop.querySelector('#allseen'), 'click', () => {
    const ids = notes.filter(n => n.status !== 'needs').map(n => n.id);
    ids.forEach(id => { const el = list.querySelector(`[data-id="${id}"]`); el && collapse(el, () => {}); });
    setTimeout(() => { notes = notes.filter(n => n.status === 'needs'); paint(); }, reduced ? 0 : 240);
  });
  on(document, 'keydown', e => {
    if (!a.open || e.metaKey || e.ctrlKey || e.altKey) return;
    const s = shown();
    if (e.key === 'j' || e.key === 'ArrowDown') { kbdNav = true; sel = Math.min(sel + 1, s.length - 1); paint(); e.preventDefault(); }
    else if (e.key === 'k' || e.key === 'ArrowUp') { kbdNav = true; sel = Math.max(sel - 1, 0); paint(); e.preventDefault(); }
    else if (e.key === 'Enter' && s[sel]) openNote(s[sel]);
    else if ((e.key === 'e' || e.key === 'E') && s[sel] && s[sel].status !== 'needs') seen(s[sel].id);
  });
  on(pop, 'pointermove', () => { if (kbdNav) { kbdNav = false; list.querySelectorAll('[data-sel]').forEach(r => r.removeAttribute('data-sel')); } });
  const a = anchored(root, pop);
  paint();
  requestAnimationFrame(() => requestAnimationFrame(() => tabsEl.setAttribute('data-ready', '')));
}

  on(pop, 'click', e => {
    const t = e.target.closest('[data-act]'), act = t?.dataset.act;
    const host = e.target.closest('[data-id]'), n = host && notes.find(x => x.id === host.dataset.id);
    if (act === 'to-updates') { seg = 'updates'; paint(); return; }
    if (act === 'allseen') { list.querySelectorAll('.mini').forEach(el => collapse(el, () => {})); setTimeout(() => { notes = needs(); paint(); }, reduced ? 0 : 240); return; }
    if (!n) return;
    if (act === 'open' || (!act && host.classList.contains('mini'))) return openNote(n);
    if (act === 'allow') answered(n, 'Allowed once · agent resumed');
    else if (act === 'deny') answered(n, 'Denied · agent stopped that step');
    else if (act === 'reply') {
      host.querySelector('[data-row]').outerHTML = `<div class="reply"><input data-kind="deny" placeholder="Tell ${name(n)} what to do instead…"><button class="btn sec" data-act="send-deny" style="height:26px">Send</button></div>
        <button class="more" data-act="cancel-reply">Cancel</button>`;
      host.querySelector('input').focus();
    }
    else if (act === 'cancel-reply') { host.querySelector('.box').outerHTML = askBox(n); }
    else if (act === 'send-deny') { const v = host.querySelector('input').value.trim(); if (v) answered(n, 'Denied with your note'); else host.querySelector('input').focus(); }
    else if (act === 'more') { host.querySelector('.cmd').classList.remove('clamp'); t.remove(); }
    else if (act && act[0] === 'q') {
      const a = n.asks[n.i], w = wiz(a), q = a.questions[w.page], last = w.page === a.questions.length - 1;
      const summary = () => a.questions.length > 1 ? `Sent ${a.questions.length} answers`
        : `Answered “${w.typed[0].trim() || w.picked[0].map(k => q.options[k][0]).join(', ')}”`;
      const next = () => { if (last) answered(n, summary()); else { w.page++; reBox(n, true); } };
      if (act === 'qback') { w.page--; reBox(n, true); }
      else if (act === 'qother') { w.other = true; reBox(n); list.querySelector(`[data-id="${n.id}"] input`).focus(); }
      else if (act === 'qcancel') { w.other = false; reBox(n); }
      else if (act === 'qsend') { const v = host.querySelector('input').value.trim(); if (!v) return host.querySelector('input').focus(); w.typed[w.page] = v; w.other = false; next(); }
      else if (act === 'qnext') next();
      else if (act === 'qpick') {
        const k = +t.dataset.k, p = w.picked[w.page];
        if (q.multi) { const at = p.indexOf(k); at < 0 ? p.push(k) : p.splice(at, 1); reBox(n); return; }
        w.picked[w.page] = [k]; reBox(n);
        setTimeout(() => { if (w.picked[w.page]?.[0] === k) next(); }, 220);
      }
    }
    else if (act === 'send') { const v = host.querySelector('input').value.trim(); if (v) settle(n, `Sent to ${name(n)}`); else host.querySelector('input').focus(); }
    else if (act === 'retry') settle(n, 'Retrying · back to Working');
    else if (act === 'dismiss') collapse(host, () => drop(n.id));
    else if (act === 'seen') collapse(host, () => drop(n.id));
  });
  on(pop, 'keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    if (e.target.dataset.kind === 'other') { e.target.closest('[data-id]').querySelector('[data-act="qsend"]').click(); return; }
    const host = e.target.closest('[data-id]'), n = notes.find(x => x.id === host.dataset.id), v = e.target.value.trim();
    if (!v) return;
    if (e.target.dataset.kind === 'deny') answered(n, 'Denied with your note'); else settle(n, `Sent to ${name(n)}`);
  });
  on(axis.querySelector('#hx-observe'), 'click', e => { observe = !observe; e.target.textContent = `Observe only: ${observe ? 'on' : 'off'}`; e.target.toggleAttribute('data-on', observe); paint(); });
  on(axis.querySelector('#hx-else'), 'click', () => {
    if (!a.open) a.set(true);
    if (seg !== 'needs') { seg = 'needs'; paint(); }
    const n = needs().find(x => x.status === 'needs'); if (n) settle(n, 'Answered on iPhone', true);
  });
  const a = anchored(root, pop);
  paint();
  requestAnimationFrame(() => requestAnimationFrame(() => segEl.setAttribute('data-ready', '')));
}

/* ---------- 3. Drawer (Gorgias / Air), swipe to clear ---------- */
function v3(root) {
  let notes = NOTES.map(n => ({...n}));
  const win = root.querySelector('#win'), bell = root.querySelector('#bell');
  const dr = document.createElement('aside');
  dr.className = 'drawer';
  dr.style.left = (layout === 'sidebars' ? 272 : 56) + 'px';
  win.appendChild(dr);
  dr.innerHTML = `<div class="phead"><h2>Inbox<span class="cnt"></span></h2>
      <button class="ib tip" data-tip="Mark all seen" data-act="allseen">${ic('checks')}</button>
      <button class="ib" data-act="close" aria-label="Close">${ic('x')}</button></div>
    <div class="list" style="padding:0 10px 6px"></div>
    <div class="dhint">Swipe a card left to clear it · drag the header left to close</div>`;
  const list = dr.querySelector('.list'), W = 384;
  let x = -W, anim = null, open = false;
  const apply = v => { x = v; dr.style.transform = `translateX(${v}px)`; dr.style.visibility = v <= -W + 0.5 ? 'hidden' : 'visible'; };
  const go = (to, velocity = 0) => {
    anim && anim.stop();
    open = to === 0; bell.toggleAttribute('data-on', open);
    anim = spring({from:x, to, velocity, response:0.34, damping:1, onUpdate:apply});
  };
  const order = {needs:0, failed:1, done:2};
  const paint = () => {
    const groups = {};
    [...notes].sort((p, q) => order[p.status] - order[q.status]).forEach(n => (groups[n.project] ||= []).push(n));
    dr.querySelector('.cnt').textContent = notes.length || '';
    list.innerHTML = notes.length ? Object.entries(groups).map(([p, ns]) => `<div class="grp"><span class="lt" style="background:${PROJ[p]}">${p[0].toUpperCase()}</span>${p}<span class="n">${ns.length}</span></div>` +
      ns.map(n => `<div class="swipe" data-id="${n.id}">
        <div class="under ${n.status === 'needs' ? 'hold' : ''}">${n.status === 'needs' ? 'Answer first' : `${ic('check')} Seen`}</div>
        <div class="dcard"><div class="top"><span class="st ${n.status}"></span><span class="ttl" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.title}</span><span class="ago">${n.ago}</span></div>
          <div class="who">${PROV[n.provider].svg}${PROV[n.provider].name} · ${n.session}</div>
          <div class="prev">${n.preview}</div>
          ${n.status === 'needs' ? `<div class="go"><button class="btn pri" data-act="open">${n.kind === 'perm' ? 'Review command' : 'Answer'}</button></div>` : ''}
        </div></div>`).join('')).join('')
      : `<div class="empty"><div class="ring">${ic('check')}</div>You're all caught up.</div>`;
    badge(root, notes);
  };
  const clear = id => {
    const el = list.querySelector(`.swipe[data-id="${id}"]`);
    collapse(el, () => { notes = notes.filter(n => n.id !== id); paint(); });
  };

  // Card swipe: 10px of hysteresis to pick an axis, then 1:1; release projects momentum to decide.
  let drag = null, dragged = false;
  on(list, 'pointerdown', e => {
    const card = e.target.closest('.dcard'); if (!card || e.target.closest('button')) return;
    const sw = card.parentElement, n = notes.find(m => m.id === sw.dataset.id);
    const m = new DOMMatrix(getComputedStyle(card).transform);
    drag = {card, sw, n, x0:e.clientX, y0:e.clientY, base:m.m41, axis:null, t:tracker(), id:e.pointerId};
    drag.anim && drag.anim.stop(); card._anim && card._anim.stop();
    dragged = false;
  });
  on(document, 'pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.axis) {
      if (Math.hypot(dx, dy) < 10) return;
      drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (drag.axis === 'x') drag.card.setPointerCapture(e.pointerId);
    }
    if (drag.axis !== 'x') return;
    dragged = true;
    let v = drag.base + dx;
    const w = drag.sw.offsetWidth;
    if (v > 0 || drag.n.status === 'needs') v = rubber(v, w);
    drag.t.add(v);
    drag.card.style.transform = `translateX(${v}px)`;
    drag.cur = v;
  });
  const release = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (d.axis !== 'x') return;
    const v = d.t.v(), w = d.sw.offsetWidth, from = d.cur ?? 0;
    const set = val => d.card.style.transform = `translateX(${val}px)`;
    if (d.n.status !== 'needs' && from + project(v) < -w * 0.4) {
      d.card._anim = spring({from, to:-w, velocity:v, response:0.3, damping:1, onUpdate:set, onDone:() => clear(d.n.id)});
    } else {
      d.card._anim = spring({from, to:0, velocity:v, response:0.35, damping:0.8, onUpdate:set});
    }
  };
  on(document, 'pointerup', release);
  on(document, 'pointercancel', release);

  // Drawer drag-to-close from its header, same rules.
  let hd = null;
  const head = dr.querySelector('.phead');
  on(head, 'pointerdown', e => {
    if (e.target.closest('button')) return;
    anim && anim.stop();
    hd = {x0:e.clientX, base:x, t:tracker(), id:e.pointerId};
    head.setPointerCapture(e.pointerId);
  });
  on(head, 'pointermove', e => {
    if (!hd || e.pointerId !== hd.id) return;
    let v = hd.base + e.clientX - hd.x0;
    if (v > 0) v = rubber(v, W);
    hd.t.add(v); apply(v);
  });
  const headUp = e => {
    if (!hd || e.pointerId !== hd.id) return;
    const v = hd.t.v(); hd = null;
    go(x + project(v) < -W / 2 ? -W : 0, v);
  };
  on(head, 'pointerup', headUp);
  on(head, 'pointercancel', headUp);

  on(dr, 'click', e => {
    if (dragged) { dragged = false; return; }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') return go(-W);
    if (act === 'allseen') {
      notes.filter(n => n.status !== 'needs').forEach(n => { const el = list.querySelector(`.swipe[data-id="${n.id}"]`); el && collapse(el, () => {}); });
      setTimeout(() => { notes = notes.filter(n => n.status === 'needs'); paint(); }, reduced ? 0 : 240);
      return;
    }
    const sw = e.target.closest('.swipe'); if (!sw) return;
    go(-W); renderMain(root, notes.find(n => n.id === sw.dataset.id));
  });
  on(bell, 'pointerdown', e => { e.stopPropagation(); go(open ? -W : 0); });
  on(document, 'pointerdown', e => { if (open && !dr.contains(e.target) && !e.target.closest('.proto-picker,#theme,#axis')) go(-W); });
  on(document, 'keydown', e => { if (open && e.key === 'Escape') go(-W); });
  apply(-W);
  paint();
  if (autoOpen) requestAnimationFrame(() => requestAnimationFrame(() => go(0)));
}

const AXES = [
  '<b>Tabs</b> · Discord / Jira: anchored list, filter by tab, click jumps into the session',
  '<b>Triage</b> · every case a card can be in, answered in place',
  '<b>Drawer</b> · Gorgias / Air: full-height glass, grouped by project, swipe a card to clear',
];
const variants = [v1, v2, v3].map((fn, i) => () => {
  cleanups.forEach(c => c()); cleanups = [];
  stage.innerHTML = shell('');
  renderMain(stage, DEFAULT_SESSION);
  document.getElementById('axis').innerHTML = AXES[i];
  fn(stage);
  autoOpen = true;
  on(stage.querySelector('#win'), 'click', e => {
    const t = e.target.closest('[data-layout]');
    if (t) { layout = t.dataset.layout; autoOpen = false; variants[current](); return; }
    const s = e.target.closest('.asess'); if (!s) return;
    stage.querySelectorAll('.asess').forEach(x => x.toggleAttribute('data-on', x === s));
    renderMain(stage, s.dataset.note ? NOTES.find(n => n.id === s.dataset.note) : DEFAULT_SESSION);
  });
});

/* ---- picker wiring: PICKER.md reference, with variants as mount functions ---- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  cleanups.forEach(c => c()); cleanups = [];
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

document.getElementById('theme').addEventListener('click', e => {
  const dark = document.body.dataset.theme === 'dark';
  document.body.dataset.theme = dark ? 'light' : 'dark';
  e.target.textContent = dark ? 'Dark' : 'Light';
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
