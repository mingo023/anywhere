<!doctype html>
<!-- Source of public/assets/og.png; og/capture.sh renders it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../public/style.css">
<link rel="stylesheet" href="../public/demo/desktop.css">
<script src="../public/demo/icons.js" defer></script>
<script src="../public/demo/kit.js" defer></script>
<script src="../public/demo/desktop.js" defer></script>
<script src="../public/demo/screens/sessions.js" defer></script>
<script src="../public/demo/screens/review.js" defer></script>
<link rel="stylesheet" href="../public/demo/screens/review.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .glow { inset: 45% -10% -30% 0; }
  .copy { position: absolute; left: 72px; top: 40px; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 12px; font: 600 26px/1 Geist, sans-serif; letter-spacing: -0.02em; }
  .brand img { width: 40px; height: 40px; }
  h1 { margin-top: 32px; font-size: 58px; line-height: 1.05; letter-spacing: -0.035em; }
  p { margin: 20px 0 0; color: var(--text-2); font-size: 21px; line-height: 1.4; }
  .scene { position: absolute; left: 60px; top: 440px; perspective: 1600px; }
  .window.desktop {
    width: 1650px;
    transform: rotateX(42deg) rotateZ(-15deg);
    transform-origin: 0 0;
    box-shadow: 0 0 0 1px rgba(235, 235, 235, 0.14), 0 -20px 90px rgba(0, 0, 0, 0.6), 0 0 120px rgba(124, 133, 227, 0.16);
  }
  .window.desktop * { animation-play-state: paused !important; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../public/assets/icon.png" alt="">Zoes</div>
    <h1>One chat. Every agent.<br><span class="grad">Every machine.</span></h1>
    <p>Claude Code, Codex and more in one native app. Free and open source.</p>
  </div>
  <div class="glow"></div>
  <div class="scene">
    <figure class="window desktop" data-screen="review"><span class="lights"><i></i><i></i><i></i></span></figure>
  </div>
</body>
</html>
