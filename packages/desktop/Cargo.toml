[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]
default-members = ["crates/pocket"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
agents = { path = "crates/agents" }
daemon = { path = "crates/daemon" }
git = { path = "crates/git" }
keys = { path = "crates/keys" }
project = { path = "crates/project" }
store = { path = "crates/store" }
term = { path = "crates/term" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
web = { path = "crates/web" }
workspace = { path = "crates/workspace" }

base64 = "0.22"
block2 = "0.6"
cc = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = "0.3"
gpui-kit = { version = "0.6.6", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
image = { version = "0.25", default-features = false }
imara-diff = "0.2"
libc = "0.2"
merman = { version = "=0.8.0-alpha.6", default-features = false, features = ["svg", "layout-cytoscape"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSDockTile", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std"] }
qrcode = { version = "0.14", default-features = false }
resvg = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-javascript = "0.23.1"
tungstenite = "0.26"
wry = { version = "0.57", default-features = false, features = ["devtools"] }

# gpui-pre 0.3.6 with `List` keeping item heights as hints on a width change instead of re-measuring every item; drop once upstream does.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }

# macOS's default "unpacked" leaves every build's .o files in target/debug/deps, which Cargo never removes.
[profile.dev]
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2
