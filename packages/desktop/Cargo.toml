[package]
name = "pocket-desktop"
version = "0.0.0"
edition = "2024"

[dependencies]
gpui-kit = "0.6.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"
tungstenite = "0.26"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[build-dependencies]
cc = "1"
