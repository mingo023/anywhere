[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]
default-members = ["crates/pocket"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
agents = { path = "crates/agents" }
channel = { path = "crates/channel" }
chat = { path = "crates/chat" }
daemon = { path = "crates/daemon" }
git = { path = "crates/git" }
hosts = { path = "crates/hosts" }
keys = { path = "crates/keys" }
project = { path = "crates/project" }
store = { path = "crates/store" }
term = { path = "crates/term" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
web = { path = "crates/web" }
workspace = { path = "crates/workspace" }

base64 = "0.22"
block2 = "0.6"
cc = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = "0.3"
gpui-kit = { version = "0.6.6", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
ignore = "0.4"
image = { version = "0.25", default-features = false }
imara-diff = "0.2"
libc = "0.2"
merman = { version = "=0.8.0-alpha.6", default-features = false, features = ["svg", "layout-cytoscape"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSDockTile", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std"] }
petname = { version = "3.2", default-features = false, features = ["default-words"] }
qrcode = { version = "0.14", default-features = false }
resvg = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-javascript = "0.23.1"
tree-sitter-swift = "0.7.3"
tungstenite = "0.26"
uds_windows = "1.2"
wry = { version = "0.57", default-features = false, features = ["devtools"] }

# gpui-pre 0.3.6 with `List` keeping item heights as hints on a width change instead of re-measuring every item; drop once upstream does.
# It also gives `img` its picture's ratio only when a side is auto, so a portrait picture stays inside a sized box; drop once upstream does.
# It also adds `Window::set_zoom`, drawing the whole window larger as a browser zooms; upstream has no equivalent.
# It also adds `ListState::height_from`, so the chat can size the room under a sent prompt; upstream has no equivalent.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
# gpui-pre-apple 0.3.6 compositing alpha "over" instead of adding it, so a translucent layer doesn't make the glass window opaque; drop once upstream does.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# gpui-pre-macos 0.3.6 giving prompts the app icon explicitly, since macOS 26 sheet alerts drop the default one; drop once upstream does.
# It also asks for the Badge permission, without which macOS hides the Dock badge; upstream has no equivalent.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# gpui-base 0.6.6 clipping editor text to the right of the gutter instead of hiding it under an opaque gutter, so the editor can be glass; drop once upstream does.
# It also renders markdown like pluk-inc/markdown-preview: its block spacing, code blocks, lists, tables, GitHub alerts and footnotes; upstream has no equivalent.
# It also keeps the scrollbar of a table too wide to fit showing, so it reads as scrollable; upstream has no equivalent.
# It also types the paths of files dropped on an editable input, with `on_drop_paths` to take some first; upstream has no equivalent.
# It also stops an input's caret blinking while the window is inactive, where it draws no caret but redrew the window twice a second.
# It also scrolls a textarea to the end of a paste once the pasted text is laid out, where it clamped to the pre-paste height; drop once upstream does.
# It also grows a double- or triple-click selection a word or line at a time as the pointer drags, as a browser does; drop once upstream does.
gpui-base = { path = "vendor/gpui-base" }

# macOS's default "unpacked" leaves every build's .o files in target/debug/deps, which Cargo never removes.
[profile.dev]
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2

# What scripts/release-mac.sh ships: smaller and slower to build than release, which stays quick for local measuring.
# Thin, not fat, LTO: fat linked pocket 2.4× slower for a 10% smaller binary.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
