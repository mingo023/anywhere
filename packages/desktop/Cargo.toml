[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]
default-members = ["crates/pocket"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
agents = { path = "crates/agents" }
channel = { path = "crates/channel" }
chat = { path = "crates/chat" }
daemon = { path = "crates/daemon" }
git = { path = "crates/git" }
hosts = { path = "crates/hosts" }
keys = { path = "crates/keys" }
project = { path = "crates/project" }
store = { path = "crates/store" }
term = { path = "crates/term" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
web = { path = "crates/web" }
workspace = { path = "crates/workspace" }

base64 = "0.22"
block2 = "0.6"
cc = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = "0.3"
gpui-kit = { version = "0.9.0", features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
ignore = "0.4"
image = { version = "0.25", default-features = false }
imara-diff = "0.2"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSDockTile", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std"] }
petname = { version = "3.2", default-features = false, features = ["default-words"] }
qrcode = { version = "0.14", default-features = false }
resvg = "0.46"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-dockerfile-updated = "0.2.0"
tree-sitter-javascript = "0.23.1"
# Zed's SCSS extension's grammar, at the commit it pins; not on crates.io.
tree-sitter-scss = { git = "https://github.com/simeonoff/tree-sitter-scss", rev = "3f918284a73a54b53e4f326b0aa8c74ccbf4ee4d" }
tree-sitter-swift = "0.7.3"
tree-sitter-vue-next = "0.1.0"
ttf-parser = "0.25"
tungstenite = "0.26"
uds_windows = "1.2"
wry = { version = "0.57", default-features = false, features = ["devtools"] }

# gpui-pre 0.3.11 with `List` keeping item heights as hints on a width change instead of re-measuring every item; drop once upstream does.
# It also gives `img` its picture's ratio only when a side is auto, so a portrait picture stays inside a sized box; drop once upstream does.
# It also adds `Window::set_zoom`, drawing the whole window larger as a browser zooms; upstream has no equivalent.
# It also adds `ListState::height_from`, so the chat can size the room under a sent prompt; upstream has no equivalent.
# It also asks for a frame when a `List`'s height changes, since its view rendered against the old height; upstream has no equivalent.
# It also moves a `with_max_fps` animation in whole steps, waking at the start of each, where it drifted by however late each frame came.
# It also redraws a cached view when an entity it read is notified, where only notifying the view itself did; upstream has no equivalent.
# It also has an animation's next step redraw only its view, where notifying the view redrew every cached view that read it; upstream has no equivalent.
# It also scrolls a `List` by every wheel delta since its last paint, where a zero or reversed one dropped the rest and snapped it back; drop once upstream does.
# It also keeps the rows a `List` showed still when ones scrolled into above them turn out a different height than cached; drop once upstream does.
# It also logs what the frames around a scroll hitch did (`hitch.rs`), as pocket writes to `logs/chat-scroll.log`; upstream has no equivalent.
# It also adds `KeyBinding::load_for_os`, so a keymap built from strings needn't have an `App`; upstream has no equivalent.
# It also adds `backdrop_blur`, kept in `Scene::backdrops` apart from the primitives so other renderers ignore it; upstream has no equivalent.
# It also has `ListState::measure_all` measure for a few milliseconds a frame until done, where the first frame measured every item; upstream has no equivalent.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
# gpui-pre-macos 0.3.11 giving prompts the app icon explicitly, since macOS 26 sheet alerts drop the default one; drop once upstream does.
# It also asks for the Badge permission, without which macOS hides the Dock badge; upstream has no equivalent.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# gpui-pre-apple 0.3.11 blurring what lies behind a `backdrop_blur` element, for frosted popovers; upstream has no equivalent.
# Reading the drawable back makes every layer `framebufferOnly = false`, where only debug test builds were.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# gpui-base 0.9.0 clipping editor text to the right of the gutter instead of hiding it under an opaque gutter, so the editor can be glass; drop once upstream does.
# It also renders markdown like pluk-inc/markdown-preview: its block spacing, code blocks, lists, tables, GitHub alerts and footnotes; upstream has no equivalent.
# It also keeps the scrollbar of a table too wide to fit showing, so it reads as scrollable; upstream has no equivalent.
# It also types the paths of files dropped on an editable input, with `on_drop_paths` to take some first and `drop_paths` for a box around it; upstream has no equivalent.
# It also stops an input's caret blinking while the window is inactive, where it draws no caret but redrew the window twice a second.
# It also scrolls a textarea to the end of a paste once the pasted text is laid out, where it clamped to the pre-paste height; drop once upstream does.
# It also selects a table in reading order, cell by cell, when a drag starts outside it; drop once upstream does.
# It also wraps a long inline code span only once a line is full, where padding counted per word or glyph broke it every few characters; drop once upstream does.
# It also builds a paragraph's highlights in one pass over its inline children, where combining them per child was quadratic in its marks and a streaming reply paid it every frame; drop once upstream does.
# It also loads a document's relative and `file:` images from disk once given an `image_base`, where only `data:` images showed; upstream has no equivalent.
# It also highlights code blocks in the background parser, with `TextViewState::shared_code_block_highlighter` and a public `set_markdown_extensions` to give it what the view will; upstream has no equivalent.
gpui-base = { path = "vendor/gpui-base" }

# macOS's default "unpacked" leaves every build's .o files in target/debug/deps, which Cargo never removes.
[profile.dev]
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2

# chat's five-thousand-item refold test takes three minutes on CI unoptimized.
[profile.dev.package.chat]
opt-level = 2

# What scripts/release-mac.sh ships: smaller and slower to build than release, which stays quick for local measuring.
# Thin, not fat, LTO: fat linked pocket 2.4× slower for a 10% smaller binary.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
