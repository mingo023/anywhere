[package]
name = "pocket"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pocket-desktop"
path = "src/main.rs"

[features]
capture = ["gpui-kit/test-support"]

[dependencies]
agents.workspace = true
base64.workspace = true
channel.workspace = true
chrono.workspace = true
daemon.workspace = true
futures.workspace = true
git.workspace = true
gpui-kit.workspace = true
ignore.workspace = true
image = { workspace = true, features = ["tiff"] }
keys.workspace = true
merman.workspace = true
project.workspace = true
qrcode.workspace = true
resvg.workspace = true
serde_json.workspace = true
store.workspace = true
term.workspace = true
theme.workspace = true
tree-sitter-javascript.workspace = true
ui.workspace = true
web.workspace = true
workspace.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSEvent", "NSGraphics"] }
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSBundle", "NSError", "NSFileManager", "NSURL"] }
objc2-user-notifications = "0.3"
