# Lints and tests each package on every PR to main, each only when the PR touches what it reads.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.files.outputs.go }}
      pushrelay: ${{ steps.files.outputs.pushrelay }}
      protocol: ${{ steps.files.outputs.protocol }}
      ios: ${{ steps.files.outputs.ios }}
      desktop: ${{ steps.files.outputs.desktop }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, .previous_filename // empty')
          touched() { grep -qE "^(scripts/build-ghostty\.sh|\.github/workflows/ci\.yml)$|$1" <<< "$files" && echo true || echo false; }
          echo "go=$(touched '^packages/pocketd/')" >> "$GITHUB_OUTPUT"
          echo "pushrelay=$(touched '^packages/pushrelay/')" >> "$GITHUB_OUTPUT"
          # The protocol and iOS tests decode every golden frame pocketd writes.
          echo "protocol=$(touched '^((packages/protocol|packages/pocketd/internal/proto/testdata)/|(tsconfig\.base\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$)')" >> "$GITHUB_OUTPUT"
          echo "ios=$(touched '^(packages/ios/Packages|packages/pocketd/internal/proto/testdata)/')" >> "$GITHUB_OUTPUT"
          # Desktop tests read pocketd's golden frames and the chat fixture.
          echo "desktop=$(touched '^(packages/desktop|packages/pocketd/internal/proto/testdata|\.ui-review/fixture)/')" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/pocketd/go.mod
          cache-dependency-path: packages/pocketd/go.sum

      # internal/vt links libghostty through cgo.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty
        with:
          path: third_party/ghostty
          key: ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.0

      - name: Ghostty
        run: scripts/build-ghostty.sh

      - name: Format
        working-directory: packages/pocketd
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Vet
        working-directory: packages/pocketd
        run: go vet ./...

      - name: Staticcheck
        working-directory: packages/pocketd
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Test
        working-directory: packages/pocketd
        run: go test ./...

  pushrelay:
    needs: changes
    if: needs.changes.outputs.pushrelay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/pushrelay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/pushrelay/go.mod
          cache-dependency-path: packages/pushrelay/go.sum

      - name: Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Test
        run: go test ./...

  protocol:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds that only web needs stay off; strict-dep-builds would fail on them.
      - name: Install
        run: npx --yes pnpm@11.9.0 install --frozen-lockfile --filter protocol --config.strict-dep-builds=false

      - name: Test
        working-directory: packages/protocol
        run: node_modules/.bin/tsc -b && node --test test/*.test.mjs

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        working-directory: packages/ios/Packages/AnywhereKit
        run: swift test -Xswiftc -warnings-as-errors

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format
        working-directory: packages/desktop
        run: cargo fmt --all --check

      - name: Rust version
        id: rust
        run: echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Same key as cache-mac.yml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty
        with:
          path: third_party/ghostty
          key: ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/desktop/target
          key: cargo-ci-${{ steps.rust.outputs.rustc }}-${{ hashFiles('packages/desktop/Cargo.lock', 'packages/desktop/Cargo.toml') }}
          restore-keys: cargo-ci-${{ steps.rust.outputs.rustc }}-

      # Checkout stamps every file with now, which cargo reads as every path crate having changed since the cache
      # was built. Files still as target/sources lists them go back to before it.
      - name: Source mtimes
        run: |
          sources=packages/desktop/target/sources
          [ -f "$sources" ] || exit 0
          git ls-files -s | grep -Fxf "$sources" | cut -f2 | tr '\n' '\0' | xargs -0 touch -h -t 200001010000

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.0

      - name: Ghostty
        run: scripts/build-ghostty.sh

      - name: Build
        working-directory: packages/desktop
        run: cargo build --workspace

      - name: Clippy
        working-directory: packages/desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: packages/desktop
        run: cargo test --workspace

      # A cache this run saves must list the sources it was built from, not those of the cache it restored.
      - name: Sources
        run: git ls-files -s > packages/desktop/target/sources
