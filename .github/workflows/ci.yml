# Tests pocketd and builds and tests the desktop workspace on every PR to main, each only when the PR touches what it reads.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.files.outputs.go }}
      desktop: ${{ steps.files.outputs.desktop }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, .previous_filename // empty')
          touched() { grep -qE "^(scripts/build-ghostty\.sh|\.github/workflows/ci\.yml)$|$1" <<< "$files" && echo true || echo false; }
          echo "go=$(touched '^packages/pocketd/')" >> "$GITHUB_OUTPUT"
          # Desktop tests read pocketd's golden frames and the chat fixture.
          echo "desktop=$(touched '^(packages/desktop|packages/pocketd/internal/proto/testdata|\.ui-review/fixture)/')" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/pocketd/go.mod
          cache-dependency-path: packages/pocketd/go.sum

      # internal/vt links libghostty through cgo.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty
        with:
          path: third_party/ghostty
          key: ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.0

      - name: Ghostty
        run: scripts/build-ghostty.sh

      - name: Test
        working-directory: packages/pocketd
        run: go test ./...

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust version
        id: rust
        run: echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Same key as cache-mac.yml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty
        with:
          path: third_party/ghostty
          key: ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/desktop/target
          key: cargo-ci-${{ steps.rust.outputs.rustc }}-${{ hashFiles('packages/desktop/Cargo.lock', 'packages/desktop/Cargo.toml') }}
          restore-keys: cargo-ci-${{ steps.rust.outputs.rustc }}-

      # Checkout stamps every file with now, which cargo reads as every path crate having changed since the cache
      # was built. Files still as target/sources lists them go back to before it.
      - name: Source mtimes
        run: |
          sources=packages/desktop/target/sources
          [ -f "$sources" ] || exit 0
          git ls-files -s | grep -Fxf "$sources" | cut -f2 | tr '\n' '\0' | xargs -0 touch -h -t 200001010000

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.0

      - name: Ghostty
        run: scripts/build-ghostty.sh

      - name: Build
        working-directory: packages/desktop
        run: cargo build --workspace

      - name: Test
        working-directory: packages/desktop
        run: cargo test --workspace

      # A cache this run saves must list the sources it was built from, not those of the cache it restored.
      - name: Sources
        run: git ls-files -s > packages/desktop/target/sources
