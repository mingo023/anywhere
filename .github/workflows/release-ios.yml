# Uploads a tagged release's iPhone app to TestFlight and submits it to the public group: packages/ios/scripts/release.sh.
# Runs on a v* tag push, or dispatched on a tag by release.yml; secrets live in the `release` environment, which only v* tags can deploy to.
name: Release iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  testflight:
    # The app needs the iOS 26 SDK.
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: XcodeGen
        run: brew install xcodegen

      # The archive compiles Metal shaders, whose compiler Xcode 26 ships as a separate download.
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Archiving needs an Apple Development identity. Without one, Xcode mints a new certificate through the API key
      # on every run, until the team's certificate limit is reached.
      - name: Signing keychain
        env:
          CERT_P12: ${{ secrets.ANYWHERE_IOS_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.ANYWHERE_IOS_DEV_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # Splits on purpose: one argument per existing keychain path, none of which hold spaces on the runner.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: App Store Connect key
        env:
          ASC_KEY: ${{ secrets.ANYWHERE_ASC_KEY }}
        run: |
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc.p8"
          echo "ANYWHERE_ASC_KEY=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Release
        env:
          ANYWHERE_ASC_KEY_ID: ${{ secrets.ANYWHERE_ASC_KEY_ID }}
          ANYWHERE_ASC_ISSUER: ${{ secrets.ANYWHERE_ASC_ISSUER }}
        run: packages/ios/scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Remove keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc.p8"
